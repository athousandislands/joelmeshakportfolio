    const listeners = new Set();
    const requested = new Set();
    const decoded = new Set();
    let bestFormat = 'jpg';
    let formatReady = false;

    /* FIX 3 (companion): every network job below is cancellable so that
       navigating away actually stops the work instead of leaving abandoned
       downloads competing with the images the user is now looking at. */
    let controller = new AbortController();

    (function detectFormat() {
        const probe = (type, data) => new Promise(res => {
            const img = new Image();
            img.onload = () => res(img.width > 0);
            img.onerror = () => res(false);
            img.src = `data:${type};base64,${data}`;
        });
        probe('image/avif', 'AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxbWlhZk1BMUIAAADybWV0YQAAAAAAAAAoaGRscgAAAAAAAAAAcGljdAAAAAAAAAAAAAAAAGxpYmF2aWYAAAAADnBpdG0AAAAAAAEAAAAeaWxvYwAAAABEAAABAAEAAAABAAABGgAAAB0AAAAoaWluZgAAAAAAAQAAABppbmZlAgAAAAABAABhdjAxQ29sb3IAAAAAamlwcnAAAABLaXBjbwAAABRpc3BlAAAAAAAAAAEAAAABAAAAEHBpeGkAAAAAAwgICAAAAAxhdjFDgQAMAAAAABNjb2xybmNseAACAAIABoAAAAAXaXBtYQAAAAAAAAABAAEEAQKDBAAAACVtZGF0EgAKCBgABogQEDQgMgkQAAAAB8dSLfI=')
            .then(ok => { if (ok) { bestFormat = 'avif'; return true; } return probe('image/webp', 'UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA=='); })
            .then(ok => { if (ok === true && bestFormat !== 'avif') bestFormat = 'webp'; })
            .then(() => { formatReady = true; });
    })();

    function stripExt(path) {
        const i = path.lastIndexOf('.');
        return i === -1 ? path : path.slice(0, i);
    }

    function urlFor(src, displayCssPx) {
        const entry = ASSET_MANIFEST[src];
        if (!entry || !entry.v || !entry.v.length) return src;
        if (!formatReady) return src;
        const needed = Math.ceil((displayCssPx || 0) * Math.min(V.dpr, DPR_CAP));
        let pick = entry.v[entry.v.length - 1];
        for (let i = 0; i < entry.v.length; i++) {
            if (entry.v[i] >= needed) { pick = entry.v[i]; break; }
        }
        if (pick >= entry.w) return src;
        return `assets/_derived/${stripExt(src)}-${pick}.${bestFormat}`;
    }

    function setDims(src, w, h) {
        if (!w || !h) return;
        const prev = dims.get(src);
        if (prev && prev.w === w && prev.h === h) return;
        dims.set(src, { w, h, aspect: w / h });
        listeners.forEach(fn => fn(src));
    }

    Object.keys(ASSET_MANIFEST).forEach(src => {
        const e = ASSET_MANIFEST[src];
        if (e && e.w && e.h) dims.set(src, { w: e.w, h: e.h, aspect: e.w / e.h });
    });

    function allowBackfill() {
        const c = navigator.connection;
        if (!c) return true;
        if (c.saveData) return false;
        return !/(^|-)2g$/.test(c.effectiveType || '');
    }

    function warm(src, { decode = false, priority = 'low', displayPx = 0 } = {}) {
        const url = urlFor(src, displayPx);
        if (requested.has(url) && (!decode || decoded.has(url))) return Promise.resolve();
        requested.add(url);

        const img = new Image();
        if ('fetchPriority' in img) img.fetchPriority = priority;
        img.decoding = 'async';

        const done = new Promise(res => {
            img.onload = () => {
                setDims(src, img.naturalWidth, img.naturalHeight);
                if (decode && img.decode) {
                    img.decode().then(() => { decoded.add(url); res(); }).catch(res);
                } else res();
            };
            img.onerror = () => { requested.delete(url); res(); };
        });
        img.src = url;
        return done;
    }

    /* Serialised queue, now driven by the real idle scheduler (FIX 8). */
    const queue = [];
    let draining = false;
    function drain() {
        if (draining) return;
        draining = true;
        const step = () => {
            if (!queue.length) { draining = false; return; }
            queue.sort((a, b) => a.tier - b.tier);
            const batch = queue.splice(0, 3).map(job => warm(job.src, job.opts));
            Promise.all(batch).then(() => Idle.run(step));
        };
        Idle.run(step);
    }
    function enqueue(src, tier, opts) {
        if (requested.has(urlFor(src, opts && opts.displayPx))) return;
        queue.push({ src, tier, opts: opts || {} });
        drain();
    }

    const projectImages = (i) => {
        const out = [];
        buildMediaData(allProjectsData[i]).forEach(cl => {
            cl.assets.forEach(a => { if (a.type === 'img') out.push(a.src); });
        });
        return out;
    };

    const prefetchedProjects = new Set();

    return {
        urlFor,
        get: (src) => dims.get(src) || null,
        setDims,
        onResolve(fn) { listeners.add(fn); },
        get signal() { return controller.signal; },

        /* Drop everything still queued. Called on scene transitions so an
           abandoned project stops competing for bandwidth and decode time. */
        cancelPending() {
            queue.length = 0;
            controller.abort();
            controller = new AbortController();
        },

        warmCovers() {
            allProjectsData.forEach((p) => {
                const first = buildMediaData(p)[0];
                if (!first) return;
                /* FIX (startup): only the FIRST cover per project is decoded
                   eagerly now, not three. A decoded large image is ~12MB of
                   short-lived RAM; twelve of them at t=1.5s produced an
                   allocate-then-collect spike that showed up as a stutter. */
                first.assets.slice(0, 3).forEach((a, idx) => {
                    if (a.type === 'img') {
                        enqueue(a.src, 1, { decode: idx === 0, priority: 'low', displayPx: 400 });
                    }
                });
            });
        },

        prefetchProject(i) {
            if (i === 99 || prefetchedProjects.has(i)) return;
            prefetchedProjects.add(i);
            projectImages(i).forEach(src => enqueue(src, 2, { priority: 'high', displayPx: 800 }));
        },

        backfill() {
            if (!allowBackfill()) return;
            allProjectsData.forEach((_, i) => {
                projectImages(i).forEach(src => enqueue(src, 3, { priority: 'low', displayPx: 800 }));
            });
        }
    };
})();

const MediaDims = Assets;

/* ==========================================================================
   5b. VIDEO POSTERS  (queued build step, like the KTX2 files)
   --------------------------------------------------------------------------
   preload="none" is the cheapest possible resting state for a <video>: no
   network, no decoder, no memory. But with no preload the element paints
   nothing until playback starts, so it MUST have a poster or the card is
   blank — and iOS in particular will not reliably paint a first frame from
   preload="metadata" either.

   Until posters are generated this stays false and videos keep
   preload="metadata", which is the current (safe) behaviour. Flip `enabled`
   to true once the files exist.

   GENERATE WITH:
     for f in $(find assets/projects -name '*.mp4' -o -name '*.webm'); do
       out="assets/_posters/${f%.*}.webp"
       mkdir -p "$(dirname "$out")"
       ffmpeg -i "$f" -vf "select=eq(n\,0),scale=800:-1" -frames:v 1 -q:v 80 "$out"
     done
   ========================================================================== */
const VIDEO_POSTERS = {
    enabled: false,
    dir: 'assets/_posters/',
    ext: '.webp'
};

function posterFor(src) {
    if (!VIDEO_POSTERS.enabled) return '';
    const noExt = src.replace(/\.[^.]+$/, '');
    return `${VIDEO_POSTERS.dir}${noExt}${VIDEO_POSTERS.ext}`;
}

/* Resting preload level for a video that is not currently playing. */
const IDLE_PRELOAD = () => (VIDEO_POSTERS.enabled ? 'none' : 'metadata');

/* ==========================================================================
   6. SCENE 2 — COLLECTIONS
   ========================================================================== */
const S2 = (() => {
    const FOV = 45;
    const HALF_TAN = Math.tan(FOV * Math.PI / 360);

    const CARD_W = 5.94;
    const CARD_H = 4.32;
    const CARD_RADIUS = 0.4;
    const GAP_X_RATIO = 1.30;
    const GAP_Y_RATIO = 1.65;
    const TITLE_OFFSET = 3.6;

    const GRID_PAD = 0.15;
    const GRID_PAD_COMPACT = 0.28;

    const STATE = { CLUSTERED: 1, OPENING: 2, CAROUSEL: 3, CLOSING: 4 };

    /* Video policy. The cap survives from earlier passes — mobile hardware
       decoders are a small shared pool. The trigger is now uniform on both
       desktop and touch: an IntersectionObserver drives playback everywhere.

       Hover was tried and removed: it never actually worked. #click-blocker
       (z-index 100) is a sibling of #dom-layer (z-index 10) in the SAME
       stacking context, so no z-index a card sets on itself can place it
       above the blocker — and the blocker is active for essentially the
       entire open→carousel→closing lifetime. Video cards live inside
       #dom-layer only while projected, i.e. exactly when the blocker is
       covering them, so a mouseenter could never reach them. That's the
       concrete reason hover read as "not showing at all."

       New rule: the TOP card (index 0) of any cluster is an autoplay anchor
       — it plays whenever it's visible, whether that's the resting grid
       stack or an open carousel, and it always claims one of the two
       playback slots. This is what makes a single-video cluster (most of
       them) play continuously without the user doing anything. */
    const MAX_CONCURRENT_VIDEOS = 2;
    let videoObserver = null;
    const playingVideos = [];   // membership only; cap is enforced by reconcileVideoPlayback

    const dom = {
        root: document.getElementById('scene-two'),
        layer: document.getElementById('dom-layer'),
        scroller: document.getElementById('native-scroll-container'),
        scrollContent: document.getElementById('native-scroll-content'),
        blocker: document.getElementById('click-blocker'),
        info: document.getElementById('collection-info'),
        infoTitle: document.getElementById('info-title'),
        infoDesc: document.getElementById('info-desc'),
        closeBtn: document.getElementById('close-btn'),
        backBtn: document.getElementById('scene-two-back-btn')
    };

    const cache = {};
    let clusters = [];
    let mediaData = [];
    let activeProject = -1;

    const cam = { z: 20, y: 0 };
    let focal = 1;
    let baseScale = 1;
    let rasterScale = 1;
    let initialCamY = 0;
    let maxScrollPx = 0;
    let scrollAtOpen = 0;

    let state = STATE.CLUSTERED;
    let activeCluster = -1;
    let openProgress = 0;
    let arrival = 0;
    let carouselPos = 0;
    let carouselTarget = 0;
    let carouselScale = 1;
    let carouselZ = 0;
    let layoutDirty = true;
    let projecting = false;
    let projectedCluster = -1;

    /* FIX 9b: measured ONCE per open, not read inside the render loop.
       layoutCarousel() previously called dom.info.getBoundingClientRect()
       from inside frame(), immediately after GSAP's ticker had written styles
       in the same frame — a textbook forced-synchronous-layout thrash. */
    let infoSafeTop = 0;

    let lastScrollOpacity = -1;

    /* ---------- projector ---------- */
    const scaleAt = (z) => focal / (cam.z - z);
    const screenX = (x, z) => V.width / 2 + x * scaleAt(z);
    const screenY = (y, z) => V.height / 2 - (y - cam.y) * scaleAt(z);
    const worldXAtPx = (px, z) => (px - V.width / 2) / scaleAt(z);
    const worldYAtPx = (py, z) => cam.y + (V.height / 2 - py) / scaleAt(z);

    /* ---------- construction (lazy, per project) ---------- */
    function buildProject(index) {
        if (cache[index]) return cache[index];

        const project = allProjectsData[index];
        const md = buildMediaData(project);
        const cardScale = project.cardScale || 1.0;
        const built = [];

        md.forEach((clusterData, clusterIndex) => {
            const cards = clusterData.assets.map((media, j) => {
                const el = document.createElement('div');
                el.className = 'dom-card';

                let mediaEl;
                if (media.type === 'video') {
                    el.classList.add('is-video');
                    mediaEl = document.createElement('video');
                    mediaEl.loop = true;
                    mediaEl.muted = true;
                    mediaEl.playsInline = true;
                    mediaEl.setAttribute('playsinline', '');
                    mediaEl.preload = IDLE_PRELOAD();
                    const poster = posterFor(media.src);
                    if (poster) mediaEl.poster = poster;
                    mediaEl.src = media.src;
                    mediaEl.addEventListener('loadedmetadata', function () {
                        Assets.setDims(media.src, this.videoWidth, this.videoHeight);
                    });
                } else {
                    mediaEl = document.createElement('img');
                    mediaEl.decoding = 'async';
                    mediaEl.alt = '';
                    mediaEl.addEventListener('load', function () {
                        Assets.setDims(media.src, this.naturalWidth, this.naturalHeight);
                    });
                }

                el.appendChild(mediaEl);

                let baseRotZ = 0;
                const n = clusterData.assets.length;
                if (n >= 3) {
                    if (j === 0) baseRotZ = 14 * Math.PI / 180;
                    else if (j === 1) baseRotZ = -14 * Math.PI / 180;
                } else if (n === 2 && j === 0) {
                    baseRotZ = 10 * Math.PI / 180;
                }

                const card = {
                    el, mediaEl,
                    src: media.src,
                    isVideo: media.type === 'video',
                    playing: false,
                    clusterIndex,
                    /* Decode gate (item 3). `wanted` controls whether this
                       card's <img> gets a src at all. Only the three covers
                       of each cluster are wanted at project load; the rest
                       are unlocked when their cluster is opened. Downloading
                       (Assets.prefetchProject) stays as it was — this splits
                       DECODE from DOWNLOAD rather than removing either. */
                    wanted: false,
                    srcApplied: '',
                    srcNeeded: 0,
                    index: j,
                    baseRotZ,
                    wWorld: CARD_W * cardScale,
                    hWorld: CARD_H * cardScale,
                    cx: 0, cy: 0,
                    gridX: 0, gridY: 0,
                    lastTransform: '',
                    lastOpacity: -1,
                    lastDisplay: '',
                    lastZ: -1,
                    lastW: -1, lastH: -1
                };

                return card;
            });

            const titleEl = document.createElement('div');
            titleEl.className = 'cluster-title';
            titleEl.textContent = clusterData.title;

            built.push({
                cards,
                titleEl,
                home: { x: 0, y: 0 },
                maxScroll: 0,
                lastTitleTransform: '',
                lastTitleOpacity: -1
            });
        });

        cache[index] = { clusters: built, mediaData: md, cardScale };
        return cache[index];
    }

    /* ---------- card world size from resolved aspect ---------- */
    function sizeCard(card, cardScale) {
        const boxW = CARD_W * cardScale;
        const boxH = CARD_H * cardScale;
        const d = Assets.get(card.src);
        if (!d) { card.wWorld = boxW; card.hWorld = boxH; return; }
        const boxAspect = boxW / boxH;
        if (d.aspect < boxAspect) {
            card.hWorld = boxH;
            card.wWorld = boxH * d.aspect;
        } else {
            card.wWorld = boxW;
            card.hWorld = boxW / d.aspect;
        }
    }

    function maxCarouselScale(cardScale) {
        const padSide = V.width * 0.06;
        if (V.compact) return (V.width - padSide * 2) / (CARD_W * cardScale);
        const generousTop = V.height * 0.18;
        const padBottom = V.height * 0.08;
        return Math.min(
            (V.height - generousTop - padBottom) / (CARD_H * cardScale),
            (V.width - padSide * 2) / (CARD_W * cardScale)
        );
    }

    /* ---------- grid layout (runs on resize, not on scroll) ---------- */
    function layoutGrid() {
        const cols = V.columns;
        const cardScale = cache[activeProject] ? cache[activeProject].cardScale : 1;

        const gapX = (CARD_W * cardScale) * GAP_X_RATIO;
        const gapY = (CARD_H * cardScale) * GAP_Y_RATIO;

        const baseTitleOffset = V.compact ? TITLE_OFFSET * 0.75 : TITLE_OFFSET;
        const titleOffset = baseTitleOffset * cardScale;

        const rows = Math.ceil(clusters.length / cols) || 1;

        const frameRows = cols === 1 ? 1 : 2;
        const pad = V.compact ? GRID_PAD_COMPACT : GRID_PAD;

        const frameCardW = V.compact ? CARD_W * cardScale : CARD_W;
        const frameCardH = V.compact ? CARD_H * cardScale : CARD_H;
        const frameW = (cols - 1) * gapX + frameCardW;
        const frameH = (frameRows - 1) * gapY + frameCardH + titleOffset;

        cam.z = fitDistance(frameW, frameH, FOV, pad);
        focal = (V.height / 2) / HALF_TAN;
        baseScale = scaleAt(0);

        rasterScale = Math.max(baseScale, maxCarouselScale(cardScale));

        const visible = visibleSizeAt(cam.z, FOV);
        const startX = -((cols - 1) * gapX) / 2;

        clusters.forEach((c, i) => {
            c.cards.forEach(card => sizeCard(card, cardScale));
            c.home.x = startX + (i % cols) * gapX;
            c.home.y = -Math.floor(i / cols) * gapY;
        });

        const contentTop = (CARD_H * cardScale) / 2;
        const contentBottom = -(rows - 1) * gapY - (CARD_H * cardScale) / 2 - titleOffset;
        const contentH = contentTop - contentBottom;
        const padY = visible.h * 0.10;

        if (contentH + padY * 2 <= visible.h) {
            initialCamY = (contentTop + contentBottom) / 2;
            maxScrollPx = 0;
        } else {
            initialCamY = contentTop + padY - visible.h / 2;
            maxScrollPx = (contentH + padY * 2 - visible.h) * baseScale;
        }

        dom.scrollContent.style.height = (V.height + maxScrollPx) + 'px';
        applyScroll(dom.scroller.scrollTop);

        const contentY = (yWorld) => V.height / 2 - (yWorld - initialCamY) * baseScale;

        clusters.forEach((c) => {
            const cx = screenX(c.home.x, 0);
            const cy = contentY(c.home.y);
            c.cards.forEach(card => {
                card.gridX = cx;
                card.gridY = cy;
                if (!projecting) {
                    card.el.style.left = cx + 'px';
                    card.el.style.top = cy + 'px';
                }
            });
            c.titleEl.style.left = cx + 'px';
            c.titleEl.style.top = contentY(c.home.y - titleOffset) + 'px';
            c.titleEl.style.transform = 'translate(-50%, -50%)';
        });

        sizeElements();
        if (!projecting) writeGridTransforms();
    }

    function sizeElements() {
        clusters.forEach(c => {
            c.cards.forEach(card => {
                const w = Math.round(card.wWorld * rasterScale);
                const h = Math.round(card.hWorld * rasterScale);
                if (w !== card.lastW || h !== card.lastH) {
                    card.el.style.width = w + 'px';
                    card.el.style.height = h + 'px';
                    card.el.style.borderRadius = (CARD_RADIUS * rasterScale).toFixed(1) + 'px';
                    card.lastW = w; card.lastH = h;
                }
                if (!card.isVideo && card.wanted) {
                    const needed = card.wWorld * rasterScale;
                    if (needed > card.srcNeeded) {
                        const url = Assets.urlFor(card.src, needed);
                        if (url !== card.srcApplied) {
                            card.srcApplied = url;
                            card.srcNeeded = needed;
                            card.mediaEl.src = url;
                        }
                    }
                }
            });
        });
    }

    function writeGridTransforms() {
        const s = baseScale / rasterScale;
        clusters.forEach((c, i) => {
            const clusterStagger = i * 0.08;
            const dur = 1 + clusters.length * 0.08;
            const ap = clamp(arrival * dur - clusterStagger, 0, 1);
            const ease = 1 - Math.pow(1 - ap, 3);
            const scale = s * (0.85 + 0.15 * ease);

            c.cards.forEach((card, j) => {
                const display = j < 3 ? 'flex' : 'none';
                if (display !== card.lastDisplay) {
                    card.el.style.display = display;
                    card.lastDisplay = display;
                }
                if (display === 'none') return;

                if (ease !== card.lastOpacity) {
                    card.el.style.opacity = ease;
                    card.lastOpacity = ease;
                }
                const t = `translate(-50%, -50%) scale(${scale.toFixed(4)}) rotateZ(${(-card.baseRotZ).toFixed(4)}rad)`;
                if (t !== card.lastTransform) {
                    card.el.style.transform = t;
                    card.lastTransform = t;
                }
                const zi = 500 + i * 100 + (c.cards.length - j);
                if (zi !== card.lastZ) { card.el.style.zIndex = zi; card.lastZ = zi; }
            });

            if (c.lastTitleOpacity !== 1) { c.titleEl.style.opacity = 1; c.lastTitleOpacity = 1; }
        });
    }

    function applyScroll(px) {
        cam.y = initialCamY - clamp(px, 0, maxScrollPx) / baseScale;
    }

    /* ---------- decode gating (item 3) ---------- */

    /* Unlock decoding for a whole cluster. Called when the cluster is opened,
       i.e. at the start of a ~1s animation — ample runway when the bytes are
       already in the HTTP cache from Assets.prefetchProject. */
    function ensureClusterDecoded(index) {
        const c = clusters[index];
        if (!c) return;
        let changed = false;
        c.cards.forEach(card => {
            if (!card.wanted) { card.wanted = true; changed = true; }
        });
        if (changed) sizeElements();
    }

    /* ---------- video playback ---------- */
    function startVideo(card) {
        if (!card.isVideo || card.playing) return;
        card.playing = true;
        card.mediaEl.preload = 'auto';
        const p = card.mediaEl.play();
        if (p && p.catch) p.catch(() => { card.playing = false; });
        if (playingVideos.indexOf(card) === -1) playingVideos.push(card);
    }

    /* Pause WITHOUT rewinding: returning the pointer/scroll resumes where it
       left off, unless reset is requested (used when actually leaving). */
    function stopVideo(card, reset = false) {
        const i = playingVideos.indexOf(card);
        if (i !== -1) playingVideos.splice(i, 1);
        if (card.playing) {
            card.playing = false;
            card.mediaEl.pause();
        }
        if (reset) {
            try { card.mediaEl.currentTime = 0; } catch (e) { /* not seekable yet */ }
            card.mediaEl.preload = IDLE_PRELOAD();
        }
    }

    /* Leaving ONE cluster (closing it) resets only that cluster's clips.
       Other clusters' ambient top-card playback is untouched. */
    function resetClusterVideos(index) {
        const c = clusters[index];
        if (!c) return;
        c.cards.forEach(card => { if (card.isVideo) stopVideo(card, true); });
    }

    /* Leaving the whole project resets everything. */
    function resetAllVideos() {
        clusters.forEach(c => c.cards.forEach(card => {
            if (card.isVideo) stopVideo(card, true);
        }));
        playingVideos.length = 0;
    }

    /* Single source of truth for the cap. Recomputes the target set of
       cards that should be playing right now and diffs against reality —
       stop first, then start, so the cap (MAX_CONCURRENT_VIDEOS) is never
       exceeded even momentarily.

       Two contexts, mutually exclusive:
         - A cluster is open: every video card in THAT cluster is a
           candidate. The top card (index 0) is always given priority for a
           slot when visible; the remaining slot(s) go to whatever else is
           most visible, so new videos join as the user scrolls toward them.
         - Resting grid: only each cluster's TOP card is a candidate (that's
           the only card ever shown at rest), so at most a couple of
           different clusters' anchor videos can be playing ambiently at once. */
    function reconcileVideoPlayback() {
        let candidates;
        if (activeCluster !== -1) {
            const c = clusters[activeCluster];
            candidates = c ? c.cards.filter(card => card.isVideo) : [];
        } else {
            candidates = clusters
                .map(c => c.cards[0])
                .filter(card => card && card.isVideo);
        }

        const visible = candidates.filter(card => (card.el._visRatio || 0) > 0.4);
        visible.sort((a, b) => {
            const aTop = a.index === 0 ? 1 : 0;
            const bTop = b.index === 0 ? 1 : 0;
            if (aTop !== bTop) return bTop - aTop;
            return (b.el._visRatio || 0) - (a.el._visRatio || 0);
        });

        const shouldPlay = new Set(visible.slice(0, MAX_CONCURRENT_VIDEOS));
        playingVideos.slice().forEach(card => { if (!shouldPlay.has(card)) stopVideo(card); });
        shouldPlay.forEach(card => { if (!card.playing) startVideo(card); });
    }

    function ensureVideoObserver() {
        if (videoObserver || typeof IntersectionObserver === 'undefined') return;
        videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(e => { e.target._visRatio = e.intersectionRatio; });
            reconcileVideoPlayback();
        }, { threshold: [0, 0.25, 0.4, 0.6, 0.8, 1] });
    }

    /* Called once per project load: the top card of every video-bearing
       cluster is watched for the lifetime of the project, so ambient
       playback works in the resting grid without the user opening anything. */
    function observeTopCards() {
        ensureVideoObserver();
        if (!videoObserver) return;
        clusters.forEach(c => {
            const top = c.cards[0];
            if (top && top.isVideo) videoObserver.observe(top.el);
        });
    }

    /* Called on open(): extends observation to the rest of that cluster's
       video cards (idempotent — re-observing the top card is a no-op). */
    function observeClusterVideos(index) {
        ensureVideoObserver();
        if (!videoObserver) return;
        const c = clusters[index];
        if (!c) return;
        c.cards.forEach(card => { if (card.isVideo) videoObserver.observe(card.el); });
    }

    function unobserveVideos() {
        if (videoObserver) videoObserver.disconnect();
    }

    /* ---------- carousel layout ---------- */
    function measureInfoSafeTop() {
        const infoRect = dom.info.getBoundingClientRect();
        const gap = V.height * 0.035;
        infoSafeTop = Math.max(infoRect.bottom + gap, V.height * 0.12);
    }

    function layoutCarousel(clusterIndex) {
        const c = clusters[clusterIndex];
        if (!c) return;

        const safeTop = infoSafeTop || V.height * 0.12;
        const padSide = V.width * 0.06;
        const padBottom = V.height * 0.08;

        const cardScale = cache[activeProject] ? cache[activeProject].cardScale : 1;
        c.cards.forEach(card => sizeCard(card, cardScale));

        let targetScale;
        if (V.compact) {
            targetScale = (V.width - padSide * 2) / (CARD_W * cardScale);
        } else {
            targetScale = Math.min(
                (V.height - safeTop - padBottom) / (CARD_H * cardScale),
                (V.width - padSide * 2) / (CARD_W * cardScale)
            );
        }

        const minDistance = cam.z * 0.22;
        targetScale = Math.min(targetScale, focal / minDistance, rasterScale);
        carouselScale = targetScale;
        carouselZ = cam.z - focal / targetScale;

        const gapPx = V.compact ? V.height * 0.014 : V.width * 0.018;
        let overflowPx = 0;

        if (V.compact) {
            let cursor = safeTop;
            c.cards.forEach(card => {
                const hpx = card.hWorld * targetScale;
                card.cx = 0;
                card.cy = worldYAtPx(cursor + hpx / 2, carouselZ) - cam.y;
                cursor += hpx + gapPx;
            });
            cursor -= gapPx;
            overflowPx = Math.max(0, cursor + padBottom - V.height);
        } else {
            const bandCenter = (safeTop + (V.height - padBottom)) / 2;
            const cyWorld = worldYAtPx(bandCenter, carouselZ) - cam.y;
            let cursor = padSide;
            c.cards.forEach(card => {
                const wpx = card.wWorld * targetScale;
                card.cx = worldXAtPx(cursor + wpx / 2, carouselZ);
                card.cy = cyWorld;
                cursor += wpx + gapPx;
            });
            cursor -= gapPx;
            overflowPx = Math.max(0, cursor + padSide - V.width);
        }

        c.maxScroll = overflowPx / targetScale;
        carouselTarget = clamp(carouselTarget, 0, c.maxScroll);
        carouselPos = clamp(carouselPos, 0, c.maxScroll);
    }

    function relayout() {
        if (!clusters.length) return;
        layoutGrid();
        if (activeCluster !== -1) {
            measureInfoSafeTop();
            layoutCarousel(activeCluster);
        }
    }

    /* ---------- reparenting (FIX 6) ----------------------------------------
       Only the cluster actually being opened is promoted and projected. The
       rest of the grid stays exactly where it is and is faded as ONE
       composited group via #native-scroll-content.

       Before: every card in every cluster got `will-change`, `display:flex`
       and a reparent on the same frame the open animation began — roughly
       20-30 layer creations plus decodes for cards that were about to be
       hidden again one frame later. That was the open-transition stutter.
       ---------------------------------------------------------------------- */
    function enterProjected(idx) {
        projecting = true;
        projectedCluster = idx;
        dom.scrollContent.classList.add('fading');
        const c = clusters[idx];
        c.cards.forEach(card => {
            card.el.classList.add('animating');
            card.el.style.left = '0px';
            card.el.style.top = '0px';
            if (card.lastDisplay !== 'flex') {
                card.el.style.display = 'flex';
                card.lastDisplay = 'flex';
            }
            card.lastTransform = '';
            card.lastOpacity = -1;
            card.lastZ = -1;
            dom.layer.appendChild(card.el);
        });
    }

    function exitProjected(idx) {
        projecting = false;
        projectedCluster = -1;
        const c = clusters[idx];
        if (c) {
            c.cards.forEach(card => {
                card.el.classList.remove('animating');
                card.el.style.left = card.gridX + 'px';
                card.el.style.top = card.gridY + 'px';
                card.lastTransform = '';
                card.lastOpacity = -1;
                dom.scrollContent.appendChild(card.el);
            });
        }
        dom.scrollContent.classList.remove('fading');
        dom.scrollContent.style.opacity = '';
        lastScrollOpacity = -1;
        writeGridTransforms();
    }

    /* ---------- project activation / deactivation ---------- */
    function deactivateCurrent() {
        if (activeProject === -1 || !cache[activeProject]) return;
        unobserveVideos();
        resetAllVideos();
        cache[activeProject].clusters.forEach(c => {
            c.cards.forEach(card => {
                if (card.el.parentNode) card.el.parentNode.removeChild(card.el);
                card.lastDisplay = '';
            });
            if (c.titleEl.parentNode) c.titleEl.parentNode.removeChild(c.titleEl);
        });
    }

    function load(index) {
        if (activeCluster !== -1) close(true);
        deactivateCurrent();

        const rec = buildProject(index);
        activeProject = index;
        clusters = rec.clusters;
        mediaData = rec.mediaData;
        projecting = false;
        projectedCluster = -1;

        clusters.forEach(c => {
            c.cards.forEach((card, j) => {
                /* Only the three covers are decoded up front (item 3). */
                if (j < 3) card.wanted = true;
                card.el.classList.remove('animating');
                card.lastTransform = '';
                card.lastOpacity = -1;
                card.lastDisplay = '';
                card.lastW = -1;
                dom.scrollContent.appendChild(card.el);
            });
            c.titleEl.style.opacity = 1;
            c.lastTitleOpacity = 1;
            dom.scrollContent.appendChild(c.titleEl);
        });

        dom.scroller.style.display = 'block';
        dom.scroller.style.overflowY = 'auto';
        dom.scroller.scrollTop = 0;

        state = STATE.CLUSTERED;
        activeCluster = -1;
        openProgress = 0;
        carouselPos = carouselTarget = 0;

        /* Watch every cluster's top card for the lifetime of this project, so
           a single-video cluster (most of them) just plays continuously
           once it's visible — grid or carousel, no interaction needed. */
        observeTopCards();

        relayout();

        arrival = 0;
        if (REDUCED_MOTION) {
            arrival = 1;
            writeGridTransforms();
        } else {
            const proxy = { v: 0 };
            gsap.to(proxy, {
                v: 1, duration: 1.44, ease: 'power3.out',
                onUpdate: () => { arrival = proxy.v; if (!projecting) writeGridTransforms(); }
            });
        }
    }

    function unload() {
        deactivateCurrent();
        dom.scroller.style.display = 'none';
    }

    /* ---------- open / close ---------- */
    function open(index) {
        if (activeCluster !== -1) return;
        activeCluster = index;

        const data = mediaData[index];
        dom.infoTitle.textContent = data.title;
        dom.infoDesc.innerHTML = data.description;

        /* Unlock decoding for this cluster's non-cover images (item 3). */
        ensureClusterDecoded(index);

        /* One deliberate synchronous measurement, taken here and cached for
           the whole open/carousel/close cycle. */
        measureInfoSafeTop();

        scrollAtOpen = dom.scroller.scrollTop;
        applyScroll(scrollAtOpen);
        carouselPos = carouselTarget = 0;
        layoutCarousel(index);

        dom.scroller.style.overflowY = 'hidden';
        dom.blocker.classList.add('active');
        dom.info.classList.add('active');
        dom.closeBtn.classList.add('active');
        dom.backBtn.classList.remove('active');

        enterProjected(index);
        /* Extends observation from just the top card to every video card in
           this cluster. If the top card was already playing ambiently in the
           grid, it keeps playing right through this transition — nothing
           restarts. The rest join as their IntersectionObserver entries
           arrive (typically within a frame). */
        observeClusterVideos(index);
        reconcileVideoPlayback();

        state = STATE.OPENING;
        openProgress = 0;
        const dur = REDUCED_MOTION ? 0 : (V.compact ? 0.8924 : 1.0476);
        const proxy = { v: 0 };
        gsap.to(proxy, {
            v: 1, duration: dur, ease: 'power4.inOut',
            onUpdate: () => { openProgress = proxy.v; },
            onComplete: () => { state = STATE.CAROUSEL; }
        });
    }

    function close(instant = false) {
        if (activeCluster === -1) return;

        const closing = activeCluster;

        dom.closeBtn.classList.remove('active');
        dom.backBtn.classList.add('active');
        dom.scroller.style.overflowY = 'auto';
        state = STATE.CLOSING;

        /* Leaving THIS cluster resets its own clips. Other clusters' ambient
           top-card playback is untouched — closing one carousel shouldn't
           interrupt an unrelated video quietly looping in the grid. */
        resetClusterVideos(closing);

        if (instant) {
            dom.info.classList.remove('active');
            dom.blocker.classList.remove('active');
            openProgress = 0;
            carouselPos = carouselTarget = 0;
            state = STATE.CLUSTERED;
            activeCluster = -1;
            exitProjected(closing);
            reconcileVideoPlayback();
            return;
        }

        /* Both halves of the return now run CONCURRENTLY. They used to be
           sequential — scroll the carousel strip back to its start, THEN
           collapse into the stack — which read as two separate snaps
           (the strip re-arranging itself, then a hard cut to 3 images). Now
           both tweens start at the same instant, and cards past index 3 fade
           to fully transparent as part of the same motion (frame()'s
           state === CLOSING branch), so what's left when everything settles
           is already just the 3-card stack at its resting opacity. */
        const tl = gsap.timeline({
            defaults: { ease: 'power2.inOut' },
            onComplete: () => {
                state = STATE.CLUSTERED;
                activeCluster = -1;
                carouselPos = carouselTarget = 0;
                exitProjected(closing);
                reconcileVideoPlayback();
            }
        });

        if (!REDUCED_MOTION && carouselPos > 0.01) {
            const proxy = { v: carouselPos };
            tl.to(proxy, {
                v: 0, duration: V.compact ? 0.63 : 0.9,
                onUpdate: () => { carouselPos = carouselTarget = proxy.v; }
            }, 0);
        } else {
            carouselPos = carouselTarget = 0;
        }

        tl.call(() => {
            dom.info.classList.remove('active');
            dom.blocker.classList.remove('active');
        }, null, 0);

        const proxy2 = { v: openProgress };
        tl.to(proxy2, {
            v: 0,
            duration: REDUCED_MOTION ? 0 : (V.compact ? 1.1808 : 1.496),
            ease: 'power2.out',
            onUpdate: () => { openProgress = proxy2.v; }
        }, 0);
    }

    function applyCarouselDelta(deltaPx) {
        if (!isFinite(deltaPx) || activeCluster === -1) return;
        const c = clusters[activeCluster];
        const speed = V.compact ? 2.0 : 1.2;
        carouselTarget = clamp(carouselTarget + (deltaPx / carouselScale) * speed, 0, c.maxScroll);
    }

    /* ---------- hit testing ---------- */
    function hitTest(px, py) {
        for (let i = 0; i < clusters.length; i++) {
            const c = clusters[i];
            const cx = screenX(c.home.x, 0);
            const cy = screenY(c.home.y, 0);
            const hw = (CARD_W * 1.5 * baseScale) / 2;
            const hh = (CARD_H * 1.5 * baseScale) / 2;
            if (px >= cx - hw && px <= cx + hw && py >= cy - hh && py <= cy + hh) return i;
        }
        return -1;
    }

    /* ---------- frame (projected states only) ---------- */
    const FIXED_STAGGER = 0.24;

    function frame() {
        if (layoutDirty) { layoutDirty = false; relayout(); }
        if (!projecting) return;

        if (state === STATE.CAROUSEL) {
            carouselPos += (carouselTarget - carouselPos) * 0.10;
        }

        if (state === STATE.CAROUSEL || state === STATE.CLOSING) {
            const off = -carouselPos * carouselScale;
            dom.info.style.transform = V.compact
                ? `translate3d(-50%, ${off}px, 0)`
                : `translate3d(${off}px, 0, 0)`;
        } else {
            dom.info.style.transform = V.compact ? 'translate3d(-50%, 0, 0)' : 'translate3d(0, 0, 0)';
        }

        /* The whole un-opened grid fades as ONE layer (FIX 6). */
        const gridOpacity = +(1 - openProgress).toFixed(3);
        if (gridOpacity !== lastScrollOpacity) {
            dom.scrollContent.style.opacity = gridOpacity;
            lastScrollOpacity = gridOpacity;
        }

        const i = projectedCluster;
        const c = clusters[i];
        if (!c) return;

        const rasterRatio = 1 / rasterScale;
        const n = c.cards.length;
        const durationMul = 1 + FIXED_STAGGER;
        const stagger = n > 1 ? FIXED_STAGGER / (n - 1) : 0;

        for (let j = 0; j < n; j++) {
            const card = c.cards[j];
            const startX = c.home.x;
            const startY = c.home.y;
            const startZ = -j * 0.1;

            const p = clamp(openProgress * durationMul - j * stagger, 0, 1);
            const arc = Math.sin(p * Math.PI) * Math.min(2.0, cam.z * 0.12);

            const endX = V.compact ? card.cx : card.cx - carouselPos;
            const endY = V.compact ? (cam.y + card.cy + carouselPos) : (cam.y + card.cy);
            const x = startX + (endX - startX) * p;
            const y = startY + (endY - startY) * p;
            const z = startZ + (carouselZ - startZ) * p + arc;
            const rot = card.baseRotZ * (1 - p);

            /* Cards beyond the resting 3-stack fade out as they collapse
               (p: 1 = fully in carousel, 0 = fully home) rather than being
               cut with display:none the instant the animation completes.
               Higher-index cards finish their journey home earliest (see the
               stagger below), so by the time the last of the 3 stack cards
               settles, everything else has already faded to nothing — no
               visible snap at the handoff. Only applies while CLOSING; the
               open sequence is unchanged. */
            const opacity = (state === STATE.CLOSING && j >= 3) ? p : 1;
            if (card.lastOpacity !== opacity) { card.el.style.opacity = opacity; card.lastOpacity = opacity; }
            if (card.lastDisplay !== 'flex') { card.el.style.display = 'flex'; card.lastDisplay = 'flex'; }

            const s = scaleAt(z) * rasterRatio;
            const sx = screenX(x, z);
            const sy = screenY(y, z);
            if (!isFinite(sx) || !isFinite(sy) || !isFinite(s)) continue;

            const transform =
                `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0) translate(-50%, -50%) ` +
                `scale(${s.toFixed(4)}) rotateZ(${(-rot).toFixed(4)}rad)`;
            if (transform !== card.lastTransform) {
                card.el.style.transform = transform;
                card.lastTransform = transform;
            }

            const zi = 2000 + i * 100 + (n - j);
            if (zi !== card.lastZ) { card.el.style.zIndex = zi; card.lastZ = zi; }
        }
    }

    /* ---------- events ---------- */
    dom.scroller.addEventListener('scroll', () => {
        if (Router.scene !== 2 || projecting) return;
        applyScroll(dom.scroller.scrollTop);
    }, { passive: true });

    dom.scroller.addEventListener('click', (e) => {
        if (Router.scene !== 2 || activeCluster !== -1) return;
        const hit = hitTest(e.clientX, e.clientY);
        if (hit !== -1) open(hit);
    });

    dom.closeBtn.addEventListener('click', () => close());
    dom.closeBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); close(); }
    });

    /* FIX 9a: a full relayout per resolved image meant ~20-60 grid relayouts
       while a project's images streamed in — each one rewriting width/height/
       radius on every card. Trailing debounce collapses that to one. */
    let resolveTimer = null;
    Assets.onResolve(() => {
        if (activeProject === -1) return;
        clearTimeout(resolveTimer);
        resolveTimer = setTimeout(() => { layoutDirty = true; }, 150);
    });

    V.onChange(() => { if (activeProject !== -1) layoutDirty = true; });

    Loop.register(2, frame);

    return {
        load, unload, close,
        applyCarouselDelta,
        get activeCluster() { return activeCluster; },
        markDirty() { layoutDirty = true; }
    };
})();

/* ==========================================================================
   7. SCENE 1 — WEBGL LANDING
   ========================================================================== */
const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(V.width, V.height, false);
renderer.domElement.style.width = '100%';
renderer.domElement.style.height = '100%';
Governor.register('scene1', 1, (r) => renderer.setPixelRatio(r));
renderer.shadowMap.enabled = false;
renderer.autoClear = false;
renderer.setClearColor('#CCCCCC', 1);
container.appendChild(renderer.domElement);
const scene1Guard = guardContext(renderer, 'scene1', 1, () => {
    rebuildFolderEnvironment();
});

/* ---- orb ---- */
const ORB_FOV = 45;
const ORB_CAM_Z = 3.8;
const orbScene = new THREE.Scene();
const orbCam = new THREE.PerspectiveCamera(ORB_FOV, V.aspect, 0.1, 1000);
orbCam.position.set(0, 0, ORB_CAM_Z);

const dynamicVertexStage = `
    uniform float uTimeline; uniform float uShellRadius; uniform float uMirrorProgress;
    uniform float uBurnProgress; uniform float uClearProgress; uniform float uAspect;
    uniform float uForceField; uniform float uBreathIntensity; uniform float uParticleSize;
    attribute float pRandomPhase; attribute float aType; attribute vec3 aDrift; attribute float aColorType;
    varying float vGlowIntensity; varying float vAlpha; varying float vType; varying float vColorType; varying float vColorMix;
    float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float noise(vec3 x) {
        vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) { float f = 0.0; f += 0.5000 * noise(p); p = p * 2.02; f += 0.2500 * noise(p); p = p * 2.03; f += 0.1250 * noise(p); p = p * 2.01; f += 0.0625 * noise(p); return f; }
    void main() {
        vType = aType; vColorType = aColorType;
        vec3 surfaceNormal = normalize(position);
        float constantBreath = sin(uTimeline * 1.5) * uBreathIntensity;
        float breathOutExpansion = smoothstep(0.0, 0.6, uBurnProgress) * 0.10;
        float burnScale = 1.0 + breathOutExpansion;
        float currentGrowthFactor = 1.0 + (uMirrorProgress * 0.24) + constantBreath;
        float dynamicRadius = uShellRadius * currentGrowthFactor * burnScale;
        float strictAmplitudeCeiling = dynamicRadius * 0.05; float structuralFrequency = 1.4;
        float asymmetryMap = sin(surfaceNormal.x * structuralFrequency + uTimeline * 0.3) * cos(surfaceNormal.y * structuralFrequency);
        float currentIrregularity = asymmetryMap * strictAmplitudeCeiling * uMirrorProgress;
        vec3 baselinePosition = surfaceNormal * (dynamicRadius + currentIrregularity);

        baselinePosition += vec3(sin(uTimeline * 1.32 + pRandomPhase * 6.28) * 0.016, cos(uTimeline * 1.54 + pRandomPhase * 6.28) * 0.016, sin(uTimeline * 0.99 + pRandomPhase * 3.14) * 0.016);
        float rawNoise = fbm(surfaceNormal * 3.5 + uTimeline * 0.1);
        float burnMask = smoothstep(0.3, 0.7, rawNoise);
        float sweep = uBurnProgress * 2.0;
        float timeSinceIgnition = max(0.0, sweep - burnMask);
        vAlpha = 1.0; vColorMix = 0.0; vGlowIntensity = 0.0;

        if (timeSinceIgnition > 0.0) {
            vColorMix = smoothstep(0.0, 0.4, timeSinceIgnition);
            float lingerFactor = pRandomPhase * 0.3;
            vec3 driftOffset = aDrift * ((1.0 - exp(-timeSinceIgnition * 4.0)) * 1.2 + timeSinceIgnition * 0.8) * 2.24;
            driftOffset.x += sin(uTimeline * 0.5 + pRandomPhase * 10.0) * timeSinceIgnition * 0.1;
            driftOffset.y += cos(uTimeline * 0.4 + pRandomPhase * 10.0) * timeSinceIgnition * 0.1;
            driftOffset.z += sin(uTimeline * 0.45 + pRandomPhase * 10.0) * timeSinceIgnition * 0.1;
            baselinePosition += driftOffset;

            if (aType > 0.5) {
                float peripheryBlend = smoothstep(0.2, 1.5, timeSinceIgnition);
                vec2 outwardDir = normalize(surfaceNormal.xy + vec2(0.001));
                float pushRandom = 1.0 + pRandomPhase * 1.0;
                vec2 targetXY = outwardDir * vec2(uAspect * 1.62, 1.62) * pushRandom;
                targetXY *= (1.0 + uClearProgress * 1.344);
                targetXY *= 0.4;
                targetXY.x += sin(uTimeline * 0.15 + pRandomPhase * 20.0) * 0.4;
                targetXY.y += cos(uTimeline * 0.18 + pRandomPhase * 20.0) * 0.4;
                float zDrift = sin(uTimeline * 0.2 + pRandomPhase * 15.0) * 0.5;
                vec3 peripheryPos = vec3(targetXY, surfaceNormal.z * 0.5 - 0.5 + zDrift);
                baselinePosition = mix(baselinePosition, peripheryPos, peripheryBlend);
                vAlpha = 1.0; vGlowIntensity = smoothstep(0.0, 0.5, timeSinceIgnition) * 0.8;
            } else {
                vAlpha = 1.0 - smoothstep(0.1 + lingerFactor, 0.8 + lingerFactor, timeSinceIgnition);
                vGlowIntensity = smoothstep(0.0, 0.2, timeSinceIgnition) * (1.0 - smoothstep(0.2, 0.8, timeSinceIgnition));
            }
        }

        vec3 pushDir = normalize(surfaceNormal);
        vec3 forceDir;
        if (aColorType < 0.30) {
            vec3 camPos = vec3(0.0, 0.0, ${ORB_CAM_Z.toFixed(1)});
            vec3 toCam = normalize(camPos - baselinePosition);
            forceDir = normalize(mix(pushDir, toCam, 0.85));
        } else {
            vec2 dirXY = normalize(pushDir.xy) * 0.9;
            float dirZ = 0.1;
            forceDir = normalize(vec3(dirXY, dirZ));
        }

        float forceMagnitude = uForceField * 1.5;
        vec3 displacement = forceDir * forceMagnitude;

        float targetZ = baselinePosition.z + displacement.z;
        float maxZ = 2.8;
        if (targetZ > maxZ) {
            float excess = targetZ - maxZ;
            targetZ = maxZ + (1.0 - exp(-excess * 2.0));
            displacement.z = targetZ - baselinePosition.z;
        }

        baselinePosition += displacement;

        vec4 viewSpacePosition = modelViewMatrix * vec4(baselinePosition, 1.0);
        gl_Position = projectionMatrix * viewSpacePosition;
        float anchorSize = uParticleSize;
        if (aType < 0.5) { anchorSize *= vAlpha; } else { anchorSize *= mix(1.0, 1.3, smoothstep(0.0, 1.0, timeSinceIgnition)); }
        gl_PointSize = anchorSize / -viewSpacePosition.z;
    }
`;

/* FIX 11 — `discard` removed.
   The old shader did:
       if (length(particleCoord) > 0.5) discard;
       ...
       if (softEdgeAlpha < 0.01) discard;

   On Apple/PowerVR tile-based GPUs, a shader containing `discard` becomes
   "may kill fragments", which disables hidden-surface removal and early-Z for
   the entire draw call. With 3060 overlapping alpha-blended sprites that is a
   large, entirely avoidable fill-rate penalty.

   The visual result is IDENTICAL: smoothstep(0.5, 0.33, len) is already 0 for
   len >= 0.5, so every fragment the old code discarded now simply emits alpha
   0 — which blends to nothing. No pixel changes; the GPU just stops being told
   the shader might kill fragments. */
const dynamicFragmentStage = `
    uniform float uClearProgress; uniform float uBurnProgress; uniform float uTimeline; uniform float uGlobalAlpha;
    varying float vGlowIntensity; varying float vAlpha; varying float vType; varying float vColorType; varying float vColorMix;
    void main() {
        vec2 particleCoord = gl_PointCoord - vec2(0.5);
        vec3 colorA = vec3(0.627, 0.627, 0.627); vec3 colorB = vec3(0.784, 0.784, 0.784);
        vec3 colorC = vec3(0.910, 0.910, 0.910); vec3 colorD = vec3(1.000, 1.000, 1.000);

{
    const spatialCoords = new Float32Array(totalParticles * 3);
    const randomPhases = new Float32Array(totalParticles);
    const types = new Float32Array(totalParticles);
    const drifts = new Float32Array(totalParticles * 3);
    const colorTypes = new Float32Array(totalParticles);

    const indices = Array.from({ length: totalParticles }, (_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    for (let i = 0; i < totalParticles; i++) {
        const idx = indices[i];
        const phi = Math.acos(-1 + (2 * idx) / totalParticles);
        const theta = Math.sqrt(totalParticles * Math.PI) * phi;
        spatialCoords[idx * 3] = Math.cos(theta) * Math.sin(phi);
        spatialCoords[idx * 3 + 1] = Math.sin(theta) * Math.sin(phi);
        spatialCoords[idx * 3 + 2] = Math.cos(phi);
        randomPhases[idx] = Math.random();

        types[idx] = i < 350 ? 1.0 : 0.0;
        const u = Math.random(), v = Math.random();
        const thetaD = u * 2 * Math.PI;

        const speed = Math.random() * 0.36 + 0.12;
        drifts[idx * 3] = speed * Math.sin(phiD) * Math.cos(thetaD);
        drifts[idx * 3 + 1] = speed * Math.sin(phiD) * Math.sin(thetaD);
        drifts[idx * 3 + 2] = speed * Math.cos(phiD);

function createRoundedRect(x, y, w, h, rx, ry) {
    const shape = new THREE.Shape();
    shape.moveTo(x + rx, -y); shape.lineTo(x + w - rx, -y); shape.quadraticCurveTo(x + w, -y, x + w, -(y + ry));
    shape.lineTo(x + w, -(y + h - ry)); shape.quadraticCurveTo(x + w, -(y + h), x + w - rx, -(y + h));
    shape.lineTo(x + rx, -(y + h)); shape.quadraticCurveTo(x, -(y + h), x, -(y + h - ry));
    shape.lineTo(x, -(y + ry)); shape.quadraticCurveTo(x, -y, x + rx, -y);
    return shape;
}

function parseSVGPath(pathStr) {
    const shape = new THREE.Shape();
    const regex = /([MmLlHhVvCcSsQqTtAaZz])|([-+]?(?:\d*\.\d+|\d+)(?:[eE][-+]?\d+)?)/g;
    const tokens = []; let match;
    while ((match = regex.exec(pathStr)) !== null) {
        if (match[1]) tokens.push(match[1]); else tokens.push(parseFloat(match[2]));
    }
    let i = 0, cx = 0, cy = 0, cmd = '';
    while (i < tokens.length) {
        if (isNaN(parseFloat(tokens[i]))) cmd = tokens[i++];
        switch (cmd) {
            case 'M': cx = tokens[i++]; cy = tokens[i++]; shape.moveTo(cx, -cy); cmd = 'L'; break;
            case 'H': cx = tokens[i++]; shape.lineTo(cx, -cy); break;
            case 'L': cx = tokens[i++]; cy = tokens[i++]; shape.lineTo(cx, -cy); break;
            case 'l': cx += tokens[i++]; cy += tokens[i++]; shape.lineTo(cx, -cy); break;
            case 'c': {
                const dx1 = tokens[i++], dy1 = tokens[i++], dx2 = tokens[i++], dy2 = tokens[i++], dx3 = tokens[i++], dy3 = tokens[i++];
                shape.bezierCurveTo(cx + dx1, -(cy + dy1), cx + dx2, -(cy + dy2), cx + dx3, -(cy + dy3));
                cx += dx3; cy += dy3; break;
            }
            case 'Z': case 'z': shape.closePath(); break;
            default: i++; break;
        }
    }
    return shape;
}

function createGlassMaterial(isFront) {

                varying float vThaw;
                varying vec3 vLocalPos;
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g; vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z); vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
                    vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw); vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0)); vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                    vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;

            `.replace(`void main() {`, `void main() {\nfloat noiseVal = snoise(vLocalPos * 0.006) * 0.5 + 0.5;\nfloat thawMask = smoothstep(noiseVal - 0.25, noiseVal + 0.25, vThaw);`)

             .replace(`#include <color_fragment>`, `#include <color_fragment>\ndiffuseColor.a = mix(diffuseColor.a, 0.25, thawMask * 0.85);`);

    VirtualScroll.raw = clamp(VirtualScroll.raw + deltaY, 0, VirtualScroll.max);
    let p = VirtualScroll.raw / VirtualScroll.max;

    if (deltaY > 0 && p > 0.40 && (prev / VirtualScroll.max) <= 0.40) {
        VirtualScroll.raw = VirtualScroll.max;
        p = 1.0;
    }
    targetScrollProgress = p;

    if (p > 0.02) {
        scrollText.style.opacity = 0;
        welcomeTitle.style.opacity = 0;
        wasScrolled = true;
        clearTimeout(typeTimeout);
    } else {
        scrollText.style.opacity = 1;
        if (wasScrolled) {
            wasScrolled = false;
            welcomeTitle.style.opacity = 1;
            startTypewriter();
        }
    }
}

function frameScene1(dt, time) {
    /* FIX 7 */
    if (bootFade.active) {
        bootFade.t = Math.min(1, bootFade.t + dt / bootFade.duration);
        clusterMaterial.uniforms.uGlobalAlpha.value = smoothstep(0, 1, bootFade.t);
        if (bootFade.t >= 1) bootFade.active = false;
    }

    currentForceField = THREE.MathUtils.lerp(currentForceField, Router.forceField, 0.05);
    clusterMaterial.uniforms.uForceField.value = currentForceField;

    const isSnapping = (targetScrollProgress === 1.0 && displayScrollProgress < 0.99) ||
                       (targetScrollProgress <= 0.40 && displayScrollProgress > 0.41);
    displayScrollProgress = THREE.MathUtils.lerp(displayScrollProgress, targetScrollProgress, isSnapping ? 0.125 : 0.04);

    clusterMaterial.uniforms.uTimeline.value = time;
    clusterMaterial.uniforms.uBurnProgress.value = smoothstep(0.0, 0.5, displayScrollProgress);

    const carouselEntrance = smoothstep(0.10, 1.0, displayScrollProgress);
    lastCarouselEntrance = carouselEntrance;
    clusterMaterial.uniforms.uClearProgress.value = carouselEntrance;

    entranceState.targetY = mix(Scene1Layout.entranceY, 0, carouselEntrance);
    const prevPosY = entranceState.posY;

    const speedBoost = mix(5.0, 1.0, V.t);
    const lerpMin = (isSnapping ? 0.048 : 0.03125) * speedBoost;
    const lerpMax = (isSnapping ? 0.173 : 0.1109) * speedBoost;
    const span = Math.max(1e-3, Math.abs(Scene1Layout.entranceY));
    entranceState.posY = THREE.MathUtils.lerp(
        entranceState.posY,
        entranceState.targetY,
        clamp(mix(lerpMin, lerpMax, Math.abs(entranceState.targetY - entranceState.posY) / span), 0, 1)
    );
    entranceState.velY = entranceState.posY - prevPosY;
    carouselGroup.position.y = entranceState.posY;

    isSystemLocked = carouselEntrance < 0.99 || Math.abs(entranceState.velY) > 0.1;

    if (isSystemLocked) {
        currentRotation = 0; targetRotation = 0;
        organicSwayFactor = Math.max(0, organicSwayFactor - 0.05);
    } else {
        if (transitionState === 'IDLE' || transitionState === 'CENTERING' || transitionState === 'CENTERING_TO_OPEN' || transitionState === 'OPENING') {
            let rotLerp = mix(0.375, 0.075, V.t);
            if (transitionState === 'CENTERING_TO_OPEN') rotLerp = mix(0.45, 0.22, V.t);
            currentRotation = THREE.MathUtils.lerp(currentRotation, targetRotation, rotLerp);
            organicSwayFactor = Math.min(1, organicSwayFactor + 0.02);
        } else {
            organicSwayFactor = Math.max(0, organicSwayFactor - 0.05);
        }
    }

    if (displayScrollProgress < 0.1) hasSwiped = false;
    swipeText.style.opacity = (displayScrollProgress > 0.95 && !hasSwiped && transitionState === 'IDLE') ? 1 : 0;

    if (transitionState === 'CENTERING_TO_OPEN' && pendingFolder) {
        folders.forEach(f => f.userData.isHovered = false);
        if (Math.abs(currentRotation - targetRotation) < 0.02) {
            const pIdx = PROJECT_INDEX[folderNames[pendingFolder.userData.index]];
            if (pIdx !== undefined) triggerFolderOpenSequence(pendingFolder, pIdx);
            else { transitionState = 'IDLE'; pendingFolder = null; }
        }
    } else if (transitionState === 'CENTERING' && pendingFolder) {
        folders.forEach(f => f.userData.isHovered = false);
        if (Math.abs(currentRotation - targetRotation) < 0.02) { transitionState = 'IDLE'; pendingFolder = null; }
    }

    carouselGroup.updateMatrixWorld(true);
    inverseCarouselMatrix.copy(carouselGroup.matrixWorld).invert();

    folders.forEach((folder, i) => {
        let wrappedTheta = (((currentRotation + i * angleStep) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        if (wrappedTheta > Math.PI) wrappedTheta -= Math.PI * 2;

        const R = Scene1Layout.carouselRadius;
        folder.position.x = Math.sin(wrappedTheta) * R;
        folder.position.z = Math.cos(wrappedTheta) * R - R;
        folder.rotation.y = Math.abs(wrappedTheta) < 1.8
            ? clamp(wrappedTheta, -0.7, 0.7)
            : THREE.MathUtils.lerp(Math.sign(wrappedTheta) * 0.7, wrappedTheta, clamp((Math.abs(wrappedTheta) - 1.8) / 0.4, 0, 1));

        const phase = folder.userData.phaseOffset;
        folder.position.y = Math.sin(time * 1.2 + phase) * 0.7828 * organicSwayFactor;
        folder.rotation.z = Math.sin(time * 0.9 + phase) * 0.010815 * organicSwayFactor;
        folder.rotation.x = Math.cos(time * 0.7 + phase) * 0.010815 * organicSwayFactor;

        let targetThaw = 0, targetFlapAngle = 0.15;
        const isPending = (transitionState === 'OPENING' && folder === pendingFolder);

        if (!isSystemLocked) {
            if (isPending) {
                targetThaw = 1.0;
                targetFlapAngle = 1.2;
            } else if (transitionState === 'IDLE') {
                if (window.matchMedia('(hover: hover)').matches) {
                    targetThaw = folder.userData.isHovered ? 1.0 : 0.0;
                    targetFlapAngle = folder.userData.isHovered ? 0.65 : 0.15;
                } else if (Math.abs(wrappedTheta) < 0.25) {
                    targetThaw = Math.max(0, 1.0 - Math.abs(wrappedTheta) / 0.25);
                    targetFlapAngle = 0.15 + 0.5 * targetThaw;
                }
            }
        }

        folder.userData.thaw = THREE.MathUtils.lerp(folder.userData.thaw, targetThaw, 0.08);
        thawArray[i] = folder.userData.thaw;

        folder.userData.currentAngle = THREE.MathUtils.lerp(folder.userData.currentAngle, targetFlapAngle, 0.08);
        folder.userData.hinge.rotation.x = folder.userData.currentAngle;

        const targetFileState = isPending ? 1 : 0;
        if (folder.userData.fileState !== targetFileState) {
            folder.userData.fileState = targetFileState;
            folder.userData.transitionStart = time;
        }

        const dipAmount = 25, liftAmount = 480;
        for (let j = 0; j < 3; j++) {
            let targetLift = 0, tension = 0.04, friction = 0.8;

            if (folder.userData.fileState === 1) {
                const localElapsed = time - folder.userData.transitionStart - j * 0.0625;
                if (localElapsed < 0) targetLift = 0;
                else if (localElapsed < 0.134) { targetLift = -dipAmount; tension = 0.1568; friction = 0.68; }
                else { targetLift = liftAmount; tension = 0.01568; friction = 0.86; }
            } else {
                const localElapsed = time - folder.userData.transitionStart - (2 - j) * 0.0625;
                if (localElapsed < 0) targetLift = liftAmount;
                else { targetLift = 0; tension = 0.01904; friction = 0.83; }
            }

            folder.userData.fileVels[j] += (targetLift - folder.userData.fileLifts[j]) * tension;
            folder.userData.fileVels[j] *= friction;
            folder.userData.fileLifts[j] += folder.userData.fileVels[j];
        }

        folder.userData.fileGroups[0].position.set(-34.57, -42.37 + folder.userData.fileLifts[0], -5);
        folder.userData.fileGroups[1].position.set(0, folder.userData.fileLifts[1], 2);
        folder.userData.fileGroups[2].position.set(68.83, 93.24 + folder.userData.fileLifts[2], 9);

        folder.userData.files[0].position.y = -26.9 + Math.sin(time * 2.0 + 0.0 + i) * 4.4805 * organicSwayFactor;
        folder.userData.files[1].position.y = -25.72 + Math.sin(time * 2.0 + 1.5 + i) * 4.4805 * organicSwayFactor;
        folder.userData.files[2].position.y = -43.32 + Math.sin(time * 2.0 + 3.0 + i) * 4.4805 * organicSwayFactor;

        folder.updateMatrixWorld(true);

        const setIM = (dummy, im) => {
            tempMat.copy(dummy.matrixWorld).premultiply(inverseCarouselMatrix);
            im.setMatrixAt(i, tempMat);
        };
        setIM(folder.userData.dummies.front, frontIM);
        setIM(folder.userData.dummies.back, backIM);
        setIM(folder.userData.dummies.f1, file1IM);
        setIM(folder.userData.dummies.f2, file2IM);
        setIM(folder.userData.dummies.f3, file3IM);

        tempV.set(0, -385, 0);
        tempV.applyMatrix4(folder.matrixWorld);
        tempV.project(carouselCam);

        const cache = labelCache[i];
        cache.x = (tempV.x * 0.5 + 0.5) * V.width;
        cache.y = -(tempV.y * 0.5 - 0.5) * V.height;
        cache.focus = Math.abs(wrappedTheta) < 0.25 && carouselEntrance > 0.5;
        cache.hover = folder.userData.isHovered;

        /* TIER 2 INTENT SIGNAL.
           A centred or hovered folder predicts the next click 1-3s early.

           CHANGED: the mind map's intent signal now only warms the HTTP cache
           (Scene3.prefetch). It no longer builds a WebGL context, decodes
           textures or allocates GPU memory — that all happens in Scene3.mount()
           when the user actually commits to entering. */
        if ((cache.focus || cache.hover) && !isSystemLocked) {
            const pIdx = PROJECT_INDEX[folderNames[i]];
            if (pIdx === 99) Scene3.prefetch();
            else if (pIdx !== undefined) Assets.prefetchProject(pIdx);
        }

        const label = labels[i];
        const t = `translate(-50%, -50%) translate3d(${cache.x.toFixed(1)}px, ${cache.y.toFixed(1)}px, 0)`;
        if (t !== cache.lastT) { label.style.transform = t; cache.lastT = t; }
        if (cache.focus !== label._focus) { label.classList.toggle('focus', cache.focus); label._focus = cache.focus; }
        if (cache.hover !== label._hover) { label.classList.toggle('hover', cache.hover); label._hover = cache.hover; }
    });

    thawAttribute.needsUpdate = true;
    frontIM.instanceMatrix.needsUpdate = true;
    backIM.instanceMatrix.needsUpdate = true;
    file1IM.instanceMatrix.needsUpdate = true;
    file2IM.instanceMatrix.needsUpdate = true;
    file3IM.instanceMatrix.needsUpdate = true;

    renderer.clear();
    renderer.render(orbScene, orbCam);
    renderer.clearDepth();
    renderer.render(carouselScene, carouselCam);
}

/* ==========================================================================
   8. SCENE 3 — MIND MAP  (lazily mounted / fully unmounted)
   --------------------------------------------------------------------------
   ARCHITECTURAL CHANGE: the renderer, its WebGL context, OrbitControls, the
   tile geometry, all 76 textures and the globe are now created in mount() and
   destroyed in unmount().

   Before, the whole thing was constructed at module-evaluation time. That
   meant a second full-screen MSAA framebuffer (~40MB on a modern phone) plus
   a second WebGL context existed for the entire session even for visitors who
   never opened the mind map — on top of scene 1's own framebuffer and the
   transmission render target. That standing cost is a large part of why the
   page sat close enough to the iOS memory ceiling that entering the mind map
   could tip it over.

   TEXTURE FORMAT: tiles are loaded as KTX2 (Basis Universal) when available.
   KTX2 transcodes to the GPU's native compressed format — ASTC on Apple,
   ETC2/DXT elsewhere — so the tiles stay compressed IN GPU MEMORY:

       RGBA8 + mips :  76 x ~1.4MB  ~= 106MB
       ASTC/ETC2    :  76 x ~0.3MB  ~=  22MB

   plus no CPU-side bitmap is retained at all. If the .ktx2 files are missing
   the loader falls back per-file to the previous ImageBitmap path, which now
   also closes its bitmap after upload (FIX 4).
   ========================================================================== */

/* ---- BUILD STEP REQUIRED FOR THE COMPRESSED PATH -------------------------
   Two one-time tasks. Nothing here breaks if they are skipped — the loader
   falls back per-tile to the original images — but the memory win only
   arrives once the .ktx2 files exist.

   1. GENERATE THE TEXTURES (needs the KTX-Software `toktx` binary:
      `brew install ktx`, or a release build from
      github.com/KhronosGroup/KTX-Software). Run from the project root:

        mkdir -p assets/projects/mind-map/gallery/ktx2
        for f in assets/projects/mind-map/gallery/*.jpeg \
                 assets/projects/mind-map/gallery/*.JPG \
                 assets/projects/mind-map/gallery/*.png; do
          [ -e "$f" ] || continue
          n=$(basename "$f"); n="${n%.*}"
          toktx --encode uastc --uastc_quality 2 --genmipmap --zcmp 18 \
                --resize 512x512 --assign_oetf srgb \
                "assets/projects/mind-map/gallery/ktx2/$n.ktx2" "$f"
        done

      KEEP THE SOURCE IMAGES. They are the masters, they remain the fallback
      path for devices where transcoding is unavailable, and prefetch uses
      whichever set is active.

   2. SELF-HOST THE BASIS TRANSCODER (two files, no build tooling):

        mkdir -p assets/vendor/basis
        curl -L -o assets/vendor/basis/basis_transcoder.js \
          https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/basis_transcoder.js
        curl -L -o assets/vendor/basis/basis_transcoder.wasm \
          https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/basis_transcoder.wasm

      The code probes for the local copy at startup and only falls back to the
      CDN if it is missing, so this can be done at any time.

   VERIFYING IT WORKED (do this once, it fails silently otherwise):
     1. DevTools > Network, filter "ktx2". Loading the page should produce a
        steady trickle of ~210KB .ktx2 requests starting ~3s in — 76 on
        desktop, 33 on a low-power device. Seeing .jpeg/.JPG requests instead
        means it fell back.
     2. Console: `[scene3] Basis transcoder: self-hosted` (not "CDN fallback"
        — if it says CDN despite the files existing, your host may not answer
        HEAD requests), then `[scene3] KTX2 active`, then a summary
        `[scene3] tiles: N via KTX2, 0 via image fallback, 0 failed`.
     3. One-liner:
        performance.getEntriesByType('resource').filter(r => r.name.endsWith('.ktx2')).length
   ------------------------------------------------------------------------- */
const MINDMAP = {
    useKTX2: true,
    ktx2Dir: 'assets/projects/mind-map/gallery/ktx2/',

       Desktop renders the full set. Low-power devices render a random subset,
       chosen ONCE per page load — before any warming starts, so we only ever
       download the tiles we will actually show. Re-entering the mind map in
       the same session reuses the same (already prepared) set; a fresh visit
       gets a fresh combination. All 76 source files stay in the repo.

       Gated on LOW_POWER, not V.compact: the subset must be fixed before the
       first byte is fetched, and V.compact can flip when a desktop window is
       resized. LOW_POWER is a one-time device-capability read. */
    const MOBILE_TILE_COUNT = 33;

    const activeIndices = (() => {
        if (!LOW_POWER || FULL_N <= MOBILE_TILE_COUNT) {
            return Array.from({ length: FULL_N }, (_, i) => i);
        }
        const pool = Array.from({ length: FULL_N }, (_, i) => i);
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }

       to hold the coverage. Exact area parity would be sqrt(76/33) = 1.518,
       but these are FLAT quads on a curved surface: at 1.518 a tile's
       half-diagonal subtends ~41 degrees of the sphere and neighbouring
       corners start to interpenetrate. Capped at 1.40 (~55% coverage vs 64%)
       — marginally sparser, visibly cleaner silhouette.

       The push interaction radius is in world units and was tuned to catch a
       certain NUMBER of neighbours. With tiles further apart it must scale by
       the same factor or the ripple catches ~half as many tiles and feels
       stingy. maxPush and the idle pulse are proportional to position and are
       left alone. */
    const DENSITY_SCALE = Math.min(Math.sqrt(FULL_N / N), 1.40);
    const TILE = 0.78 * DENSITY_SCALE;

    let tileGeo = null;

       the prepared textures outlive the renderer: leaving and re-entering the

       re-downloading and re-transcoding. Costs ~11MB (mobile) / ~26MB
       (desktop) resident, well under the levels that were causing trouble. */
    const textures = new Array(N);

    let summaryLogged = false;

    let uploadedCount = 0;

       multiplexes). Transcode is CPU-bound and UASTC is not cheap, so weak

       going wider just queues behind it while holding more payloads in

    const NET_BATCH = 4;

    const _push = new THREE.Vector3();
    const _scale = new THREE.Vector3();
    const _hitPoint = new THREE.Vector3();

        shape.moveTo(0, corner); shape.lineTo(0, TILE - corner); shape.quadraticCurveTo(0, TILE, corner, TILE);
        shape.lineTo(TILE - corner, TILE); shape.quadraticCurveTo(TILE, TILE, TILE, TILE - corner);
        shape.lineTo(TILE, corner); shape.quadraticCurveTo(TILE, 0, TILE - corner, 0);
        shape.lineTo(corner, 0); shape.quadraticCurveTo(0, 0, 0, corner);

        const geo = new THREE.ShapeGeometry(shape);
        const uv = geo.attributes.uv;
        for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / TILE, uv.getY(i) / TILE);

    function finishTexture(tex) {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.magFilter = THREE.LinearFilter;

           fall back to scene 1's renderer for the capability read. Same
           device, same driver, same limit. */
        const capSrc = rendererMM || renderer;
        tex.anisotropy = Math.min(8, capSrc ? capSrc.capabilities.getMaxAnisotropy() : 1);

           three.js never closes ImageBitmaps for you; the old code therefore
           retained ~80MB of decoded bitmaps for the whole session on top of
           the GPU copies. */
        tex.onUpdate = () => {
            if (source && typeof source.close === 'function') source.close();
            tex.onUpdate = null;
