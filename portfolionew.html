            } catch (e) {
                /* .ktx2 not generated yet, or transcoding unavailable. Fall
                   back for this tile — and if the first few all fail, stop
                   trying so we don't fire 76 doomed requests. */
                ktx2Errors += 1;
                if (ktx2Errors >= 3 && ktx2Hits === 0 && !ktx2Disabled) {
                    ktx2Disabled = true;
                    console.warn('[scene3] KTX2 unavailable after 3 attempts — using image fallback for all tiles. Have the .ktx2 files been generated?');
                }
            }
        }
        ktx2Misses += 1;
        return loadBitmapTile(imagePaths[i], signal);
    }

    /* ---------- globe construction ---------- */
    function buildGlobe() {
        globe = new THREE.Group();
        /* Whole-sphere flip: a single 180° roll keeps every tile upright
           without touching the Fibonacci placement. */
        globe.rotation.z = Math.PI;
        /* Hidden until every texture is uploaded. The user must never see
           placeholder tiles or images popping in one at a time. */
        globe.visible = false;
        globe.scale.setScalar(0.92);
        globe.updateMatrixWorld(true);
        scene.add(globe);

        tileGeo = makeTileGeometry();

        hitSphere = new THREE.Mesh(
            new THREE.SphereGeometry(GLOBE_RADIUS, 32, 32),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        globe.add(hitSphere);

        tiles = [];
        for (let i = 0; i < N; i++) {
            const material = new THREE.MeshBasicMaterial({
                map: null, color: 0xffffff,
                side: THREE.DoubleSide, transparent: true,
                /* Starts fully transparent; the reveal tween raises it. */
                opacity: 0
            });
            const mesh = new THREE.Mesh(tileGeo, material);
            const phi = Math.acos(1 - 2 * (i + 0.5) / N);
            const theta = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);
            const x = GLOBE_RADIUS * Math.cos(theta) * Math.sin(phi);
            const y = GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi);
            const z = GLOBE_RADIUS * Math.cos(phi);
            mesh.position.set(x, y, z);
            mesh.lookAt(0, 0, 0);
            globe.add(mesh);
            tiles.push({
                mesh,
                base: new THREE.Vector3(x, y, z),
                dir: new THREE.Vector3(x, y, z).normalize(),
                phase: (i % 3) * (Math.PI * 0.666)
            });
        }
    }

    /* ---------- reveal ----------------------------------------------------
       Loader -> fully prepared globe -> smooth reveal. Uploads happen while
       the globe is invisible, so spreading them over frames (which is what
       keeps the allocation from spiking) costs nothing visually. */
    function reveal(reason) {
        if (revealed || !mounted || !globe) return;
        revealed = true;
        clearTimeout(revealTimeout);
        revealTimeout = null;

        if (reason) console.warn(`[scene3] revealing early: ${reason}`);

        loadingEl.style.opacity = 0;
        globe.visible = true;

        if (REDUCED_MOTION) {
            globe.scale.setScalar(1);
            tiles.forEach(t => { t.mesh.material.opacity = TILE_OPACITY; });
            return;
        }

        const proxy = { v: 0 };
        revealTween = gsap.to(proxy, {
            v: 1,
            duration: 0.9,
            ease: 'power3.out',
            onUpdate: () => {
                if (!globe) return;
                globe.scale.setScalar(0.92 + 0.08 * proxy.v);
                const o = TILE_OPACITY * proxy.v;
                for (let i = 0; i < tiles.length; i++) tiles[i].mesh.material.opacity = o;
            },
            onComplete: () => { revealTween = null; }
        });
    }

    /* ---------- background preparation -------------------------------------
       Previously all of this waited until the user entered the mind map, so
       entering meant download + transcode + upload with a loader on screen.
       Transcoding is the expensive part, and it does not need the mind map's
       renderer: KTX2Loader.detectSupport() only reads context capabilities to
       pick a target format, and scene 1's renderer — which exists for the
       whole session, on the same GPU and driver — answers that identically.

       So preparation now runs in the background from page load, in two phases
       with separate concurrency limits, and mount() is left with nothing to
       do but upload.
       ---------------------------------------------------------------------- */

    /* Same courtesy gate Assets.backfill() uses: do not speculatively pull
       megabytes on a metered or very slow connection. */
    function allowPrewarm() {
        const c = navigator.connection;
        if (!c) return true;
        if (c.saveData) return false;
        return !/(^|-)2g$/.test(c.effectiveType || '');
    }

    function logSummary() {
        if (summaryLogged) return;
        summaryLogged = true;
        console.info(
            `[scene3] tiles: ${ktx2Hits} via KTX2, ${ktx2Misses} via image fallback, ` +
            `${failedTiles.size} failed (${N}${N < FULL_N ? ` of ${FULL_N}, low-power subset` : ''})`
        );
    }

    /* A tile finished preparing. If the scene is already mounted it goes
       straight into the upload queue; otherwise it waits in `textures` until
       mount() drains everything at once. */
    function notePrepared(k, tex) {
        if (tex) textures[k] = tex;
        else failedTiles.add(k);
        preparedCount += 1;
        if (mounted) enqueueUpload(k);
        if (preparedCount >= N) logSummary();
    }

    async function ensureKtx2Loader() {
        if (ktx2Loader || !MINDMAP.useKTX2 || ktx2Disabled) return;
        /* Must settle first: resolvedTranscoderPath is only final once the
           self-hosted-vs-CDN probe has answered. */
        await transcoderReady;
        try {
            ktx2Loader = new KTX2Loader()
                .setTranscoderPath(resolvedTranscoderPath)
                .detectSupport(renderer);          // scene 1's renderer
            ktx2Loader.setWorkerLimit(TRANSCODE_BATCH);
        } catch (e) {
            console.warn('[scene3] KTX2Loader unavailable, using image fallback.', e);
            ktx2Loader = null;
        }
    }

    /* PHASE 1 — network only. Fills the HTTP cache in batches of NET_BATCH so
       phase 2 transcodes from disk instead of racing the network. Resolves
       when the last byte is in cache, which is what the boot sequence waits
       on before starting the lower-priority project backfill. */
    function warmNetwork() {
        const list = (MINDMAP.useKTX2 && !ktx2Disabled) ? ktx2Paths : imagePaths;
        return new Promise(resolve => {
            let i = 0;
            const step = () => {
                if (i >= list.length) { resolve(); return; }
                const batch = [];
                for (let n = 0; n < NET_BATCH && i < list.length; n++, i++) {
                    batch.push(fetch(list[i], { cache: 'force-cache', signal: Assets.signal }).catch(() => {}));
                }
                Promise.all(batch).then(() => Idle.run(step));
            };
            Idle.run(step);
        });
    }

    /* PHASE 2 — transcode/decode into GPU-ready textures, TRANSCODE_BATCH at
       a time, on the idle scheduler so it yields whenever a frame runs long. */
    function transcodeAll() {
        const signal = Assets.signal;
        return new Promise(resolve => {
            let i = 0;
            const step = () => {
                if (i >= N) { resolve(); return; }
                const batch = [];
                for (let n = 0; n < TRANSCODE_BATCH && i < N; n++, i++) {
                    const k = i;
                    batch.push(
                        loadTile(k, signal)
                            .then(tex => notePrepared(k, tex))
                            .catch(() => notePrepared(k, null))
                    );
                }
                Promise.all(batch).then(() => Idle.run(step));
            };
            Idle.run(step);
        });
    }

    /* One cheap probe before phase 1: if the .ktx2 derivatives were never
       generated, find out from a single request rather than 76 404s, and warm
       the source images instead. */
    async function probeKtx2() {
        if (!MINDMAP.useKTX2 || ktx2Disabled) return;
        try {
            const r = await fetch(ktx2Paths[0], { cache: 'force-cache', signal: Assets.signal });
            if (!r.ok) throw new Error(String(r.status));
        } catch (e) {
            if (e && e.name === 'AbortError') return;
            ktx2Disabled = true;
            console.warn(`[scene3] ${ktx2Paths[0]} not reachable — using source images. Have the .ktx2 files been generated?`);
        }
    }

    /* Returns a promise that resolves when the NETWORK phase is done, so the
       boot sequence can sequence the project backfill behind it. Transcoding
       continues in the background afterwards. */
    function prewarm() {
        if (prewarmStarted) return Promise.resolve();
        prewarmStarted = true;
        if (!allowPrewarm()) {
            console.info('[scene3] prewarm skipped (Save-Data or slow connection).');
            return Promise.resolve();
        }
        const net = probeKtx2()
            .then(ensureKtx2Loader)
            .then(warmNetwork);
        net.then(transcodeAll);
        return net;
    }

    /* FIX 5 — incremental GPU upload.
       Previously all 76 textures were uploaded and mipmapped inside the FIRST
       frame of scene 3: one enormous frame plus a single ~106MB allocation
       request at the worst possible moment. Now at most UPLOADS_PER_FRAME are
       pushed to the GPU per frame via initTexture(), spreading the cost and
       the allocation over ~20 frames. */
    const UPLOADS_PER_FRAME = 4;

    function enqueueUpload(k) {
        if (!mounted) return;
        if (failedTiles.has(k)) { uploadedCount += 1; maybeReveal(); return; }
        if (textures[k]) uploadQueue.push(k);
    }

    function maybeReveal() {
        if (uploadedCount >= N) reveal();
    }

    function pumpUploads() {
        if (!rendererMM || !uploadQueue.length) return;
        let budget = UPLOADS_PER_FRAME;
        while (budget-- > 0 && uploadQueue.length) {
            const k = uploadQueue.shift();
            const tex = textures[k];
            if (!tex) { failedTiles.add(k); uploadedCount += 1; continue; }
            try { rendererMM.initTexture(tex); } catch (e) { /* non-fatal */ }
            const t = tiles[k];
            if (t) {
                t.mesh.material.map = tex;
                t.mesh.material.needsUpdate = true;
            }
            uploadedCount += 1;
        }
        /* Everything accounted for (uploaded or failed) — show the globe. */
        maybeReveal();
    }

    /* ---------- layout ---------- */
    function layout() {
        camera.aspect = V.aspect;
        camera.updateProjectionMatrix();
        if (rendererMM) {
            rendererMM.setPixelRatio(Governor.ratioFor());
            rendererMM.setSize(V.width, V.height, false);
            rendererMM.domElement.style.width = '100%';
            rendererMM.domElement.style.height = '100%';
        }

        const extent = 4.33;
        const halfTan = Math.tan(MM_FOV * Math.PI / 360);
        const shapeFactor = Math.pow(Math.min(V.aspect, 1), 0.375);
        const minD = controls ? controls.minDistance : 4;
        const maxD = controls ? controls.maxDistance : 20;
        const z = clamp(extent / (halfTan * shapeFactor), minD, maxD);
        camera.position.set(0, 0, z);
        if (controls) controls.update();
    }

    /* ---------- mount / unmount ---------- */
    function mount() {
        if (mounted) return;
        mounted = true;

        loadingEl.style.opacity = 1;
        uploadedCount = 0;
        revealed = false;
        uploadQueue = [];

        rendererMM = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        rendererMM.setSize(V.width, V.height, false);
        rendererMM.domElement.style.width = '100%';
        rendererMM.domElement.style.height = '100%';
        container3.appendChild(rendererMM.domElement);
        Governor.register('scene3', 3, (r) => rendererMM && rendererMM.setPixelRatio(r));
        glGuard = guardContext(rendererMM, 'scene3', 3, () => {
            textures.forEach(t => { if (t) t.needsUpdate = true; });
        });

        controls = new OrbitControls(camera, rendererMM.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 4;
        controls.maxDistance = 20;

        buildGlobe();
        layout();
        unsubViewport = V.onChange(layout);

        /* Make sure preparation is running (it normally started seconds ago
           from the boot sequence; this covers a direct fast click, or a
           connection where prewarm was skipped). */
        prewarm();

        /* Drain whatever is already prepared. On a normal visit this is all
           of it, so entering costs only the incremental upload. Anything
           still in flight arrives via notePrepared() -> enqueueUpload(). */
        for (let k = 0; k < N; k++) {
            if (textures[k] || failedTiles.has(k)) enqueueUpload(k);
        }

        /* If a handful of requests stall, reveal what we have rather than
           leaving the user on a loader forever. */
        revealTimeout = setTimeout(() => {
            if (!revealed) reveal(`timeout, ${uploadedCount}/${N} ready`);
        }, REVEAL_HARD_TIMEOUT_MS);
    }

    function unmount() {
        if (!mounted) return;
        mounted = false;

        /* Tell the context guard this teardown is intentional BEFORE anything
           can fire webglcontextlost. Without this, the deliberate
           loseContext() below raised the "graphics stopped responding"
           overlay five seconds later, over whatever scene the user had
           navigated to by then. */
        if (glGuard) { glGuard.markDisposing(); }

        clearTimeout(revealTimeout);
        revealTimeout = null;
        if (revealTween) { revealTween.kill(); revealTween = null; }
        revealed = false;

        if (unsubViewport) { unsubViewport(); unsubViewport = null; }
        Governor.unregister('scene3');

        if (controls) { controls.dispose(); controls = null; }

        /* Textures and the KTX2 loader deliberately SURVIVE unmount. The GPU
           copies go away with the context below, but the transcoded data
           stays in memory, so re-entering re-uploads from RAM instead of
           re-downloading and re-transcoding. tiles/materials/geometry are
           rebuilt on the next mount. */
        tiles.forEach(t => t.mesh.material.dispose());
        if (hitSphere) { hitSphere.geometry.dispose(); hitSphere.material.dispose(); }
        if (tileGeo) { tileGeo.dispose(); tileGeo = null; }
        if (globe) { scene.remove(globe); globe = null; }
        tiles = [];
        uploadQueue = [];
        uploadedCount = 0;
        hitSphere = null;

        if (rendererMM) {
            if (rendererMM.domElement.parentNode) {
                rendererMM.domElement.parentNode.removeChild(rendererMM.domElement);
            }
            /* Remove the listeners entirely, then grab the context BEFORE
               dispose(), then drop it explicitly so the driver reclaims the
               framebuffer immediately rather than at GC time. */
            if (glGuard) { glGuard.destroy(); glGuard = null; }
            let lose = null;
            try { lose = rendererMM.getContext().getExtension('WEBGL_lose_context'); } catch (e) {}
            rendererMM.dispose();
            if (lose) lose.loseContext();
            rendererMM = null;
        }
        glGuard = null;

        /* Reset per-mount interaction state. Preparation flags are NOT reset:
           prewarmStarted and the prepared textures persist for the session. */
        isHovering = false;
        isPointerDown = false;
        holdFactor = 0;
        mouseMM.set(-999, -999);
    }


    /* ---------- frame ---------- */
    function frame(dt, time) {
        if (!mounted || !rendererMM) return;

        pumpUploads();
        controls.update();

        /* Nothing interactive until the globe is actually on screen. */
        if (!revealed) {
            rendererMM.render(scene, camera);
            return;
        }

        const targetHold = isPointerDown ? 1 : 0;
        holdFactor += (targetHold - holdFactor) * (isPointerDown ? 0.25 : 0.035);

        if (hitSphere) {
            raycasterMM.setFromCamera(mouseMM, camera);
            const hits = raycasterMM.intersectObject(hitSphere);
            if (hits.length) {
                /* hits[0].point is world space; t.base/t.dir are local. The
                   globe carries a 180° roll, so the hit must be converted or
                   the push lands on the opposite side of the sphere. */
                _hitPoint.copy(hits[0].point);
                globe.worldToLocal(_hitPoint);
                isHovering = true;
            } else {
                isHovering = false;
            }
        }

        const protrusion = mix(1.45, 1.0, V.t);

        for (let i = 0; i < tiles.length; i++) {
            const t = tiles[i];
            let scaleTarget = 1.0;
            let pushed = false;

            const idlePulse = (Math.sin(time * 1.2 + t.phase) + 1) * 0.5;
            _target.copy(t.base).multiplyScalar(1 + idlePulse * 0.10);

            if (isHovering) {
                const distance = _hitPoint.distanceTo(t.base);
                const effectRadius = EFFECT_RADIUS_BASE + holdFactor * EFFECT_RADIUS_HOLD;
                const maxPush = (1.38 + holdFactor * 3.2) * protrusion;

                if (distance < effectRadius) {
                    pushed = true;
                    const force = Math.pow(1 - distance / effectRadius, 2);
                    _push.copy(t.dir).multiplyScalar(force * maxPush);
                    _target.add(_push);

                    const sway = 0.112 * force;
                    _target.x += Math.sin(time * 1.5 + t.phase) * sway;
                    _target.y += Math.cos(time * 1.2 + t.phase) * sway;
                    _target.z += Math.sin(time * 1.8 + t.phase) * sway;

                    const maxScale = 1.05 + holdFactor * 0.20;
                    scaleTarget = 1 + force * (maxScale - 1);
                }
            }

            const lerpSpeed = pushed ? 0.28 : 0.04;
            t.mesh.position.lerp(_target, lerpSpeed);
            _scale.set(scaleTarget, scaleTarget, scaleTarget);
            t.mesh.scale.lerp(_scale, lerpSpeed);
        }

        rendererMM.render(scene, camera);
    }

    Loop.register(3, frame);

    return {
        mount,
        unmount,
        prewarm,
        /* The scene-1 intent signal (folder centred/hovered) still calls this;
           it is now just an early nudge for the same background pipeline. */
        prefetch: prewarm,
        get mounted() { return mounted; },
        get tileCount() { return N; },
        setPointer(x, y) {
            if (!mounted) return;
            mouseMM.x = (x / V.width) * 2 - 1;
            mouseMM.y = -(y / V.height) * 2 + 1;
        },
        setPointerDown(v) { if (mounted) isPointerDown = v; },
        clearPointer() { isPointerDown = false; mouseMM.set(-999, -999); }
    };
})();

/* ==========================================================================
   9. ROUTING
   ========================================================================== */
/* ==========================================================================
   9. ROUTING
   --------------------------------------------------------------------------
   TRANSITION TOKENS. Every scene change used to be a chain of uncancellable
   setTimeouts (1050ms folder open -> 800ms scene fade -> 800ms return fade ->
   100ms force field). Nothing held a handle, so a timer scheduled by one
   transition could fire in the middle of the next one and overwrite state
   that had already moved on. Now each transition takes a monotonic id and
   every deferred callback bails if a newer transition has started.
   ========================================================================== */
let transitionId = 0;
function beginTransition() { return ++transitionId; }
function isCurrentTransition(id) { return id === transitionId; }

const sceneOneEl = document.getElementById('scene-one');
const sceneTwoEl = document.getElementById('scene-two');
const sceneThreeEl = document.getElementById('scene-three');
const backBtn2 = document.getElementById('scene-two-back-btn');
const backBtn3 = document.getElementById('scene-three-back-btn');

function openCollectionFromFolder(projectIndex, id) {
    if (id !== undefined && !isCurrentTransition(id)) return;
    const tid = id !== undefined ? id : beginTransition();

    sceneOneEl.style.opacity = '0';
    sceneOneEl.style.pointerEvents = 'none';

    if (projectIndex === 99) {
        Router.scene = 3;
        Scene3.mount();
        Governor.refresh('scene3');
        setTimeout(() => {
            if (!isCurrentTransition(tid)) return;
            sceneThreeEl.style.opacity = '1';
            sceneThreeEl.style.pointerEvents = 'auto';
            backBtn3.classList.add('active');
            startMindMapTypewriter();
        }, 800);
    } else {
        Router.scene = 2;
        setTimeout(() => {
            if (!isCurrentTransition(tid)) return;
            sceneTwoEl.style.opacity = '1';
            sceneTwoEl.style.pointerEvents = 'auto';
            backBtn2.classList.add('active');
            S2.load(projectIndex);
        }, 800);
    }
}

/* Explicitly ASSERT the homepage's post-return state instead of assuming the
   pre-navigation values survived.

   The old version set only VirtualScroll.raw and relied on
   targetScrollProgress / displayScrollProgress / lastCarouselEntrance /
   entranceState still holding their pre-navigation values. Anything that
   perturbed them in between — a viewport change firing layoutScene1(), a
   home-button click near a transition boundary, input dropped while
   transitionState !== 'IDLE' — left the scene interpolating back toward the
   particle orb instead of the folder carousel. */
function restoreCarouselState() {
    VirtualScroll.max = V.height * 1.5;
    VirtualScroll.raw = VirtualScroll.max;

    targetScrollProgress = 1;
    displayScrollProgress = 1;
    lastCarouselEntrance = 1;

    entranceState.posY = 0;
    entranceState.targetY = 0;
    entranceState.velY = 0;

    isSystemLocked = false;
    wasScrolled = true;

    /* Snap rotation to a whole folder so we never land between detents. */
    targetRotation = Math.round(targetRotation / angleStep) * angleStep;
    currentRotation = targetRotation;

    carouselGroup.position.y = 0;

    /* Uniforms that are normally driven by the scroll progress. */
    clusterMaterial.uniforms.uBurnProgress.value = smoothstep(0.0, 0.5, 1);
    clusterMaterial.uniforms.uClearProgress.value = 1;

    scrollText.style.opacity = 0;
    welcomeTitle.style.opacity = 0;
}

function returnToSceneOne() {
    const tid = beginTransition();
    const wasScene3 = Router.scene === 3;

    Router.scene = 1;
    if (S2.activeCluster !== -1) S2.close(true);
    resetMindMapTypewriter();
    Scene3.clearPointer();

    sceneTwoEl.style.opacity = '0';
    sceneTwoEl.style.pointerEvents = 'none';
    sceneThreeEl.style.opacity = '0';
    sceneThreeEl.style.pointerEvents = 'none';
    backBtn2.classList.remove('active');
    backBtn3.classList.remove('active');

    restoreCarouselState();
    Governor.refresh('scene1');

    setTimeout(() => {
        if (!isCurrentTransition(tid)) return;
        S2.unload();
        /* Tear the mind map's context down only after it has fully faded, so
           the user never sees the canvas vanish. */
        if (wasScene3) Scene3.unmount();
        sceneOneEl.style.opacity = '1';
        sceneOneEl.style.pointerEvents = 'auto';
        /* Re-assert: the 800ms fade is long enough for a resize to have
           recomputed the entrance geometry from stale values. */
        restoreCarouselState();
        setTimeout(() => {
            if (!isCurrentTransition(tid)) return;
            Router.forceField = 0;
            triggerFolderClose();
        }, 100);
    }, 800);
}

backBtn2.addEventListener('click', returnToSceneOne);
backBtn3.addEventListener('click', returnToSceneOne);

document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (Router.scene === 2 && S2.activeCluster !== -1) S2.close();
    else if (Router.scene !== 1) returnToSceneOne();
});

/* ==========================================================================
   10. INPUT  (FIX 3 — scoped, mostly-passive listeners)
   --------------------------------------------------------------------------
   The previous version registered `wheel` and `touchmove` on WINDOW with
   { passive: false }. That tells the browser it must run JavaScript before it
   can scroll ANYTHING — including #native-scroll-container, the compositor-
   driven grid scroller built specifically to avoid main-thread involvement.
   One global listener silently reintroduced the exact lag the Phase 2
   architecture was designed to remove.

   Now:
     - Scene 1 (virtual scroll, needs preventDefault) -> #scene-one, non-passive.
     - Scene 2 carousel (needs preventDefault)        -> #click-blocker,
       which is display:none unless a carousel is open, so the grid scroller
       never has a non-passive ancestor listener at all.
     - Scene 3 (only reads coordinates)               -> #scene-three, PASSIVE.
   ========================================================================== */
const blockerEl = document.getElementById('click-blocker');

/* ---- Scene 1: wheel ---- */
let wheelSnapTimeout;
sceneOneEl.addEventListener('wheel', (e) => {
    if (Router.scene !== 1) return;
    e.preventDefault();
    if (!isSystemLocked && transitionState === 'IDLE' && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        targetRotation -= e.deltaX * 0.002;
        hasSwiped = true;
        clearTimeout(wheelSnapTimeout);
        wheelSnapTimeout = setTimeout(() => {
            targetRotation = Math.round(targetRotation / angleStep) * angleStep;
        }, 150);
        return;
    }
    applyVirtualScroll(e.deltaY);
}, { passive: false });

/* ---- Scene 2 carousel: wheel ----
   Scoped to #click-blocker only, which fully covers the carousel area for
   the entire open→carousel→closing lifetime — it's a sibling of #dom-layer
   in the same stacking context with a higher z-index, so nothing inside
   #dom-layer can ever receive a pointer/wheel event while the blocker is
   active. (An earlier pass also attached this to #dom-layer to work around
   a since-removed hover feature; that listener could never actually fire,
   for the same reason, and has been dropped.) */
function onCarouselWheel(e) {
    if (Router.scene !== 2 || S2.activeCluster === -1) return;
    e.preventDefault();
    const delta = V.compact ? e.deltaY : e.deltaX;
    S2.applyCarouselDelta(delta);
}
blockerEl.addEventListener('wheel', onCarouselWheel, { passive: false });

/* ---- Scene 1: touch ---- */
let touchStartX = 0, touchStartY = 0, touchIntent = null;

sceneOneEl.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchIntent = null;
}, { passive: true });

sceneOneEl.addEventListener('touchmove', (e) => {
    if (Router.scene !== 1) return;
    const cx = e.touches[0].clientX;
    const cy = e.touches[0].clientY;
    const dx = touchStartX - cx;
    const dy = touchStartY - cy;

    e.preventDefault();
    if (touchIntent === null) {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 5) touchIntent = 'rotate';
        else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 5) touchIntent = 'scroll';
    }
    if (touchIntent === 'scroll') {
        isDragging = false;
        applyVirtualScroll(dy * mix(1.0, 1.5, V.t));
        touchStartY = cy;
        touchStartX = cx;
    }
}, { passive: false });

/* ---- Scene 2 carousel: touch ---- */
let carTouchX = 0, carTouchY = 0;

blockerEl.addEventListener('touchstart', (e) => {
    carTouchX = e.touches[0].clientX;
    carTouchY = e.touches[0].clientY;
}, { passive: true });

blockerEl.addEventListener('touchmove', (e) => {
    if (Router.scene !== 2 || S2.activeCluster === -1) return;
    e.preventDefault();
    const cx = e.touches[0].clientX;
    const cy = e.touches[0].clientY;
    S2.applyCarouselDelta((V.compact ? (carTouchY - cy) : (carTouchX - cx)) * 2.0);
    carTouchX = cx;
    carTouchY = cy;
}, { passive: false });

/* ---- Scene 3: touch (PASSIVE — OrbitControls handles its own gestures) ---- */
sceneThreeEl.addEventListener('touchstart', (e) => {
    if (Router.scene !== 3) return;
    hideInteractText();
    Scene3.setPointerDown(true);
    Scene3.setPointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

sceneThreeEl.addEventListener('touchmove', (e) => {
    if (Router.scene !== 3) return;
    Scene3.setPointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

sceneThreeEl.addEventListener('touchend', () => {
    if (Router.scene === 3) Scene3.setPointerDown(false);
}, { passive: true });

/* ---- pointer (mouse / trackpad) ---- */
function handlePointerDown(e) {
    if (Router.scene === 3) {
        hideInteractText();
        Scene3.setPointerDown(true);
        Scene3.setPointer(e.clientX, e.clientY);
        return;
    }
    if (Router.scene === 2 && S2.activeCluster !== -1 && !V.compact) {
        carouselDragging = true;
        carouselPrevX = e.clientX;
        container.style.cursor = 'grabbing';
        return;
    }
    if (Router.scene !== 1 || isSystemLocked || transitionState !== 'IDLE') return;
    isDragging = true;
    startX = e.clientX; startY = e.clientY; previousX = e.clientX;
    dragVelocity = 0;
    container.style.cursor = 'grabbing';
}

function handlePointerMove(e) {
    if (Router.scene === 3) { Scene3.setPointer(e.clientX, e.clientY); return; }
    if (carouselDragging && Router.scene === 2 && S2.activeCluster !== -1) {
        S2.applyCarouselDelta(carouselPrevX - e.clientX);
        carouselPrevX = e.clientX;
        return;
    }
    if (Router.scene !== 1 || isSystemLocked || transitionState !== 'IDLE') return;

    if (isDragging) {
        dragVelocity = (e.clientX - previousX) * 0.004;
        targetRotation += dragVelocity;
        previousX = e.clientX;
        hasSwiped = true;
    }
    if (window.matchMedia('(hover: hover)').matches && e.pointerType === 'mouse' && !isDragging) {
        mouse.x = (e.clientX / V.width) * 2 - 1;
        mouse.y = -(e.clientY / V.height) * 2 + 1;
        raycaster.setFromCamera(mouse, carouselCam);
        const hits = raycaster.intersectObjects(hitBoxes);
        folders.forEach(f => f.userData.isHovered = false);
        container.style.cursor = 'grab';
        if (hits.length) {
            hits[0].object.userData.folder.userData.isHovered = true;
            container.style.cursor = 'pointer';
        }
    }
}

function handlePointerUp(e) {
    if (Router.scene === 3) { Scene3.setPointerDown(false); return; }
    if (carouselDragging) {
        carouselDragging = false;
        container.style.cursor = 'grab';
        return;
    }
    if (Router.scene !== 1 || isSystemLocked || transitionState !== 'IDLE' || !isDragging) return;
    isDragging = false;
    container.style.cursor = 'grab';

    if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
        mouse.x = (e.clientX / V.width) * 2 - 1;
        mouse.y = -(e.clientY / V.height) * 2 + 1;
        raycaster.setFromCamera(mouse, carouselCam);
        const hits = raycaster.intersectObjects(hitBoxes);
        if (hits.length) {
            const folder = hits[0].object.userData.folder;
            const pIdx = PROJECT_INDEX[folderNames[folder.userData.index]];
            if (pIdx !== undefined) {
                let diff = ((-folder.userData.index * angleStep) - targetRotation) % (Math.PI * 2);
                if (diff > Math.PI) diff -= Math.PI * 2;
                if (diff < -Math.PI) diff += Math.PI * 2;
                targetRotation += diff;
                pendingFolder = folder;
                if (Math.abs(diff) > 0.01) transitionState = 'CENTERING_TO_OPEN';
                else triggerFolderOpenSequence(folder, pIdx);
            }
            return;
        }
    }
    targetRotation += dragVelocity * 15;
    targetRotation = Math.round(targetRotation / angleStep) * angleStep;
}

function handlePointerLeave() {
    isDragging = false;
    if (carouselDragging) { carouselDragging = false; container.style.cursor = 'grab'; }
    if (Router.scene === 3) Scene3.clearPointer();
}

window.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointermove', handlePointerMove);
window.addEventListener('pointerup', handlePointerUp);
window.addEventListener('pointercancel', handlePointerLeave);

/* FIX 14 — `pointerout` on window fires every time the pointer crosses ANY
   element boundary, so simply moving the cursor from a folder label onto the
   canvas cancelled an in-progress drag and cleared the mind map's pointer.
   A null relatedTarget means the pointer genuinely left the window. */
window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget === null) handlePointerLeave();
});

/* ---- contact menu ---- */
const contactItems = document.querySelectorAll('.contact-item');

contactBtn.addEventListener('click', (e) => {
    if (!contactBtn.classList.contains('is-open')) {
        contactBtn.classList.add('is-open');
        e.stopPropagation();
    }
});
contactBtn.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !contactBtn.classList.contains('is-open')) {
        e.preventDefault();
        contactBtn.classList.add('is-open');
    }
});
document.addEventListener('click', (e) => {
    if (contactBtn.classList.contains('is-open') && !contactBtn.contains(e.target)) {
        contactBtn.classList.remove('is-open');
    }
});
contactItems.forEach(item => {
    item.addEventListener('click', (e) => {
        e.stopPropagation();
        const text = item.getAttribute('data-copy');
        navigator.clipboard.writeText(text).then(() => {
            item.classList.add('is-copied');
            setTimeout(() => item.classList.remove('is-copied'), 1200);
        }).catch(err => console.error('Copy failed:', err));
    });
});

if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            btn.style.setProperty('--x', `${e.clientX - rect.left}px`);
            btn.style.setProperty('--y', `${e.clientY - rect.top}px`);
        });
    });
}

/* ==========================================================================
   11. BOOT
   ========================================================================== */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

layoutScene1();
V.onChange(() => {
    VirtualScroll.max = V.height * 1.5;
    layoutScene1();
});

renderer.compile(orbScene, orbCam);
renderer.compile(carouselScene, carouselCam);
Loop.start();

setTimeout(() => { bootFade.active = true; bootFade.t = 0; }, 100);

/* Staged background preparation. Nothing here competes with scene 1's boot
   (PMREM, shader compile, first paint), which is the window the startup
   stutters used to live in.

     1.5s  cover images for the folder carousel
     3.0s  mind-map network warm (batched), then transcode in the background
     then  project image backfill, once the mind map has the network to itself
           no longer — capped at 5s so a slow connection can't starve it. */
setTimeout(() => {
    Assets.warmCovers();
    setTimeout(() => {
        const mindMapNetwork = Scene3.prewarm();
        const cap = new Promise(res => setTimeout(res, 5000));
        Promise.race([mindMapNetwork, cap]).then(() => Assets.backfill());
    }, 1500);
}, 1500);

setTimeout(() => {
    homeBtn.style.opacity = 1;
    homeBtn.style.pointerEvents = 'auto';
    contactBtn.style.opacity = 1;
    contactBtn.style.pointerEvents = 'auto';
    if (VirtualScroll.raw === 0) scrollText.style.opacity = 1;
    setTimeout(() => {
        if (VirtualScroll.raw === 0) {
            welcomeTitle.style.opacity = 1;
            startTypewriter();
        }
    }, 800);
}, 560);

/* ==========================================================================
   12. PAGE LIFECYCLE  (FIX 1)
   --------------------------------------------------------------------------
   The old code was:

       window.addEventListener('pagehide', () => {
           Scene3.release();
           renderer.dispose();
           envRT.dispose();
       });

   pagehide ALSO fires when the page enters the back/forward cache. On a back
   navigation the JS heap and the rAF loop return intact — but both renderers'
   program caches had been torn down and envRT (still referenced by
   carouselScene.environment) had been disposed. The loop resumed rendering
   into a dead renderer: black homepage. Scene3.release() additionally left
   started/built = true, so the mind map could never rebuild.

   Now teardown only runs when the document is genuinely being discarded
   (event.persisted === false), and pageshow re-establishes anything that a
   restore might have invalidated.
   ========================================================================== */
let disposed = false;

function hardDispose() {
    if (disposed) return;
    disposed = true;
    beginTransition();
    Assets.cancelPending();
    Scene3.unmount();
    if (scene1Guard) scene1Guard.destroy();
    renderer.dispose();
    if (envRT) { envRT.dispose(); envRT = null; }
}

window.addEventListener('pagehide', (e) => {
    if (e.persisted) {
        /* Going into bfcache: keep everything, just stop speculative work. */
        Assets.cancelPending();
        return;
    }
    hardDispose();
});

window.addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    /* Restored from bfcache. Nothing was disposed, but the GPU may have
       dropped resources while frozen and the viewport may have changed. */
    V.invalidate();
    V.refresh();
    if (!envRT) rebuildFolderEnvironment();
    layoutScene1();
});

/* Debug handle. Nothing in the app reads from window. */
window.__portfolio = { Viewport: V, Router, S2, Scene3, Governor, Idle };
</script>
