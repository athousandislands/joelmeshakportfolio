<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Joel Meshak</title>
    
    <!-- Shared Three.js Import Map for Scene 1 & 3 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Global Three.js for Scene 2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* ==========================================================================
           GLOBAL STYLES & VIRTUAL SCROLL ISOLATION
           ========================================================================== */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #CCCCCC;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100svh;
            overflow: hidden; /* Permanently locked for Virtual Scroll */
            overscroll-behavior: none;
            touch-action: none; /* Disables all native scrolling and pull-to-refresh */
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================================================
           SCENE WRAPPERS & TRANSITIONS
           ========================================================================== */
        #scene-one, #scene-two, #scene-three {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100svh;
            transition: opacity 0.8s ease;
        }

        #scene-two, #scene-three {
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* ==========================================================================
           SCENE 1 (WEBGL LANDING) STYLES
           ========================================================================== */
        #webgl-module {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        .nav-btn {
            position: fixed;
            top: 32px; left: 32px;
            padding: 10px 25px; 
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-weight: 500; font-size: 14px; color: #777777; 
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 13px rgba(0, 0, 0, 0.0214); 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            z-index: 200; user-select: none; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
            --x: 50%; --y: 50%;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.35); transform: translateY(-1px); color: #ffffff; 
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 6px 16px rgba(0, 0, 0, 0.03);
        }
        .nav-btn:active { transform: translateY(0px); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 2px 8px rgba(0, 0, 0, 0.02); }
        
        /* Dynamic Edge Light - Restricted to Desktop to fix Mobile DOM Lag */
        @media (hover: hover) and (pointer: fine) {
            .nav-btn::after {
                content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; 
                background: radial-gradient(28px circle at var(--x) var(--y), rgba(255, 255, 255, 0.95), transparent 100%);
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
                opacity: 0; transition: opacity 0.3s ease, border-radius 0.5s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
            }
            .nav-btn:hover::after { opacity: 1; }
        }

        #home-btn { opacity: 0; pointer-events: none; }

        /* Contact Morphing Button */
        #contact-btn {
            left: auto;
            right: 32px;
            width: 104px;
            height: 42px;
            padding: 0;
            display: block;
            overflow: hidden;
            box-sizing: border-box;
            opacity: 0; pointer-events: none;
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        height 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-radius 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.5s ease,
                        box-shadow 0.5s ease,
                        backdrop-filter 0.5s ease,
                        -webkit-backdrop-filter 0.5s ease,
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.8s ease;
        }

        #contact-btn.is-open {
            width: 180px;
            height: 204px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.25) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 
                        inset 0 0 20px rgba(255, 255, 255, 0.08), 
                        0 8px 24px rgba(0, 0, 0, 0.03), 
                        0 1px 3px rgba(0, 0, 0, 0.01);
            transform: translateY(0) !important;
            cursor: default;
        }

        .contact-label {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 42px;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }

        #contact-btn.is-open .contact-label {
            opacity: 0;
            pointer-events: none;
        }

        .contact-list {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 16px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
        }

        #contact-btn.is-open .contact-list {
            opacity: 1;
            pointer-events: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: background 0.2s ease, transform 0.3s ease, opacity 0.2s ease;
        }

        #contact-btn.is-open .contact-item {
            opacity: 1;
            transform: translateY(0);
            transition: background 0.2s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }

        /* Staggered entrance */
        #contact-btn.is-open .contact-item:nth-child(1) { transition-delay: 0.10s; }
        #contact-btn.is-open .contact-item:nth-child(2) { transition-delay: 0.15s; }
        #contact-btn.is-open .contact-item:nth-child(3) { transition-delay: 0.20s; }
        #contact-btn.is-open .contact-item:nth-child(4) { transition-delay: 0.25s; }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .contact-item svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .be-logo {
            font-family: inherit;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        /* Copy Feedback Styles */
        .item-text-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
        }

        .item-text-wrapper span {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .item-text-wrapper .copied {
            position: absolute;
            left: 0;
            color: #34C759;
            opacity: 0;
            transform: translateY(4px);
            font-weight: 500;
        }

        .contact-item.is-copied .original {
            opacity: 0;
            transform: translateY(-4px);
        }

        .contact-item.is-copied .copied {
            opacity: 1;
            transform: translateY(0);
        }

        #scene-two-back-btn, #scene-three-back-btn { opacity: 0; pointer-events: none; }
        #scene-two-back-btn.active, #scene-three-back-btn.active { opacity: 1; pointer-events: auto; }
        #scene-two-back-btn svg, #scene-three-back-btn svg { width: 16px; height: 16px; transition: stroke 0.3s ease; }

        .welcome-text {
            position: fixed; 
            top: 15svh; 
            width: 100%; 
            text-align: center; 
            color: #FFFFFF; 
            z-index: 10; 
            font-weight: 400; 
            font-size: 1.125rem; 
            opacity: 0; 
            transition: opacity 0.8s ease; 
            pointer-events: none;
        }
        .welcome-text::after {
            content: '|';
            animation: blink 1s step-start infinite;
            margin-left: 4px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .welcome-text.done::after {
            opacity: 0;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Mind Map Interaction Text */
        #mindmap-interact-text {
            top: 85svh;
            opacity: 0;
            pointer-events: none;
        }
        #mindmap-interact-text::after {
            content: none;
        }
        #mindmap-interact-text.fade-in {
            animation: interactFadeIn 0.8s ease forwards, interactPulse 4s infinite ease-in-out 0.8s;
        }
        #mindmap-interact-text.hidden {
            opacity: 0 !important;
            animation: none !important;
            transition: opacity 0.3s ease;
        }
        @keyframes interactFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes interactPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .scroll-instruction {
            position: fixed; top: 85svh; width: 100%; text-align: center; color: #FFFFFF; 
            z-index: 10; font-weight: 400; font-size: 1.125rem; 
            opacity: 0; transition: opacity 1s ease; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        @keyframes pulseText {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        .scroll-instruction span { animation: pulseText 4s infinite ease-in-out; }

        #labels-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .folder-label {
            position: absolute; top: 0; left: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px; font-weight: 400; color: #777777; 
            opacity: 0; transition: opacity 0.4s ease, color 0.4s ease;
            text-align: center; white-space: nowrap;
            will-change: transform, opacity, color;
        }
        .folder-label.focus { opacity: 1; }
        .folder-label.hover { color: #ffffff; }

        /* ==========================================================================
           SCENE 2 (COLLECTIONS) STYLES
           ========================================================================== */
        #scene-two canvas, #dom-layer {
            display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        #scene-two canvas { z-index: 1; }
        #dom-layer { pointer-events: none; z-index: 10; }

        #click-blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: none; cursor: grab;
        }
        #click-blocker.active { display: block; }
        #click-blocker:active { cursor: grabbing; }

        #collection-info {
            position: absolute; color: #FFFFFF; opacity: 0; pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
            z-index: 200; top: 12svh; left: 6vw; max-width: 340px;
            will-change: transform, opacity;
        }
        #collection-info.active { opacity: 1; }
        #collection-info h2 { font-size: 1.5rem; font-weight: 500; margin: 0 0 12px 0; letter-spacing: 0.01em; }
        #collection-info p { font-size: 0.95rem; line-height: 1.5; margin: 0; opacity: 0.85; }

        #close-btn {
            position: absolute; top: 6svh; right: 5vw; color: #666666; font-size: 1rem;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease, color 0.3s ease; 
            z-index: 200; padding: 15px; margin: -15px; display: flex; align-items: center; justify-content: center;
        }
        #close-btn.active { opacity: 1; pointer-events: auto; }
        #close-btn:hover { color: #FFFFFF; }
        
        .desktop-text { display: flex; align-items: center; gap: 6px; }
        .desktop-icon { width: 16px; height: 16px; }
        .mobile-icon { display: none; }

        .dom-card {
            position: absolute; top: 0; left: 0; transform-origin: center center;
            will-change: transform, opacity; display: flex; align-items: center; justify-content: center; overflow: hidden; 
        }
        .dom-card img, .dom-card video {
            width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; transition: box-shadow 0.4s ease; 
        }

        .cluster-title {
            position: absolute; top: 0; left: 0; transform-origin: center center;
            will-change: transform, opacity; color: #FFFFFF; font-size: 0.98rem; text-align: center; white-space: nowrap; letter-spacing: 0.01em;
        }

        #project-switcher { display: none !important; }

        @media (max-width: 768px) {
            .cluster-title { font-size: 1.15rem; }
            #collection-info { top: 10svh; left: 50%; transform: translateX(-50%); text-align: center; width: 85vw; max-width: none; }
            .desktop-text { display: none; }
            .mobile-icon { display: block; width: 28px; height: 28px; color: #FFFFFF; }
            #close-btn { top: 3svh; right: 3vw; color: #FFFFFF; }
            
            /* Mobile Contact Panel Refinements */
            #contact-btn.is-open {
                width: 150px;
                height: 176px;
                border-radius: 20px;
            }
            .contact-list {
                padding: 12px 8px;
                gap: 2px;
            }
            .contact-item {
                padding: 8px 12px;
                font-size: 14px;
                border-radius: 12px;
            }
            .contact-item svg, .be-logo {
                width: 16px;
                height: 16px;
            }
            .be-logo {
                font-size: 15px;
            }

            /* Mobile Mind Map Interaction Text Placement */
            #mindmap-interact-text {
                top: 88svh;
            }
            
            /* Mobile Scroll Indicator Offset */
            .scroll-instruction {
                top: 89svh !important;
            }
        }

        /* ==========================================================================
           SCENE 3 (MIND MAP) STYLES
           ========================================================================== */
        #mindmap-canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #mindmap-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333333;
            pointer-events: none;
            transition: opacity 0.5s ease;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
         SCENE 1: WEBGL LANDING
         ========================================================================== -->
    <div id="scene-one">
        <div id="webgl-module">
            <div id="home-btn" class="nav-btn">Joel Meshak</div>
            
            <!-- Morphing Contact Button -->
            <div id="contact-btn" class="nav-btn">
                <div class="contact-label">Contact</div>
                <div class="contact-list">
                    <div class="contact-item" data-copy="byjoelmeshak@gmail.com">
                        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Email</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="https://www.instagram.com/byjoelmeshak/">
                        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Instagram</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="https://www.behance.net/JoelMeshak">
                        <span class="be-logo">Bē</span>
                        <div class="item-text-wrapper">
                            <span class="original">Behance</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="+254795330183">
                        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Phone</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="welcome-title" class="welcome-text"></div>
            <div class="scroll-instruction" id="scroll-text"><span>Scroll Down</span></div>
            <div id="labels-container"></div>
            <div id="canvas-container"></div>
        </div>
    </div>

    <!-- ==========================================================================
         SCENE 2: UNIVERSAL COLLECTIONS
         ========================================================================== -->
    <div id="scene-two">
        <div id="scene-two-back-btn" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </div>
        
        <div id="click-blocker"></div>
        
        <div id="collection-info">
            <h2 id="info-title">Title</h2>
            <p id="info-desc">Description goes here.</p>
        </div>
        
        <div id="close-btn">
            <span class="desktop-text">
                Close
                <svg class="desktop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </span>
            <svg class="mobile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </div>

        <div id="dom-layer"></div>
        <div id="project-switcher"></div>
    </div>

    <!-- ==========================================================================
         SCENE 3: MIND MAP
         ========================================================================== -->
    <div id="scene-three">
        <div id="scene-three-back-btn" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </div>
        <div id="mindmap-welcome-title" class="welcome-text"></div>
        <div id="mindmap-interact-text" class="welcome-text">Touch to interact</div>
        <div id="mindmap-loading">Loading Mind Map...</div>
        <div id="mindmap-canvas-container"></div>
    </div>

    <!-- ==========================================================================
         GLOBAL ROUTING LOGIC & VIRTUAL VIEWPORT STATE
         ========================================================================== -->
    <script>
        // Virtual Viewport State: Locks dimensions to prevent mobile address bar jumps
        window.ViewportState = {
            width: window.innerWidth,
            height: window.innerHeight
        };

        // Global Virtual Scroll Engine
        window.VirtualScroll = {
            scene1Raw: 0,
            scene1Max: window.innerHeight * 1.5, // 1.5 screens of virtual scroll to trigger
            scene2Y: 0,
            scene2TargetY: 0,
            scene2Max: 0
        };

        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        window.currentActiveScene = 1;
        window.targetForceField = 0.0; 

        window.openCollectionFromFolder = function(projectIndex) {
            const s1 = document.getElementById('scene-one');
            
            s1.style.opacity = '0';
            s1.style.pointerEvents = 'none';
            
            if (projectIndex === 99) {
                // Route to Mind Map (Scene 3)
                window.currentActiveScene = 3;
                const s3 = document.getElementById('scene-three');
                const backBtn3 = document.getElementById('scene-three-back-btn');
                
                setTimeout(() => {
                    s3.style.opacity = '1';
                    s3.style.pointerEvents = 'auto';
                    backBtn3.classList.add('active');
                    if (window.startMindMapTypewriter) window.startMindMapTypewriter();
                }, 800);
            } else {
                // Route to Collections (Scene 2)
                window.currentActiveScene = 2;
                
                const s2 = document.getElementById('scene-two');
                const backBtn2 = document.getElementById('scene-two-back-btn');
                
                setTimeout(() => {
                    s2.style.opacity = '1';
                    s2.style.pointerEvents = 'auto';
                    backBtn2.classList.add('active');
                    if (window.loadProject) window.loadProject(projectIndex);
                }, 800);
            }
        };

        window.returnToSceneOne = function() {
            window.currentActiveScene = 1;
            
            if (window.activeClusterIndex !== -1 && window.closeCarousel) {
                window.closeCarousel(true);
            }
            
            if (window.resetMindMapTypewriter) window.resetMindMapTypewriter();
            
            const s1 = document.getElementById('scene-one');
            const s2 = document.getElementById('scene-two');
            const s3 = document.getElementById('scene-three');
            const backBtn2 = document.getElementById('scene-two-back-btn');
            const backBtn3 = document.getElementById('scene-three-back-btn');
            
            s2.style.opacity = '0';
            s2.style.pointerEvents = 'none';
            s3.style.opacity = '0';
            s3.style.pointerEvents = 'none';
            backBtn2.classList.remove('active');
            backBtn3.classList.remove('active');
            
            // Reset Virtual Scroll to fully open state so scrolling up reverses it
            window.VirtualScroll.scene1Raw = window.VirtualScroll.scene1Max;

            setTimeout(() => {
                s1.style.opacity = '1';
                s1.style.pointerEvents = 'auto';
                
                setTimeout(() => {
                    window.targetForceField = 0.0; 
                    if (window.triggerFolderClose) window.triggerFolderClose(); 
                }, 100);
            }, 800);
        };

        document.getElementById('scene-two-back-btn').addEventListener('click', window.returnToSceneOne);
        document.getElementById('scene-three-back-btn').addEventListener('click', window.returnToSceneOne);

        // ==========================================================================
        // CONTACT MENU LOGIC
        // ==========================================================================
        const contactBtn = document.getElementById('contact-btn');
        const contactItems = document.querySelectorAll('.contact-item');

        contactBtn.addEventListener('click', (e) => {
            if (!contactBtn.classList.contains('is-open')) {
                contactBtn.classList.add('is-open');
                e.stopPropagation();
            }
        });

        document.addEventListener('click', (e) => {
            if (contactBtn.classList.contains('is-open') && !contactBtn.contains(e.target)) {
                contactBtn.classList.remove('is-open');
            }
        });

        contactItems.forEach(item => {
            item.addEventListener('click', (e) => {

        function formatTitle(str) {
            return str.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function buildMediaData(project) {
            const data = [];
            if (project.collections) {
                project.collections.forEach(col => {
                    data.push({
                        title: formatTitle(col.title),
                        description: col.description !== undefined ? col.description : "Explore the " + formatTitle(col.title) + " collection.",
                        assets: col.gallery.map(src => ({ type: 'img', src }))
                    });
                });
            }
            if (project.gallery && !project.collections) {
                data.push({
                    title: project.galleryTitle !== undefined ? project.galleryTitle : "Gallery", 
                    description: project.galleryDescription !== undefined ? project.galleryDescription : "A curated selection of works.",
                    assets: project.gallery.map(src => ({ type: 'img', src }))
                });
            }
            if (project.videos && project.videos.length > 0) {
                data.push({
                    title: project.videoTitle !== undefined ? project.videoTitle : "Video", 
                    description: project.videoDescription !== undefined ? project.videoDescription : "Cinematic explorations and motion design.",
                    assets: project.videos.map(src => ({ type: 'video', src }))
                });
            }
            return data;
        }

        const domLayer = document.getElementById('dom-layer');
        const clickBlocker = document.getElementById('click-blocker');
        const infoBox = document.getElementById('collection-info');
        const infoTitle = document.getElementById('info-title');
        const infoDesc = document.getElementById('info-desc');
        const closeBtn = document.getElementById('close-btn');

        window.activeClusterIndex = -1;
        let isClosing = false;
        let carouselTargetScroll = 0;
        let carouselCurrentScroll = 0;
        let maxCarouselScroll = 0;
        
        const tempPos = new THREE.Vector3();
        let lastCameraY = -9999;

        const scene2 = new THREE.Scene();
        const camera2 = new THREE.PerspectiveCamera(45, window.ViewportState.width / window.ViewportState.height, 0.1, 1000);
        const renderer2 = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer2.setSize(window.ViewportState.width, window.ViewportState.height);
        renderer2.setPixelRatio(window.innerWidth < 768 ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
        document.getElementById('scene-two').insertBefore(renderer2.domElement, document.getElementById('click-blocker'));

        const raycaster2 = new THREE.Raycaster();
        const mouse2 = new THREE.Vector2();

        let pixelsPerUnit = 1;
        let initialCameraY = 0;
        let isMobile = window.ViewportState.width < 768;

        const cardGeometry = new THREE.PlaneGeometry(CONFIG.cardWidth, CONFIG.cardHeight);
        
        const projectCache = {}; 
        let clusters = [];
        let numClusters = 0;
        let currentMediaData = [];

        function updateCardDimensions(card, nWidth, nHeight) {
            if (!nWidth || !nHeight || nHeight === 0 || !isFinite(nWidth) || !isFinite(nHeight)) {
                card.actualWidth = CONFIG.cardWidth;
                card.actualHeight = CONFIG.cardHeight;
            } else {
                const aspect = nWidth / nHeight;
                const boxAspect = CONFIG.cardWidth / CONFIG.cardHeight;
                
                if (aspect < boxAspect) {
                    card.actualHeight = CONFIG.cardHeight;
                    card.actualWidth = CONFIG.cardHeight * aspect;
                } else {
                    card.actualWidth = CONFIG.cardWidth;
                    card.actualHeight = CONFIG.cardWidth / aspect;
                }
            }
            
            const scaleMult = isMobile ? 0.74 : 1.0;
            const pxWidth = card.actualWidth * scaleMult * pixelsPerUnit;
            const pxHeight = card.actualHeight * scaleMult * pixelsPerUnit;
            
            if (isFinite(pxWidth) && isFinite(pxHeight)) {
                card.domElement.style.width = `${pxWidth}px`;
                card.domElement.style.height = `${pxHeight}px`;
            }

            if (window.activeClusterIndex !== -1) calculateCarouselBounds();
        }

        function preloadAllProjects() {
            allProjectsData.forEach((project, projectIndex) => {
                const mediaData = buildMediaData(project);
                const numClusters = mediaData.length;
                const projectClusters = [];

                for (let i = 0; i < numClusters; i++) {
                    const clusterGroup = new THREE.Group();
                    const cards = [];

                    const hitboxGeo = new THREE.PlaneGeometry(CONFIG.cardWidth * 1.5, CONFIG.cardHeight * 1.5);
                    const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });
                    const hitbox = new THREE.Mesh(hitboxGeo, hitboxMat);
                    hitbox.userData = { isHitbox: true, clusterIndex: i };
                    clusterGroup.add(hitbox);

                    const clusterData = mediaData[i];
                    const numCardsInCluster = clusterData.assets.length;

                    for (let j = 0; j < numCardsInCluster; j++) {
                        const mat = new THREE.MeshBasicMaterial({ visible: false });
                        const mesh = new THREE.Mesh(cardGeometry, mat);

                        let baseRotZ = 0, baseX = 0, baseY = 0;
                        if (numCardsInCluster >= 3) {
                            if (j === 0) baseRotZ = 14 * (Math.PI / 180);
                            else if (j === 1) baseRotZ = -14 * (Math.PI / 180);
                        } else if (numCardsInCluster === 2) {
                            if (j === 0) baseRotZ = 10 * (Math.PI / 180);
                        }

                        clusterGroup.add(mesh);

                        const media = clusterData.assets[j];
                        const domEl = document.createElement('div');
                        domEl.className = 'dom-card';
                        domEl.style.display = 'none'; 
                        
                        let mediaElement;
                        if (media.type === 'video') {
                            mediaElement = document.createElement('video');
                            mediaElement.loop = true; mediaElement.muted = true; mediaElement.playsInline = true;
                            mediaElement.preload = "auto"; 
                            mediaElement.src = media.src;
                            mediaElement.load();
                        } else {
                            mediaElement = document.createElement('img');
                            mediaElement.decoding = "async"; 
                            mediaElement.src = media.src;
                        }
                        
                        domEl.appendChild(mediaElement);
                        domLayer.appendChild(domEl);
                        
                        const cardObj = {
                            mesh: mesh, domElement: domEl, 
                            mediaElement: mediaElement, mediaSrc: media.src, isVideo: media.type === 'video',
                            baseRotZ: baseRotZ, baseX: baseX, baseY: baseY,
                            phaseX: Math.random() * Math.PI * 2, phaseY: Math.random() * Math.PI * 2, phaseRot: Math.random() * Math.PI * 2,
                            x: baseX, y: baseY, z: -j * 0.1, rotX: 0, rotY: 0, rotZ: baseRotZ,
                            vx: 0, vy: 0, vz: 0, vRotX: 0, vRotY: 0, vRotZ: 0,
                            opacity: 0, tOpacity: 0,
                            isLoaded: true, 
                            actualWidth: CONFIG.cardWidth, 
                            actualHeight: CONFIG.cardHeight,
                            carouselTargetX: 0,
                            carouselTargetY: 0
                        };

                        if (media.type === 'video') {
                            mediaElement.onloadedmetadata = function() {
                                updateCardDimensions(cardObj, this.videoWidth, this.videoHeight);
                            };
                        } else {
                            mediaElement.onload = function() {
                                updateCardDimensions(cardObj, this.naturalWidth, this.naturalHeight);
                            };
                        }

                        cards.push(cardObj);
                    }

                    const titleEl = document.createElement('div');
                    titleEl.className = 'cluster-title';
                    titleEl.innerText = clusterData.title;
                    titleEl.style.display = 'none'; 
                    domLayer.appendChild(titleEl);

                    projectClusters.push({
                        group: clusterGroup, hitbox: hitbox, cards: cards, titleElement: titleEl,
                        home: new THREE.Vector3(), isHovered: false, titleOpacity: 1, tTitleOpacity: 1,
                        isFullyLoaded: true 
                    });
                }
                projectCache[projectIndex] = projectClusters;
            });
        }
        
        preloadAllProjects();

        window.loadProject = function(projectIndex) {
            if (window.activeClusterIndex !== -1) window.closeCarousel(true); 
            
            clusters.forEach(c => {
                scene2.remove(c.group);
                c.cards.forEach(card => {
                    card.domElement.style.display = 'none';
                    if (card.isVideo && !card.mediaElement.paused) card.mediaElement.pause();
                });
                c.titleElement.style.display = 'none';
            });

            window.VirtualScroll.scene2Y = 0;
            window.VirtualScroll.scene2TargetY = 0;

            currentMediaData = buildMediaData(allProjectsData[projectIndex]);
            numClusters = currentMediaData.length;
            clusters = projectCache[projectIndex];
            
            clusters.forEach(c => {
                scene2.add(c.group);
                c.cards.forEach(card => card.domElement.style.display = 'flex');
                c.titleElement.style.display = 'block';
            });

            updateLayouts();
            camera2.updateMatrixWorld();
            
            clusters.forEach((cluster, i) => {
                cluster.cards.forEach((card, j) => {
                    card.x = cluster.home.x + card.baseX;
                    card.y = cluster.home.y + card.baseY;
                    card.z = -j * 0.1;
                    card.rotZ = card.baseRotZ;
                    card.vx = 0; card.vy = 0; card.vz = 0; card.vRotZ = 0;
                    card.mesh.position.set(card.x, card.y, card.z);
                    
                    card.opacity = j < 3 ? 1 : 0;
                    card.domElement.style.opacity = card.opacity;
                    card.domElement.style.visibility = card.opacity > 0 ? 'visible' : 'hidden';
                });
            });
        };

        function manageVideos() {
            clusters.forEach((cluster, i) => {
                const shouldPlay = (window.activeClusterIndex === i) || (window.activeClusterIndex === -1 && cluster.isHovered);
                cluster.cards.forEach(card => {
                    if (card.isVideo && card.isLoaded) {
                        if (shouldPlay) {
                            if (card.mediaElement.paused) {
                                const playPromise = card.mediaElement.play();
                                if (playPromise !== undefined) playPromise.catch(() => {});
                            }
                        } else {
                            if (!card.mediaElement.paused) card.mediaElement.pause();
                        }
                    }
                });
            });
        }

        function calculateCarouselBounds() {
            if (window.activeClusterIndex === -1) return;
            const cluster = clusters[window.activeClusterIndex];
            if (!cluster || !cluster.cards || cluster.cards.length === 0) return;

            const scaleMult = isMobile ? 0.74 : 1.0;
            const zoomFactor = isMobile ? 0.15 : 0.55;
            const targetZ = camera2.position.z * zoomFactor;
            const distance = camera2.position.z - targetZ;
            const fovRad = camera2.fov * (Math.PI / 180);
            const visibleHeightAtZ = 2 * Math.tan(fovRad / 2) * distance;
            const visibleWidthAtZ = visibleHeightAtZ * camera2.aspect;
            
            if (!isFinite(visibleWidthAtZ) || !isFinite(visibleHeightAtZ)) {
                cluster.cards.forEach((c, k) => {
                    c.carouselTargetX = k * (CONFIG.cardWidth + 1);
                    c.carouselTargetY = -k * (CONFIG.cardHeight + 1);
                });
                return;
            }
            
            if (isMobile) {
                const topEdgeAtZ = camera2.position.y + visibleHeightAtZ / 2;
                const textBottomAtZ = topEdgeAtZ - (visibleHeightAtZ * 0.33);
                
                const startY = textBottomAtZ - (cluster.cards[0].actualHeight * scaleMult / 2);
                let currentY = startY;
                
                for (let k = 0; k < cluster.cards.length; k++) {
                    const c = cluster.cards[k];
                    if (k > 0) {
                        const prevC = cluster.cards[k-1];
                        currentY -= (prevC.actualHeight * scaleMult / 2) + CONFIG.carouselEdgeGapMobile + (c.actualHeight * scaleMult / 2);
                    }
                    c.carouselTargetY = currentY;
                }
                
                const lastCard = cluster.cards[cluster.cards.length - 1];
                const bottommostY = lastCard.carouselTargetY - (lastCard.actualHeight * scaleMult / 2);
                const bottomEdgeAtZ = camera2.position.y - visibleHeightAtZ / 2;
                const endPadding = visibleHeightAtZ * 0.05;
                
                if (bottommostY < bottomEdgeAtZ + endPadding) {
                    maxCarouselScroll = bottomEdgeAtZ - bottommostY + endPadding;
                } else { maxCarouselScroll = 0; }
                
            } else {
                const leftEdgeAtZ = -visibleWidthAtZ / 2;
                const marginXAtZ = visibleWidthAtZ * 0.06; 
                
                const startX = leftEdgeAtZ + marginXAtZ + (cluster.cards[0].actualWidth * scaleMult / 2);
                let currentX = startX;
                
                for (let k = 0; k < cluster.cards.length; k++) {
                    const c = cluster.cards[k];
                    if (k > 0) {
                        const prevC = cluster.cards[k-1];
                        currentX += (prevC.actualWidth * scaleMult / 2) + CONFIG.carouselEdgeGapDesktop + (c.actualWidth * scaleMult / 2);
                    }
                    c.carouselTargetX = currentX;
                }
                
                const lastCard = cluster.cards[cluster.cards.length - 1];
                const rightmostX = lastCard.carouselTargetX + (lastCard.actualWidth * scaleMult / 2);
                const allowedRightEdge = (visibleWidthAtZ / 2) - marginXAtZ;
                
                if (rightmostX > allowedRightEdge) {
                    const endPadding = visibleWidthAtZ * 0.05; 
                    maxCarouselScroll = rightmostX - allowedRightEdge + endPadding;
                } else { maxCarouselScroll = 0; }
            }
            
            maxCarouselScroll = Math.max(0, maxCarouselScroll || 0);
            carouselTargetScroll = Math.min(carouselTargetScroll, maxCarouselScroll);
        }

        function updateLayouts() {
            isMobile = window.ViewportState.width < 768;
            const cols = isMobile ? 1 : 3;
            const gapX = isMobile ? 0 : CONFIG.desktopGapX;
            const gapY = isMobile ? CONFIG.mobileGapY : CONFIG.desktopGapY;
            
            const rows = Math.ceil(numClusters / cols);
            const scaleMult = isMobile ? 0.74 : 1.0;

            const fixedCols = isMobile ? 1 : 3;
            const startX = isMobile ? 0 : -((fixedCols - 1) * gapX) / 2;

            clusters.forEach((cluster, i) => {
                const row = Math.floor(i / cols);
                const col = i % cols;
                
                cluster.home.set(startX + col * gapX, -row * gapY, 0);
                cluster.hitbox.position.copy(cluster.home); 
                cluster.hitbox.scale.set(scaleMult, scaleMult, 1);
                cluster.cards.forEach(card => card.mesh.scale.set(scaleMult, scaleMult, 1));
            });

            const fovRad = camera2.fov * (Math.PI / 180);
            const aspect = window.ViewportState.width / window.ViewportState.height;
            
            const frameCols = isMobile ? 1 : 3;
            const frameRows = isMobile ? 4 : 2; 

            if (isMobile) {
                const targetWidth = CONFIG.cardWidth * 1.18; 
                camera2.position.z = (targetWidth / 2) / (Math.tan(fovRad / 2) * aspect);
            } else {
                const targetWidth = ((frameCols - 1) * gapX) + CONFIG.cardWidth;
                const paddedWidth = targetWidth * 1.15; 
                const targetHeight = ((frameRows - 1) * gapY) + CONFIG.cardHeight + CONFIG.titleOffsetY;
                const paddedHeight = targetHeight * 1.15;
                camera2.position.z = Math.max((paddedWidth / 2) / (Math.tan(fovRad / 2) * aspect), (paddedHeight / 2) / Math.tan(fovRad / 2));
            }

            const visibleHeightAtZ0 = 2 * Math.tan(fovRad / 2) * camera2.position.z;
            pixelsPerUnit = window.ViewportState.height / visibleHeightAtZ0;
            
            if (!isFinite(pixelsPerUnit) || pixelsPerUnit === 0) pixelsPerUnit = 1;
            
            if (window.activeClusterIndex === -1) {
                if (isMobile) {
                    initialCameraY = -(visibleHeightAtZ0 / 2) + ((CONFIG.cardHeight * scaleMult) / 2) + 1.2;
                    const maxScroll3D = Math.max(0, Math.abs(initialCameraY - (-(rows - 1) * gapY)));
                    window.VirtualScroll.scene2Max = (maxScroll3D * pixelsPerUnit) + (window.ViewportState.height * 0.3);
                } else if (rows > frameRows) {
                    const maxScroll3D = Math.max(0, (rows - 1) * gapY);
                    window.VirtualScroll.scene2Max = maxScroll3D * pixelsPerUnit;
                    initialCameraY = 0; 
                } else {
                    window.VirtualScroll.scene2Max = 0;
                    initialCameraY = -((frameRows - 1) * gapY) / 2;
                }
                camera2.position.y = initialCameraY - (window.VirtualScroll.scene2Y / pixelsPerUnit);
            }

            updateDOMDimensions(scaleMult);
            calculateCarouselBounds();
        }

        function updateDOMDimensions(scaleMult) {
            const pxRadius = CONFIG.cardRadius * scaleMult * pixelsPerUnit;
            domLayer.style.perspective = `${camera2.position.z * pixelsPerUnit}px`;

            clusters.forEach(cluster => {
                cluster.cards.forEach(card => {
                    const pxWidth = card.actualWidth * scaleMult * pixelsPerUnit;
                    const pxHeight = card.actualHeight * scaleMult * pixelsPerUnit;
                    
                    if (isFinite(pxWidth) && isFinite(pxHeight)) {
                        card.domElement.style.width = `${pxWidth}px`;
                        card.domElement.style.height = `${pxHeight}px`;
                        card.domElement.style.borderRadius = `${pxRadius}px`; 
                    }
                });
            });
        }

        window.addEventListener('click', (event) => {
            if (window.currentActiveScene !== 2) return;
            if (event.target.closest('#project-switcher') || event.target.closest('#close-btn') || event.target.closest('#collection-info') || event.target.closest('#scene-two-back-btn')) {
                return;
            }

            if (window.activeClusterIndex !== -1) return; 

            mouse2.x = (event.clientX / window.ViewportState.width) * 2 - 1;
            mouse2.y = -(event.clientY / window.ViewportState.height) * 2 + 1;
            raycaster2.setFromCamera(mouse2, camera2);
            
            const hitboxes = clusters.map(c => c.hitbox);
            const intersects = raycaster2.intersectObjects(hitboxes);

            if (intersects.length > 0) {
                window.activeClusterIndex = intersects[0].object.userData.clusterIndex;
                isClosing = false;
                
                const clusterData = currentMediaData[window.activeClusterIndex];
                infoTitle.innerText = clusterData.title;
                infoDesc.innerHTML = clusterData.description; 
                
                clickBlocker.classList.add('active');
                infoBox.classList.add('active');
                closeBtn.classList.add('active');
                
                document.getElementById('scene-two-back-btn').classList.remove('active');
                
                carouselCurrentScroll = 0;
                carouselTargetScroll = 0;
                
                manageVideos();
                calculateCarouselBounds();
            }
        });

        window.closeCarousel = function(instant = false) {
            if (window.activeClusterIndex === -1) return;

            const cluster = clusters[window.activeClusterIndex];

                                    const topEdgeAtZ = visibleHeightAtZ / 2;

                                    targetX = card.carouselTargetX - carouselCurrentScroll;

                            } else {
                                targetOpacity = 0;

                        if (!isFinite(targetX)) targetX = card.x || 0;
                        if (!isFinite(targetY)) targetY = card.y || 0;

                        const isAsleep = 
                            Math.abs(card.vx) < 0.001 && Math.abs(targetX - card.x) < 0.001 &&
                            Math.abs(card.vy) < 0.001 && Math.abs(targetY - card.y) < 0.001 &&
                            Math.abs(card.vz) < 0.001 && Math.abs(targetZ - card.z) < 0.001 &&
                            Math.abs(card.vRotZ) < 0.001 && Math.abs(targetRotZ - card.rotZ) < 0.001 &&
                            Math.abs(targetOpacity - card.opacity) < 0.001;

                        if (!isAsleep) {
                            card.vx += (targetX - card.x) * currentTension;
                            card.vy += (targetY - card.y) * currentTension;
                            card.vz += (targetZ - card.z) * currentTension;

                        }

                        folder.userData.fileVels[j] += (targetLift - folder.userData.fileLifts[j]) * tension;
                        folder.userData.fileVels[j] *= friction;
                        folder.userData.fileLifts[j] += folder.userData.fileVels[j];
                    }

                    folder.userData.fileGroups[0].position.set(-34.57, -42.37 + folder.userData.fileLifts[0], -5);
                    folder.userData.fileGroups[1].position.set(0, 0 + folder.userData.fileLifts[1], 2);
                    folder.userData.fileGroups[2].position.set(68.83, 93.24 + folder.userData.fileLifts[2], 9);

                    folder.userData.files[0].position.y = -26.9 + Math.sin(globalTime * 2.0 + 0.0 + i) * 4.2 * organicSwayFactor;
                    folder.userData.files[1].position.y = -25.72 + Math.sin(globalTime * 2.0 + 1.5 + i) * 4.2 * organicSwayFactor;
                    folder.userData.files[2].position.y = -43.32 + Math.sin(globalTime * 2.0 + 3.0 + i) * 4.2 * organicSwayFactor;

                    folder.updateMatrixWorld(true);

                    const setIM = (dummy, im) => {
                        tempMat.copy(dummy.matrixWorld).premultiply(inverseCarouselMatrix);
                        im.setMatrixAt(i, tempMat);
                    };

                    setIM(folder.userData.dummies.front, frontIM);
                    setIM(folder.userData.dummies.back, backIM);
                    setIM(folder.userData.dummies.f1, file1IM);
                    setIM(folder.userData.dummies.f2, file2IM);
                    setIM(folder.userData.dummies.f3, file3IM);

                    tempV.set(0, -385, 0); 
                    tempV.applyMatrix4(folder.matrixWorld);
                    tempV.project(carouselCam);
                    
                    labelCache[i].x = (tempV.x * 0.5 + 0.5) * window.ViewportState.width;
                    labelCache[i].y = -(tempV.y * 0.5 - 0.5) * window.ViewportState.height;
                    
                    // Decoupled labels from isSystemLocked, tied to carouselEntrance > 0.5
                    labelCache[i].focus = Math.abs(wrappedTheta) < 0.25 && carouselEntrance > 0.5;
                    labelCache[i].hover = folder.userData.isHovered;
                });

                thawAttribute.needsUpdate = true;
                frontIM.instanceMatrix.needsUpdate = true;
                backIM.instanceMatrix.needsUpdate = true;
                file1IM.instanceMatrix.needsUpdate = true;
                file2IM.instanceMatrix.needsUpdate = true;
                file3IM.instanceMatrix.needsUpdate = true;

                // Performance optimization: Only render Scene 1 if it's active
                renderer.clear();
                renderer.render(orbScene, orbCam);
                renderer.clearDepth();
                renderer.render(carouselScene, carouselCam);
            }
        }
        
        renderer.compile(orbScene, orbCam);
        renderer.compile(carouselScene, carouselCam);

        animate();
    </script>
</body>
</html>
