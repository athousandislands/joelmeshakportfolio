<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Joel Meshak</title>

    <!-- Single Three.js build (ESM). The r128 UMD build has been removed:
         Scene 2 no longer uses WebGL at all. -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* ==========================================================================
           VIEWPORT UNITS
           --------------------------------------------------------------------------
           --vh is written by the Viewport module from the SAME height value the
           renderers are sized to. CSS and WebGL therefore agree by construction.
           `svh` is no longer used anywhere: it was the source of the fixed vertical
           gap between the canvas (sized in innerHeight px) and its container.
           ========================================================================== */
        :root {
            --vh: 1vh;
            --vw: 1vw;
            --app-h: calc(var(--vh) * 100);
            --app-w: calc(var(--vw) * 100);
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #CCCCCC;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: var(--app-w);
            height: var(--app-h);
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================================================
           SCENE WRAPPERS
           ========================================================================== */
        #scene-one, #scene-two, #scene-three {
            position: fixed;
            top: 0; left: 0;
            width: var(--app-w);
            height: var(--app-h);
            transition: opacity 0.8s ease;
        }

        #scene-two, #scene-three {
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* ==========================================================================
           SCENE 1 (WEBGL LANDING)
           ========================================================================== */
        #webgl-module {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        .nav-btn {
            position: fixed;
            top: 32px; left: 32px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-weight: 500; font-size: 14px; color: #777777;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 13px rgba(0, 0, 0, 0.0214);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            z-index: 200; user-select: none; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
            --x: 50%; --y: 50%;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.35); transform: translateY(-1px); color: #ffffff;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 6px 16px rgba(0, 0, 0, 0.03);
        }
        .nav-btn:active { transform: translateY(0px); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 2px 8px rgba(0, 0, 0, 0.02); }
        .nav-btn:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }

        @media (hover: hover) and (pointer: fine) {
            .nav-btn::after {
                content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
                background: radial-gradient(28px circle at var(--x) var(--y), rgba(255, 255, 255, 0.95), transparent 100%);
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
                opacity: 0; transition: opacity 0.3s ease, border-radius 0.5s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
            }
            .nav-btn:hover::after { opacity: 1; }
        }

        #home-btn { opacity: 0; pointer-events: none; }

        #contact-btn {
            left: auto;
            right: 32px;
            width: 104px;
            height: 42px;
            padding: 0;
            display: block;
            overflow: hidden;
            box-sizing: border-box;
            opacity: 0; pointer-events: none;
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        border-radius 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.5s ease,
                        box-shadow 0.5s ease,
                        backdrop-filter 0.5s ease,
                        -webkit-backdrop-filter 0.5s ease,
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.8s ease;
        }

        #contact-btn.is-open {
            width: 180px;
            height: 204px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.25) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4),
                        inset 0 0 20px rgba(255, 255, 255, 0.08),
                        0 8px 24px rgba(0, 0, 0, 0.03),
                        0 1px 3px rgba(0, 0, 0, 0.01);
            transform: translateY(0) !important;
            cursor: default;
        }

        .contact-label {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 42px;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }
        #contact-btn.is-open .contact-label { opacity: 0; pointer-events: none; }

        .contact-list {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 16px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
        }
        #contact-btn.is-open .contact-list { opacity: 1; pointer-events: auto; }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: background 0.2s ease, transform 0.3s ease, opacity 0.2s ease;
        }
        #contact-btn.is-open .contact-item {
            opacity: 1;
            transform: translateY(0);
            transition: background 0.2s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }
        #contact-btn.is-open .contact-item:nth-child(1) { transition-delay: 0.10s; }
        #contact-btn.is-open .contact-item:nth-child(2) { transition-delay: 0.15s; }
        #contact-btn.is-open .contact-item:nth-child(3) { transition-delay: 0.20s; }
        #contact-btn.is-open .contact-item:nth-child(4) { transition-delay: 0.25s; }
        .contact-item:hover { background: rgba(255, 255, 255, 0.2); }

        .contact-item svg {
            width: 18px; height: 18px;
            stroke: currentColor; fill: none;
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }

        .be-logo {
            font-family: inherit; font-weight: 700; font-size: 16px; letter-spacing: -0.5px;
            display: flex; align-items: center; justify-content: center;
            width: 18px; height: 18px;
        }

        .item-text-wrapper { position: relative; display: flex; align-items: center; flex: 1; }
        .item-text-wrapper span { transition: opacity 0.3s ease, transform 0.3s ease; }
        .item-text-wrapper .copied {
            position: absolute; left: 0; color: #34C759;
            opacity: 0; transform: translateY(4px); font-weight: 500;
        }
        .contact-item.is-copied .original { opacity: 0; transform: translateY(-4px); }
        .contact-item.is-copied .copied { opacity: 1; transform: translateY(0); }

        #scene-two-back-btn, #scene-three-back-btn { opacity: 0; pointer-events: none; }
        #scene-two-back-btn.active, #scene-three-back-btn.active { opacity: 1; pointer-events: auto; }
        #scene-two-back-btn svg, #scene-three-back-btn svg { width: 16px; height: 16px; transition: stroke 0.3s ease; }

        .welcome-text {
            position: fixed;
            top: calc(var(--vh) * 10);
            width: 100%;
            text-align: center;
            color: #FFFFFF;
            z-index: 10;
            font-weight: 400;
            font-size: 1.125rem;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .welcome-text::after {
            content: '|';
            animation: blink 1s step-start infinite;
            margin-left: 4px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .welcome-text.done::after { opacity: 0; }
        @keyframes blink { 50% { opacity: 0; } }

        #mindmap-interact-text {
            top: calc(var(--vh) * 90);
            opacity: 0;
            pointer-events: none;
        }
        #mindmap-interact-text::after { content: none; }
        #mindmap-interact-text.fade-in {
            animation: interactFadeIn 0.8s ease forwards, interactPulse 4s infinite ease-in-out 0.8s;
        }
        #mindmap-interact-text.hidden {
            opacity: 0 !important;
            animation: none !important;
            transition: opacity 0.3s ease;
        }
        @keyframes interactFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes interactPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .scroll-instruction {
            position: fixed; top: calc(var(--vh) * 85); width: 100%; text-align: center; color: #FFFFFF;
            z-index: 10; font-weight: 400; font-size: 1.125rem;
            opacity: 0; transition: opacity 1s ease; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        @keyframes pulseText {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        .scroll-instruction span { animation: pulseText 4s infinite ease-in-out; }

        #labels-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .folder-label {
            position: absolute; top: 0; left: 0;
            font-family: inherit;
            font-size: 16px; font-weight: 400; color: #777777;
            opacity: 0; transition: opacity 0.4s ease, color 0.4s ease;
            text-align: center; white-space: nowrap;
            will-change: transform, opacity;
        }
        .folder-label.focus { opacity: 1; }
        .folder-label.hover { color: #ffffff; }

        /* ==========================================================================
           SCENE 2 (COLLECTIONS) — pure DOM, no canvas
           ========================================================================== */
        #dom-layer {
            display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        #native-scroll-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            z-index: 5;
            display: none;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #native-scroll-container::-webkit-scrollbar { display: none; }
        #native-scroll-content { width: 100%; }

        #click-blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: none;
        }
        #click-blocker.active { display: block; }

        #collection-info {
            position: absolute; color: #FFFFFF; opacity: 0; pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            top: calc(var(--vh) * 12);
            left: calc(var(--vw) * 6);
            max-width: 340px;
            will-change: transform, opacity;
        }
        #collection-info.active { opacity: 1; }
        #collection-info h2 { font-size: 1.5rem; font-weight: 500; margin: 0 0 12px 0; letter-spacing: 0.01em; }
        #collection-info p { font-size: 0.95rem; line-height: 1.5; margin: 0; opacity: 0.85; }

        #close-btn {
            position: absolute;
            top: calc(var(--vh) * 6);
            right: calc(var(--vw) * 5);
            color: #666666; font-size: 1rem;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease, color 0.3s ease;
            z-index: 200; padding: 15px; margin: -15px; display: flex; align-items: center; justify-content: center;
        }
        #close-btn.active { opacity: 1; pointer-events: auto; }
        #close-btn:hover { color: #FFFFFF; }

        .desktop-text { display: flex; align-items: center; gap: 6px; }
        .desktop-icon { width: 16px; height: 16px; }
        .mobile-icon { display: none; }

        .dom-card {
            position: absolute; top: 0; left: 0; transform-origin: center center;
            will-change: transform, opacity; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .dom-card img, .dom-card video {
            width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none;
            transition: box-shadow 0.4s ease;
        }

        .cluster-title {
            position: absolute; top: 0; left: 0; transform-origin: center center;
            will-change: transform, opacity; color: #FFFFFF; font-size: 0.98rem; text-align: center;
            white-space: nowrap; letter-spacing: 0.01em;
        }

        /* Compact layout: driven by a class the Viewport module sets on <html>,
           not by a hardcoded media query. One breakpoint source, not three. */
        html.compact .welcome-text { top: calc(var(--vh) * 15); }
        html.compact #mindmap-interact-text { top: calc(var(--vh) * 88); }
        html.compact .cluster-title { font-size: 1.15rem; }
        html.compact #collection-info {
            top: calc(var(--vh) * 10);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: calc(var(--vw) * 85);
            max-width: none;
        }
        html.compact .desktop-text { display: none; }
        html.compact .mobile-icon { display: block; width: 28px; height: 28px; color: #FFFFFF; }
        html.compact #close-btn {
            top: calc(var(--vh) * 3);
            right: calc(var(--vw) * 3);
            color: #FFFFFF;
        }
        html.compact #contact-btn.is-open { width: 150px; height: 176px; border-radius: 20px; }
        html.compact .contact-list { padding: 12px 8px; gap: 2px; }
        html.compact .contact-item { padding: 8px 12px; font-size: 14px; border-radius: 12px; }
        html.compact .contact-item svg, html.compact .be-logo { width: 16px; height: 16px; }
        html.compact .be-logo { font-size: 15px; }
        html.compact .scroll-instruction { top: calc(var(--vh) * 89); }

        /* ==========================================================================
           SCENE 3 (MIND MAP)
           ========================================================================== */
        #mindmap-canvas-container { width: 100%; height: 100%; display: block; }

        #mindmap-loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .morph-dots {
            width: 28px; height: 28px;
            animation: colorChange 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            --text-main: #FFFFFF;
            --text-muted: #777777;
        }
        .dots-group { transform-origin: 12px 12px; animation: rotateGroup 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-1 { animation: dot1 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-2 { animation: dot2 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-3 { animation: dot3 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-4 { animation: dot4 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-5 { animation: dot5 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes colorChange {
            0%, 9% { fill: var(--text-muted); }
            10%, 40% { fill: var(--text-main); }
            41%, 100% { fill: var(--text-muted); }
        }
        @keyframes rotateGroup {
            0%, 10% { transform: rotate(0deg); }
            40%, 100% { transform: rotate(180deg); }
        }
        @keyframes dot1 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(0px, -9.5px); } }
        @keyframes dot2 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(9.03px, -2.94px); } }
        @keyframes dot3 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(5.58px, 7.68px); } }
        @keyframes dot4 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(-5.58px, 7.68px); } }
        @keyframes dot5 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(-9.03px, -2.94px); } }

        .loading-text {
            color: #FFFFFF; font-weight: 400; font-size: 1.125rem;
            margin-top: 16px;
            animation: pulseText 4s infinite ease-in-out;
        }

        @media (prefers-reduced-motion: reduce) {
            .scroll-instruction span,
            .loading-text,
            #mindmap-interact-text.fade-in { animation: none !important; }
            .welcome-text::after { animation: none; }
        }
    </style>
</head>
<body>

    <!-- ======================================================================
         SCENE 1: WEBGL LANDING
         ====================================================================== -->
    <div id="scene-one">
        <div id="webgl-module">
            <button id="home-btn" class="nav-btn" type="button">Joel Meshak</button>

            <div id="contact-btn" class="nav-btn" role="button" tabindex="0" aria-label="Contact details">
                <div class="contact-label">Contact</div>
                <div class="contact-list">
                    <div class="contact-item" data-copy="byjoelmeshak@gmail.com">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Email</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="https://www.instagram.com/byjoelmeshak/">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Instagram</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="https://www.behance.net/JoelMeshak">
                        <span class="be-logo">Bē</span>
                        <div class="item-text-wrapper">
                            <span class="original">Behance</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="+254795330183">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Phone</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="welcome-title" class="welcome-text"></div>
            <div class="scroll-instruction" id="scroll-text"><span>Scroll Down</span></div>
            <div class="scroll-instruction" id="swipe-text"><span>Swipe to Navigate</span></div>
            <div id="labels-container"></div>
            <div id="canvas-container"></div>
        </div>
    </div>

    <!-- ======================================================================
         SCENE 2: COLLECTIONS (DOM only)
         ====================================================================== -->
    <div id="scene-two">
        <button id="scene-two-back-btn" class="nav-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </button>

        <div id="native-scroll-container">
            <div id="native-scroll-content"></div>
        </div>

        <div id="click-blocker"></div>

        <div id="collection-info">
            <h2 id="info-title">Title</h2>
            <p id="info-desc">Description goes here.</p>
        </div>

        <div id="close-btn" role="button" tabindex="0" aria-label="Close collection">
            <span class="desktop-text">
                Close
                <svg class="desktop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </span>
            <svg class="mobile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </div>

        <div id="dom-layer"></div>
    </div>

    <!-- ======================================================================
         SCENE 3: MIND MAP
         ====================================================================== -->
    <div id="scene-three">
        <button id="scene-three-back-btn" class="nav-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </button>
        <div id="mindmap-welcome-title" class="welcome-text"></div>
        <div id="mindmap-interact-text" class="welcome-text">Touch to interact</div>
        <div id="mindmap-loading">
            <svg class="morph-dots" viewBox="0 0 24 24" aria-hidden="true">
                <g class="dots-group">
                    <circle class="dot-1" cx="12" cy="12" r="1.8" />
                    <circle class="dot-2" cx="12" cy="12" r="1.8" />
                    <circle class="dot-3" cx="12" cy="12" r="1.8" />
                    <circle class="dot-4" cx="12" cy="12" r="1.8" />
                    <circle class="dot-5" cx="12" cy="12" r="1.8" />
                </g>
            </svg>
            <div class="loading-text">Loading</div>

   0. SMALL MATH HELPERS
   ========================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a * (1 - t) + b * t;
const smoothstep = (min, max, value) => {
    const x = clamp((value - min) / (max - min), 0, 1);
    return x * x * (3 - 2 * x);
};

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Capability flag. This is a *device* decision, not a *layout* decision, so it
   is deliberately separate from viewport width. It never changes at runtime. */
const LOW_POWER = (() => {
    const mem = navigator.deviceMemory;
    const cores = navigator.hardwareConcurrency;
    if (typeof mem === 'number' && mem <= 4) return true;
    if (typeof cores === 'number' && cores <= 4) return true;
    return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
})();

/* ==========================================================================
   1. VIEWPORT — THE SINGLE SOURCE OF TRUTH
   --------------------------------------------------------------------------
   This is the ONLY place in the application that reads window.innerWidth,
   window.innerHeight or window.visualViewport. Everything downstream — CSS
   custom properties, renderer sizes, camera fits, layout mode, breakpoints —
   is derived from these values.

   Changes are coalesced into a single rAF-batched notification so that no
   subscriber ever sees a half-updated viewport, and so CSS and WebGL are
   never sized from two different height values.
   ========================================================================== */
const Viewport = (() => {
    const subscribers = new Set();
    let pending = false;

    const state = {
        width: 0,
        height: 0,
        dpr: 1,
        aspect: 1,
        /* t = 0 for a tall portrait phone, 1 for a wide landscape desktop.
           Every former mobile/desktop branch is now a mix() on this value,
           which is why there are no discontinuities at a breakpoint. */
        t: 0,
        columns: 3,
        compact: false,
        orientation: 'landscape'
    };

    function read() {
        const vv = window.visualViewport;
        /* visualViewport excludes browser chrome and is stable across the
           iOS address-bar collapse, which innerHeight is not. */
        const w = Math.round(vv ? vv.width : window.innerWidth);
        const h = Math.round(vv ? vv.height : window.innerHeight);
        return { w, h };
    }

    /* Column count is derived from how many cards actually fit, not from a
       magic 768. MIN_CARD_PX is the smallest width at which a card is still
       worth looking at; GAP_FACTOR accounts for the gutter between them. */
    const MIN_CARD_PX = 260;
    const GAP_FACTOR = 1.30;

    function recompute() {
        const { w, h } = read();
        const changed = (w !== state.width || h !== state.height || window.devicePixelRatio !== state.dpr);
        if (!changed) return false;

        state.width = w;
        state.height = h;
        state.dpr = window.devicePixelRatio || 1;
        state.aspect = w / h;
        state.orientation = w >= h ? 'landscape' : 'portrait';

        /* Continuous portrait→landscape blend. 0.50 and 1.40 are the aspect
           ratios of a tall phone and a typical laptop; between them every
           dependent value interpolates smoothly. */
        state.t = clamp((state.aspect - 0.50) / (1.40 - 0.50), 0, 1);

        state.columns = clamp(Math.floor(w / (MIN_CARD_PX * GAP_FACTOR)), 1, 3);
        state.compact = state.columns === 1;

        /* CSS reads the SAME numbers the renderers are sized to. */
        const root = document.documentElement;
        root.style.setProperty('--vh', (h / 100) + 'px');
        root.style.setProperty('--vw', (w / 100) + 'px');
        root.classList.toggle('compact', state.compact);

        return true;
    }

    function schedule() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => {
            pending = false;
            if (recompute()) {
                subscribers.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });
            }
        });
    }

    window.addEventListener('resize', schedule, { passive: true });
    window.addEventListener('orientationchange', schedule, { passive: true });
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', schedule, { passive: true });
    }

    recompute();

    return {
        state,
        get width() { return state.width; },
        get height() { return state.height; },
        get aspect() { return state.aspect; },
        get t() { return state.t; },
        get columns() { return state.columns; },
        get compact() { return state.compact; },
        get dpr() { return state.dpr; },
        onChange(fn) { subscribers.add(fn); return () => subscribers.delete(fn); },
        refresh: schedule
    };
})();

const V = Viewport;

/* Render pixel ratio: capped, and capped harder on low-power devices. */

   2. FIT — ONE FUNCTION, USED BY EVERY SCENE
   --------------------------------------------------------------------------
   Given a rectangle in design space and a perspective FOV, return the camera
   distance at which that rectangle fits the viewport with proportional
   padding. Padding is a ratio, never a world constant.
   ========================================================================== */
function fitDistance(designW, designH, fovDeg, padRatio) {
    const halfTan = Math.tan(fovDeg * Math.PI / 360);
    const byWidth = (designW * (1 + padRatio) / 2) / (halfTan * V.aspect);
    const byHeight = (designH * (1 + padRatio) / 2) / halfTan;
    return Math.max(byWidth, byHeight);
}

function visibleSizeAt(distance, fovDeg) {
    const halfTan = Math.tan(fovDeg * Math.PI / 360);
    const h = 2 * halfTan * distance;
    return { w: h * V.aspect, h };
}

   ========================================================================== */

    forceField: 0

    const clock = new THREE.Clock();
    let time = 0;

        const dt = Math.min(clock.getDelta(), 0.1);
        time += dt;
        const h = handlers[Router.scene];
        if (h) h(dt, time);
    }

    return {
        register(scene, fn) { handlers[scene] = fn; },
        start() { tick(); },
        get time() { return time; }
    };
})();

/* ==========================================================================
   5. MEDIA DIMENSION REGISTRY
   --------------------------------------------------------------------------
   Aspect ratios are resolved BEFORE layout. Anything still unresolved falls
   back to the design box and flips a single batched dirty flag on arrival,
   which removes the old race where carousel targets were computed from
   placeholder dimensions.
   ========================================================================== */
const MediaDims = (() => {
    const map = new Map();
    const listeners = new Set();

    function set(src, w, h) {
        if (!w || !h) return;
        const prev = map.get(src);
        if (prev && prev.w === w && prev.h === h) return;
        map.set(src, { w, h, aspect: w / h });
        listeners.forEach(fn => fn(src));
    }

    return {
        get: (src) => map.get(src) || null,
        set,
        has: (src) => map.has(src),
        onResolve(fn) { listeners.add(fn); },
        resolveImage(src) {
            if (map.has(src)) return;
            const img = new Image();
            img.decoding = 'async';
            img.onload = () => set(src, img.naturalWidth, img.naturalHeight);
            img.onerror = () => set(src, 4, 3);
            img.src = src;
        }
    };
})();

/* Idle-time prefetch of image dimensions, project by project, so the first
   layout of any project is already correct. Videos resolve on metadata load. */
const requestIdle = window.requestIdleCallback || (cb => setTimeout(cb, 1));
(function prefetchDimensions() {
    const queue = [];
    allProjectsData.forEach(p => {
        buildMediaData(p).forEach(cl => {
            cl.assets.forEach(a => { if (a.type === 'img') queue.push(a.src); });
        });
    });
    let i = 0;
    function step() {
        let n = 0;
        while (n < 4 && i < queue.length) { MediaDims.resolveImage(queue[i++]); n++; }
        if (i < queue.length) requestIdle(step);
    }
    requestIdle(step);
})();

/* ==========================================================================

   No WebGL context, no Three.js objects, no raycaster. A ~30-line perspective
   projector does the same maths, and because positions AND sizes both come
   out of scaleAt(z), there is exactly one path from world space to screen
   space instead of the two that used to disagree.
   ========================================================================== */
const S2 = (() => {
    const FOV = 45;
    const HALF_TAN = Math.tan(FOV * Math.PI / 360);

    /* Design-space constants. Ratios, not tuned pixel values. */
    const CARD_W = 5.94;
    const CARD_H = 4.32;
    const CARD_RADIUS = 0.4;
    const GAP_X_RATIO = 1.30;   // × CARD_W
    const GAP_Y_RATIO = 1.65;   // × CARD_H
    const TITLE_OFFSET = 3.6;
    /* Camera padding as a ratio. A card ends up occupying 1/(1+pad) of the
       constraining dimension, so these are directly readable as fill targets:
       0.15 -> 87% (desktop, matches the original 1.15 padding exactly)
       0.28 -> 78% (single column). The old build effectively gave 63% here
       because scale was applied twice; 78% is the deliberate value. Raise
       this number to shrink the cards, lower it to grow them. */
    const GRID_PAD = 0.15;
    const GRID_PAD_COMPACT = 0.28;

    const STATE = { CLUSTERED: 1, OPENING: 2, CAROUSEL: 3, CLOSING: 4 };

    const dom = {
        root: document.getElementById('scene-two'),
        layer: document.getElementById('dom-layer'),
        scroller: document.getElementById('native-scroll-container'),
        scrollContent: document.getElementById('native-scroll-content'),
        blocker: document.getElementById('click-blocker'),
        info: document.getElementById('collection-info'),
        infoTitle: document.getElementById('info-title'),
        infoDesc: document.getElementById('info-desc'),
        closeBtn: document.getElementById('close-btn'),
        backBtn: document.getElementById('scene-two-back-btn')
    };

    const cache = {};            // projectIndex -> { clusters, mediaData, cardScale }
    let clusters = [];
    let mediaData = [];
    let activeProject = -1;

    const cam = { z: 20, y: 0 };
    let focal = 1;               // px per world unit at distance 1
    let baseScale = 1;           // px per world unit at z = 0
    let initialCamY = 0;
    let maxScrollPx = 0;

    let state = STATE.CLUSTERED;
    let activeCluster = -1;
    let openProgress = 0;
    let arrival = 0;
    let carouselPos = 0;
    let carouselTarget = 0;
    let carouselScale = 1;
    let carouselZ = 0;
    let layoutDirty = true;
    let dirtyFrames = 0;

    /* ---------- projector ---------- */
    const scaleAt = (z) => focal / (cam.z - z);
    const screenX = (x, z) => V.width / 2 + x * scaleAt(z);
    const screenY = (y, z) => V.height / 2 - (y - cam.y) * scaleAt(z);
    const worldXAtPx = (px, z) => (px - V.width / 2) / scaleAt(z);
    const worldYAtPx = (py, z) => cam.y + (V.height / 2 - py) / scaleAt(z);

    /* ---------- construction (lazy, per project) ---------- */
    function buildProject(index) {
        if (cache[index]) return cache[index];

        const project = allProjectsData[index];
        const md = buildMediaData(project);
        const cardScale = project.cardScale || 1.0;
        const built = [];

        md.forEach((clusterData) => {
            const cards = clusterData.assets.map((media, j) => {
                const el = document.createElement('div');
                el.className = 'dom-card';
                el.style.display = 'none';

                let mediaEl;
                if (media.type === 'video') {
                    mediaEl = document.createElement('video');
                    mediaEl.loop = true;
                    mediaEl.muted = true;
                    mediaEl.playsInline = true;
                    mediaEl.setAttribute('playsinline', '');
                    /* preload metadata only. Full buffering and playback are
                       started by activate() for the visible project alone. */
                    mediaEl.preload = 'metadata';
                    mediaEl.src = media.src;
                    mediaEl.addEventListener('loadedmetadata', function () {
                        MediaDims.set(media.src, this.videoWidth, this.videoHeight);
                    });
                } else {
                    mediaEl = document.createElement('img');
                    mediaEl.loading = 'lazy';
                    mediaEl.decoding = 'async';
                    mediaEl.alt = '';
                    mediaEl.src = media.src;
                    mediaEl.addEventListener('load', function () {
                        MediaDims.set(media.src, this.naturalWidth, this.naturalHeight);
                    });
                }

                el.appendChild(mediaEl);
                dom.layer.appendChild(el);

                let baseRotZ = 0;
                const n = clusterData.assets.length;
                if (n >= 3) {
                    if (j === 0) baseRotZ = 14 * Math.PI / 180;
                    else if (j === 1) baseRotZ = -14 * Math.PI / 180;
                } else if (n === 2 && j === 0) {
                    baseRotZ = 10 * Math.PI / 180;
                }

                return {
                    el, mediaEl,
                    src: media.src,
                    isVideo: media.type === 'video',
                    index: j,
                    baseRotZ,
                    wWorld: CARD_W * cardScale,
                    hWorld: CARD_H * cardScale,
                    cx: 0, cy: 0,           // carousel target, camera-relative
                    lastTransform: '',
                    lastOpacity: -1,
                    lastVisibility: '',
                    lastZ: -1,
                    lastW: -1, lastH: -1
                };
            });

            const titleEl = document.createElement('div');
            titleEl.className = 'cluster-title';
            titleEl.textContent = clusterData.title;
            titleEl.style.display = 'none';
            dom.layer.appendChild(titleEl);

            built.push({
                cards,
                titleEl,
                home: { x: 0, y: 0 },
                titleOpacity: 1,
                maxScroll: 0,
                lastTitleTransform: '',
                lastTitleOpacity: -1
            });
        });

        cache[index] = { clusters: built, mediaData: md, cardScale };
        return cache[index];
    }

    /* ---------- card world size from resolved aspect ---------- */
    function sizeCard(card, cardScale) {
        const boxW = CARD_W * cardScale;
        const boxH = CARD_H * cardScale;
        const dims = MediaDims.get(card.src);
        if (!dims) { card.wWorld = boxW; card.hWorld = boxH; return; }
        const boxAspect = boxW / boxH;
        if (dims.aspect < boxAspect) {
            card.hWorld = boxH;
            card.wWorld = boxH * dims.aspect;
        } else {
            card.wWorld = boxW;
            card.hWorld = boxW / dims.aspect;
        }
    }

    /* ---------- grid layout ---------- */
    function layoutGrid() {
        const cols = V.columns;
        const gapX = CARD_W * GAP_X_RATIO;
        const gapY = CARD_H * GAP_Y_RATIO;
        const titleOffset = V.compact ? TITLE_OFFSET * 0.75 : TITLE_OFFSET;
        const rows = Math.ceil(clusters.length / cols) || 1;

        /* Frame the camera should fit: full column width, and a couple of rows
           vertically. Both derived, both continuous. */
        const frameRows = cols === 1 ? 1 : 2;
        const frameW = (cols - 1) * gapX + CARD_W;
        const frameH = (frameRows - 1) * gapY + CARD_H + titleOffset;
        const pad = V.compact ? GRID_PAD_COMPACT : GRID_PAD;

        cam.z = fitDistance(frameW, frameH, FOV, pad);
        focal = (V.height / 2) / HALF_TAN;
        baseScale = scaleAt(0);

        const visible = visibleSizeAt(cam.z, FOV);
        const startX = -((cols - 1) * gapX) / 2;

        const cardScale = cache[activeProject] ? cache[activeProject].cardScale : 1;
        clusters.forEach((c, i) => {
            c.cards.forEach(card => sizeCard(card, cardScale));
            c.home.x = startX + (i % cols) * gapX;
            c.home.y = -Math.floor(i / cols) * gapY;
        });

        /* Content extent in world units. */
        const contentTop = CARD_H / 2;
        const contentBottom = -(rows - 1) * gapY - CARD_H / 2 - titleOffset;
        const contentH = contentTop - contentBottom;
        const padY = visible.h * 0.10;

        if (contentH + padY * 2 <= visible.h) {
            /* Fits: centre it. No headroom asymmetry possible. */
            initialCamY = (contentTop + contentBottom) / 2;
            maxScrollPx = 0;
        } else {
            /* Scrolls: anchor the top edge exactly padY below the viewport top,
               every time, on every viewport, in every direction. */
            initialCamY = contentTop + padY - visible.h / 2;
            maxScrollPx = (contentH + padY * 2 - visible.h) * baseScale;
        }

        dom.scrollContent.style.height = (V.height + maxScrollPx) + 'px';
        applyScroll(dom.scroller.scrollTop);
    }

    function applyScroll(px) {
        const clamped = clamp(px, 0, maxScrollPx);
        cam.y = initialCamY - clamped / baseScale;
    }

    /* ---------- carousel layout (measured, per cluster) ---------- */
    function layoutCarousel(clusterIndex) {
        const c = clusters[clusterIndex];
        if (!c) return;

        /* Measured, not guessed. The info panel's real rendered box decides
           where the cards may start, so wrapped text can never overlap them. */
        const infoRect = dom.info.getBoundingClientRect();
        const gap = V.height * 0.035;
        const safeTop = Math.max(infoRect.bottom + gap, V.height * 0.12);
        const padSide = V.width * 0.06;
        const padBottom = V.height * 0.08;

        const cardScale = cache[activeProject] ? cache[activeProject].cardScale : 1;
        c.cards.forEach(card => sizeCard(card, cardScale));

        let targetScale;
        if (V.compact) {
            /* Vertical carousel: width is the constraint, height scrolls. */
            targetScale = (V.width - padSide * 2) / (CARD_W * cardScale);
        } else {
            /* Horizontal carousel: height is the constraint, width scrolls —
               but a single card must still never be wider than the viewport,
               which is reachable in a tall two-column window. */
            targetScale = Math.min(
                (V.height - safeTop - padBottom) / (CARD_H * cardScale),
                (V.width - padSide * 2) / (CARD_W * cardScale)
            );
        }

        /* Keep the cards a safe distance in front of the camera. */
        const minDistance = cam.z * 0.22;
        targetScale = Math.min(targetScale, focal / minDistance);
        carouselScale = targetScale;
        carouselZ = cam.z - focal / targetScale;

        const gapPx = V.compact ? V.height * 0.014 : V.width * 0.018;
        let overflowPx = 0;

        if (V.compact) {
            let cursor = safeTop;
            c.cards.forEach(card => {
                const hpx = card.hWorld * targetScale;
                card.cx = 0;
                card.cy = worldYAtPx(cursor + hpx / 2, carouselZ) - cam.y;
                cursor += hpx + gapPx;
            });
            cursor -= gapPx;
            overflowPx = Math.max(0, cursor + padBottom - V.height);
        } else {
            const bandCenter = (safeTop + (V.height - padBottom)) / 2;
            const cyWorld = worldYAtPx(bandCenter, carouselZ) - cam.y;
            let cursor = padSide;
            c.cards.forEach(card => {
                const wpx = card.wWorld * targetScale;
                card.cx = worldXAtPx(cursor + wpx / 2, carouselZ);
                card.cy = cyWorld;
                cursor += wpx + gapPx;
            });
            cursor -= gapPx;
            overflowPx = Math.max(0, cursor + padSide - V.width);
        }

        c.maxScroll = overflowPx / targetScale;
        carouselTarget = clamp(carouselTarget, 0, c.maxScroll);
        carouselPos = clamp(carouselPos, 0, c.maxScroll);
    }

    function relayout() {
        if (!clusters.length) return;
        layoutGrid();
        if (activeCluster !== -1) layoutCarousel(activeCluster);
        dirtyFrames = 3;
    }

    /* ---------- project activation / deactivation ---------- */
    function deactivateCurrent() {
        if (activeProject === -1 || !cache[activeProject]) return;
        cache[activeProject].clusters.forEach(c => {
            c.cards.forEach(card => {
                card.el.style.display = 'none';
                if (card.isVideo) {
                    card.mediaEl.pause();
                    card.mediaEl.preload = 'metadata';
                }
            });
            c.titleEl.style.display = 'none';
        });
    }

    function load(index) {
        if (activeCluster !== -1) close(true);
        deactivateCurrent();

        const rec = buildProject(index);
        activeProject = index;
        clusters = rec.clusters;
        mediaData = rec.mediaData;

        clusters.forEach(c => {
            c.cards.forEach(card => {
                card.el.style.display = 'flex';
                card.lastTransform = '';
                card.lastOpacity = -1;
                card.lastVisibility = '';
                card.lastW = -1;
                if (card.isVideo) {
                    card.mediaEl.preload = 'auto';
                    const p = card.mediaEl.play();
                    if (p && p.catch) p.catch(() => {});
                }
            });
            c.titleEl.style.display = 'block';
        });

        dom.scroller.style.display = 'block';
        dom.scroller.style.overflowY = 'auto';
        dom.scroller.scrollTop = 0;

        state = STATE.CLUSTERED;
        activeCluster = -1;
        openProgress = 0;
        carouselPos = carouselTarget = 0;

        relayout();

        arrival = 0;
        if (REDUCED_MOTION) {
            arrival = 1;
        } else {
            gsap.to({ v: 0 }, {
                v: 1, duration: 1.44, ease: 'power3.out',
                onUpdate: function () { arrival = this.targets()[0].v; dirtyFrames = 2; }
            });
        }
        dirtyFrames = 4;
    }

    function unload() {
        deactivateCurrent();
        dom.scroller.style.display = 'none';
    }

    /* ---------- open / close ---------- */
    function open(index) {
        if (activeCluster !== -1) return;
        activeCluster = index;

        const data = mediaData[index];
        dom.infoTitle.textContent = data.title;
        dom.infoDesc.innerHTML = data.description;

        /* Force a synchronous layout read so the measured safe area reflects
           THIS cluster's description before the carousel geometry is built. */
        void dom.info.offsetHeight;

        carouselPos = carouselTarget = 0;
        layoutCarousel(index);

        /* The camera does not move. Carousel targets are stored relative to
           cam.y, so the grid scroll position is untouched by opening a
           cluster and is therefore restored exactly, for free, on close.
           This is what removes the phantom headroom on return. */
        dom.scroller.style.overflowY = 'hidden';
        dom.blocker.classList.add('active');
        dom.info.classList.add('active');
        dom.closeBtn.classList.add('active');
        dom.backBtn.classList.remove('active');

        state = STATE.OPENING;
        openProgress = 0;
        const dur = REDUCED_MOTION ? 0 : (V.compact ? 0.8924 : 1.0476);
        gsap.to({ v: 0 }, {
            v: 1, duration: dur, ease: 'power4.inOut',
            onUpdate: function () { openProgress = this.targets()[0].v; },
            onComplete: () => { state = STATE.CAROUSEL; }
        });
    }

    function close(instant = false) {
        if (activeCluster === -1) return;

        dom.closeBtn.classList.remove('active');
        dom.backBtn.classList.add('active');
        dom.scroller.style.overflowY = 'auto';
        state = STATE.CLOSING;

        const tl = gsap.timeline({
            defaults: { ease: 'power2.inOut' },
            onComplete: () => {
                state = STATE.CLUSTERED;
                activeCluster = -1;
                carouselPos = carouselTarget = 0;
                dirtyFrames = 3;
            }
        });

        if (!instant && !REDUCED_MOTION && carouselPos > 0.01) {
            const proxy = { v: carouselPos };
            tl.to(proxy, {
                v: 0, duration: V.compact ? 0.63 : 0.9,
                onUpdate: () => { carouselPos = carouselTarget = proxy.v; }
            });
        } else {
            carouselPos = carouselTarget = 0;
        }

        tl.call(() => {
            dom.info.classList.remove('active');
            dom.blocker.classList.remove('active');
        });

        const proxy2 = { v: openProgress };
        tl.to(proxy2, {
            v: 0,
            duration: (instant || REDUCED_MOTION) ? 0 : (V.compact ? 1.1808 : 1.496),
            ease: 'power2.out',
            onUpdate: () => { openProgress = proxy2.v; }
        }, (instant || REDUCED_MOTION) ? 0 : '+=0.09');
    }

    function applyCarouselDelta(deltaPx) {
        if (!isFinite(deltaPx) || activeCluster === -1) return;
        const c = clusters[activeCluster];
        const speed = V.compact ? 2.0 : 1.2;
        carouselTarget = clamp(carouselTarget + (deltaPx / carouselScale) * speed, 0, c.maxScroll);
    }

    /* ---------- hit testing (screen-space rect, no raycaster) ---------- */
    function hitTest(px, py) {
        for (let i = 0; i < clusters.length; i++) {
            const c = clusters[i];
            const cx = screenX(c.home.x, 0);
            const cy = screenY(c.home.y, 0);
            const hw = (CARD_W * 1.5 * baseScale) / 2;
            const hh = (CARD_H * 1.5 * baseScale) / 2;
            if (px >= cx - hw && px <= cx + hw && py >= cy - hh && py <= cy + hh) return i;
        }
        return -1;
    }

    /* ---------- frame ---------- */
    const FIXED_STAGGER = 0.24;

    function frame() {
        if (layoutDirty) { layoutDirty = false; relayout(); }

        if (state === STATE.CAROUSEL) {
            const prev = carouselPos;
            carouselPos += (carouselTarget - carouselPos) * 0.10;
            if (Math.abs(carouselPos - prev) > 0.0005) dirtyFrames = 2;
        }

        const moving = state !== STATE.CLUSTERED || arrival < 1 || dirtyFrames > 0;
        if (!moving) return;
        if (dirtyFrames > 0) dirtyFrames--;

        /* Info panel tracks the carousel scroll so caption and cards move as
           one object. */
        if (state === STATE.CAROUSEL || state === STATE.CLOSING) {
            const off = -carouselPos * carouselScale;
            dom.info.style.transform = V.compact
                ? `translate3d(-50%, ${off}px, 0)`
                : `translate3d(${off}px, 0, 0)`;
        } else {
            dom.info.style.transform = V.compact ? 'translate3d(-50%, 0, 0)' : 'translate3d(0, 0, 0)';
        }

        const titleOffset = V.compact ? TITLE_OFFSET * 0.75 : TITLE_OFFSET;
        const pushZ = -cam.z * 0.25;

        for (let i = 0; i < clusters.length; i++) {
            const c = clusters[i];
            const isActive = i === activeCluster;

            const titleOpacity = state === STATE.CLUSTERED ? 1 : (1 - openProgress);
            if (titleOpacity !== c.lastTitleOpacity) {
                c.titleEl.style.opacity = titleOpacity;
                c.lastTitleOpacity = titleOpacity;
            }
            const tx = screenX(c.home.x, 0);
            const ty = screenY(c.home.y - titleOffset, 0);
            if (isFinite(tx) && isFinite(ty)) {
                const t = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) translate(-50%, -50%)`;
                if (t !== c.lastTitleTransform) { c.titleEl.style.transform = t; c.lastTitleTransform = t; }
            }

            const n = c.cards.length;
            const durationMul = 1 + FIXED_STAGGER;
            const stagger = n > 1 ? FIXED_STAGGER / (n - 1) : 0;

            for (let j = 0; j < n; j++) {
                const card = c.cards[j];
                const startX = c.home.x;
                const startY = c.home.y;
                const startZ = -j * 0.1;

                let x, y, z, rot, opacity, extraScale = 1;

                if (state === STATE.CLUSTERED) {
                    const clusterStagger = i * 0.08;
                    const dur = 1 + clusters.length * 0.08;
                    const ap = clamp(arrival * dur - clusterStagger, 0, 1);
                    const ease = 1 - Math.pow(1 - ap, 3);
                    extraScale = 0.85 + 0.15 * ease;
                    x = startX; y = startY; z = startZ; rot = card.baseRotZ;
                    opacity = (j < 3 ? 1 : 0) * ease;
                } else {
                    const p = clamp(openProgress * durationMul - j * stagger, 0, 1);
                    const arc = Math.sin(p * Math.PI) * Math.min(2.0, cam.z * 0.12);

                    if (isActive) {
                        const endX = V.compact ? card.cx : card.cx - carouselPos;
                        const endY = V.compact ? (cam.y + card.cy + carouselPos) : (cam.y + card.cy);
                        x = startX + (endX - startX) * p;
                        y = startY + (endY - startY) * p;
                        z = startZ + (carouselZ - startZ) * p + arc;
                        rot = card.baseRotZ * (1 - p);
                        opacity = j < 3 ? 1 : p;
                    } else {
                        const dx = c.home.x;
                        const dy = c.home.y - cam.y;
                        const endX = c.home.x + dx * 0.8;
                        const endY = c.home.y + dy * 0.8;
                        x = startX + (endX - startX) * p;
                        y = startY + (endY - startY) * p;
                        z = startZ + (pushZ - startZ) * p;
                        rot = card.baseRotZ;
                        opacity = (j < 3 ? 1 : 0) * (1 - p);
                    }
                }

                if (opacity !== card.lastOpacity) { card.el.style.opacity = opacity; card.lastOpacity = opacity; }
                const vis = opacity < 0.005 ? 'hidden' : 'visible';
                if (vis !== card.lastVisibility) { card.el.style.visibility = vis; card.lastVisibility = vis; }
                if (vis === 'hidden') continue;

                /* Element box is sized once per layout at z = 0; per-frame depth
                   is a CSS scale, so there is no layout thrash. */
                const wpx = Math.round(card.wWorld * baseScale);
                const hpx = Math.round(card.hWorld * baseScale);
                if (wpx !== card.lastW || hpx !== card.lastH) {
                    card.el.style.width = wpx + 'px';
                    card.el.style.height = hpx + 'px';
                    card.el.style.borderRadius = (CARD_RADIUS * baseScale).toFixed(1) + 'px';
                    card.lastW = wpx; card.lastH = hpx;
                }

                const s = scaleAt(z) / baseScale;
                const sx = screenX(x, z);
                const sy = screenY(y, z);
                if (!isFinite(sx) || !isFinite(sy) || !isFinite(s)) continue;

                const transform =
                    `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0) translate(-50%, -50%) ` +
                    `scale(${(s * extraScale).toFixed(4)}) rotateZ(${(-rot).toFixed(4)}rad)`;
                if (transform !== card.lastTransform) {
                    card.el.style.transform = transform;
                    card.lastTransform = transform;
                }

                const zi = (isActive ? 2000 : 500) + i * 100 + (n - j);
                if (zi !== card.lastZ) { card.el.style.zIndex = zi; card.lastZ = zi; }
            }
        }
    }

    /* ---------- events ---------- */
    /* Native scroll is the ONLY authority for the grid. The old wheel handler
       that wrote back into scrollTop (and re-triggered this listener) is gone. */
    dom.scroller.addEventListener('scroll', () => {
        if (Router.scene !== 2 || activeCluster !== -1) return;
        applyScroll(dom.scroller.scrollTop);
        dirtyFrames = 2;
    }, { passive: true });

    dom.scroller.addEventListener('click', (e) => {
        if (Router.scene !== 2 || activeCluster !== -1) return;
        const hit = hitTest(e.clientX, e.clientY);
        if (hit !== -1) open(hit);
    });

    dom.closeBtn.addEventListener('click', () => close());
    dom.closeBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); close(); }
    });

    MediaDims.onResolve(() => { if (activeProject !== -1) layoutDirty = true; });
    V.onChange(() => { if (activeProject !== -1) layoutDirty = true; });

    Loop.register(2, frame);

    return {
        load, unload, close,
        applyCarouselDelta,
        get activeCluster() { return activeCluster; },
        markDirty() { layoutDirty = true; }
    };
})();

   7. SCENE 1 — WEBGL LANDING

const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: !LOW_POWER, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(renderPixelRatio());
renderer.setSize(V.width, V.height, false);
renderer.domElement.style.width = '100%';
renderer.domElement.style.height = '100%';
renderer.shadowMap.enabled = false;   // nothing in the scene receives shadows
renderer.autoClear = false;
renderer.setClearColor('#CCCCCC', 1);
container.appendChild(renderer.domElement);

/* ---- orb ---- */
const ORB_FOV = 45;
const ORB_CAM_Z = 3.8;
const orbScene = new THREE.Scene();
const orbCam = new THREE.PerspectiveCamera(ORB_FOV, V.aspect, 0.1, 1000);
orbCam.position.set(0, 0, ORB_CAM_Z);

const dynamicVertexStage = `
    uniform float uTimeline; uniform float uShellRadius; uniform float uMirrorProgress;
    uniform float uBurnProgress; uniform float uClearProgress; uniform float uAspect;
    uniform float uForceField; uniform float uBreathIntensity; uniform float uParticleSize;
    attribute float pRandomPhase; attribute float aType; attribute vec3 aDrift; attribute float aColorType;
    varying float vGlowIntensity; varying float vAlpha; varying float vType; varying float vColorType; varying float vColorMix;
    float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float noise(vec3 x) {
        vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) { float f = 0.0; f += 0.5000 * noise(p); p = p * 2.02; f += 0.2500 * noise(p); p = p * 2.03; f += 0.1250 * noise(p); p = p * 2.01; f += 0.0625 * noise(p); return f; }
    void main() {
        vType = aType; vColorType = aColorType;
        vec3 surfaceNormal = normalize(position);
        float constantBreath = sin(uTimeline * 1.5) * uBreathIntensity;
        float breathOutExpansion = smoothstep(0.0, 0.6, uBurnProgress) * 0.10;
        float burnScale = 1.0 + breathOutExpansion;
        float currentGrowthFactor = 1.0 + (uMirrorProgress * 0.24) + constantBreath;
        float dynamicRadius = uShellRadius * currentGrowthFactor * burnScale;
        float strictAmplitudeCeiling = dynamicRadius * 0.05; float structuralFrequency = 1.4;
        float asymmetryMap = sin(surfaceNormal.x * structuralFrequency + uTimeline * 0.3) * cos(surfaceNormal.y * structuralFrequency);
        float currentIrregularity = asymmetryMap * strictAmplitudeCeiling * uMirrorProgress;
        vec3 baselinePosition = surfaceNormal * (dynamicRadius + currentIrregularity);

        baselinePosition += vec3(sin(uTimeline * 1.32 + pRandomPhase * 6.28) * 0.016, cos(uTimeline * 1.54 + pRandomPhase * 6.28) * 0.016, sin(uTimeline * 0.99 + pRandomPhase * 3.14) * 0.016);
        float rawNoise = fbm(surfaceNormal * 3.5 + uTimeline * 0.1);
        float burnMask = smoothstep(0.3, 0.7, rawNoise);
        float sweep = uBurnProgress * 2.0;
        float timeSinceIgnition = max(0.0, sweep - burnMask);
        vAlpha = 1.0; vColorMix = 0.0; vGlowIntensity = 0.0;

        if (timeSinceIgnition > 0.0) {
            vColorMix = smoothstep(0.0, 0.4, timeSinceIgnition);
            float lingerFactor = pRandomPhase * 0.3;
            vec3 driftOffset = aDrift * ((1.0 - exp(-timeSinceIgnition * 4.0)) * 1.2 + timeSinceIgnition * 0.8) * 2.24;
            driftOffset.x += sin(uTimeline * 0.5 + pRandomPhase * 10.0) * timeSinceIgnition * 0.1;
            driftOffset.y += cos(uTimeline * 0.4 + pRandomPhase * 10.0) * timeSinceIgnition * 0.1;
            driftOffset.z += sin(uTimeline * 0.45 + pRandomPhase * 10.0) * timeSinceIgnition * 0.1;
            baselinePosition += driftOffset;

            if (aType > 0.5) {
                float peripheryBlend = smoothstep(0.2, 1.5, timeSinceIgnition);
                vec2 outwardDir = normalize(surfaceNormal.xy + vec2(0.001));
                float pushRandom = 1.0 + pRandomPhase * 1.0;
                vec2 targetXY = outwardDir * vec2(uAspect * 1.62, 1.62) * pushRandom;
                targetXY *= (1.0 + uClearProgress * 1.344);
                targetXY *= 0.4;
                targetXY.x += sin(uTimeline * 0.15 + pRandomPhase * 20.0) * 0.4;
                targetXY.y += cos(uTimeline * 0.18 + pRandomPhase * 20.0) * 0.4;
                float zDrift = sin(uTimeline * 0.2 + pRandomPhase * 15.0) * 0.5;
                vec3 peripheryPos = vec3(targetXY, surfaceNormal.z * 0.5 - 0.5 + zDrift);
                baselinePosition = mix(baselinePosition, peripheryPos, peripheryBlend);
                vAlpha = 1.0; vGlowIntensity = smoothstep(0.0, 0.5, timeSinceIgnition) * 0.8;
            } else {
                vAlpha = 1.0 - smoothstep(0.1 + lingerFactor, 0.8 + lingerFactor, timeSinceIgnition);
                vGlowIntensity = smoothstep(0.0, 0.2, timeSinceIgnition) * (1.0 - smoothstep(0.2, 0.8, timeSinceIgnition));
            }
        }

        vec3 pushDir = normalize(surfaceNormal);
        vec3 forceDir;
        if (aColorType < 0.30) {
            vec3 camPos = vec3(0.0, 0.0, ${ORB_CAM_Z.toFixed(1)});
            vec3 toCam = normalize(camPos - baselinePosition);
            forceDir = normalize(mix(pushDir, toCam, 0.85));
        } else {
            vec2 dirXY = normalize(pushDir.xy) * 0.9;
            float dirZ = 0.1;
            forceDir = normalize(vec3(dirXY, dirZ));
        }

        float forceMagnitude = uForceField * 1.5;
        vec3 displacement = forceDir * forceMagnitude;

        float targetZ = baselinePosition.z + displacement.z;
        float maxZ = 2.8;
        if (targetZ > maxZ) {
            float excess = targetZ - maxZ;
            targetZ = maxZ + (1.0 - exp(-excess * 2.0));
            displacement.z = targetZ - baselinePosition.z;
        }

        baselinePosition += displacement;

        vec4 viewSpacePosition = modelViewMatrix * vec4(baselinePosition, 1.0);
        gl_Position = projectionMatrix * viewSpacePosition;
        float anchorSize = uParticleSize;
        if (aType < 0.5) { anchorSize *= vAlpha; } else { anchorSize *= mix(1.0, 1.3, smoothstep(0.0, 1.0, timeSinceIgnition)); }
        gl_PointSize = anchorSize / -viewSpacePosition.z;
    }
`;

const dynamicFragmentStage = `
    uniform float uClearProgress; uniform float uBurnProgress; uniform float uTimeline; uniform float uGlobalAlpha;
    varying float vGlowIntensity; varying float vAlpha; varying float vType; varying float vColorType; varying float vColorMix;
    void main() {
        vec2 particleCoord = gl_PointCoord - vec2(0.5);
        if(length(particleCoord) > 0.5) discard;
        vec3 colorA = vec3(0.627, 0.627, 0.627); vec3 colorB = vec3(0.784, 0.784, 0.784);
        vec3 colorC = vec3(0.910, 0.910, 0.910); vec3 colorD = vec3(1.000, 1.000, 1.000);
        float p = clamp((uBurnProgress - vColorType * 0.4) / 0.6, 0.0, 1.0);
        vec3 particleColor;
        if (p < 0.333) { particleColor = mix(colorA, colorB, p * 3.0); }
        else if (p < 0.666) { particleColor = mix(colorB, colorC, (p - 0.333) * 3.0); }
        else { particleColor = mix(colorC, colorD, (p - 0.666) * 3.0); }
        vec3 finalShadingColor = particleColor;
        float pulse = 1.0 + sin(uTimeline * 4.0 + vColorType * 15.0) * 0.4;
        if (vColorMix > 0.01) { finalShadingColor += particleColor * (vGlowIntensity * pulse); }
        float fadeOut = (vType > 0.5) ? mix(1.0, 0.5, uClearProgress) : 1.0;
        float softEdgeAlpha = smoothstep(0.5, 0.33, length(particleCoord)) * 0.95 * vAlpha * fadeOut * uGlobalAlpha;
        if (softEdgeAlpha < 0.01) discard;
        gl_FragColor = vec4(finalShadingColor, softEdgeAlpha);
    }
`;

const totalParticles = LOW_POWER ? 2295 : 3060;
const structuralGeometry = new THREE.BufferGeometry();
{
    const spatialCoords = new Float32Array(totalParticles * 3);
    const randomPhases = new Float32Array(totalParticles);
    const types = new Float32Array(totalParticles);
    const drifts = new Float32Array(totalParticles * 3);
    const colorTypes = new Float32Array(totalParticles);

    const indices = Array.from({ length: totalParticles }, (_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    for (let i = 0; i < totalParticles; i++) {
        const idx = indices[i];
        const phi = Math.acos(-1 + (2 * idx) / totalParticles);
        const theta = Math.sqrt(totalParticles * Math.PI) * phi;
        spatialCoords[idx * 3] = Math.cos(theta) * Math.sin(phi);
        spatialCoords[idx * 3 + 1] = Math.sin(theta) * Math.sin(phi);
        spatialCoords[idx * 3 + 2] = Math.cos(phi);
        randomPhases[idx] = Math.random();
        colorTypes[idx] = Math.random();
        types[idx] = i < 350 ? 1.0 : 0.0;
        const u = Math.random(), v = Math.random();
        const thetaD = u * 2 * Math.PI;
        const phiD = Math.acos(2 * v - 1);
        const speed = Math.random() * 0.36 + 0.12;
        drifts[idx * 3] = speed * Math.sin(phiD) * Math.cos(thetaD);
        drifts[idx * 3 + 1] = speed * Math.sin(phiD) * Math.sin(thetaD);
        drifts[idx * 3 + 2] = speed * Math.cos(phiD);
    }

function createRoundedRect(x, y, w, h, rx, ry) {
    const shape = new THREE.Shape();
    shape.moveTo(x + rx, -y); shape.lineTo(x + w - rx, -y); shape.quadraticCurveTo(x + w, -y, x + w, -(y + ry));
    shape.lineTo(x + w, -(y + h - ry)); shape.quadraticCurveTo(x + w, -(y + h), x + w - rx, -(y + h));
    shape.lineTo(x + rx, -(y + h)); shape.quadraticCurveTo(x, -(y + h), x, -(y + h - ry));
    shape.lineTo(x, -(y + ry)); shape.quadraticCurveTo(x, -y, x + rx, -y);
    return shape;
}

function parseSVGPath(pathStr) {
    const shape = new THREE.Shape();
    const regex = /([MmLlHhVvCcSsQqTtAaZz])|([-+]?(?:\d*\.\d+|\d+)(?:[eE][-+]?\d+)?)/g;
    const tokens = []; let match;
    while ((match = regex.exec(pathStr)) !== null) {
        if (match[1]) tokens.push(match[1]); else tokens.push(parseFloat(match[2]));
    }
    let i = 0, cx = 0, cy = 0, cmd = '';
    while (i < tokens.length) {
        if (isNaN(parseFloat(tokens[i]))) cmd = tokens[i++];
        switch (cmd) {
            case 'M': cx = tokens[i++]; cy = tokens[i++]; shape.moveTo(cx, -cy); cmd = 'L'; break;
            case 'H': cx = tokens[i++]; shape.lineTo(cx, -cy); break;
            case 'L': cx = tokens[i++]; cy = tokens[i++]; shape.lineTo(cx, -cy); break;
            case 'l': cx += tokens[i++]; cy += tokens[i++]; shape.lineTo(cx, -cy); break;
            case 'c': {
                const dx1 = tokens[i++], dy1 = tokens[i++], dx2 = tokens[i++], dy2 = tokens[i++], dx3 = tokens[i++], dy3 = tokens[i++];
                shape.bezierCurveTo(cx + dx1, -(cy + dy1), cx + dx2, -(cy + dy2), cx + dx3, -(cy + dy3));
                cx += dx3; cy += dy3; break;
            }
            case 'Z': case 'z': shape.closePath(); break;
            default: i++; break;
        }
    }
    return shape;
}

function createGlassMaterial(isFront) {
    const mat = new THREE.MeshPhysicalMaterial({
        color: isFront ? 0xb5b5b5 : 0xcacaca,
        metalness: 0.1,
        roughness: LOW_POWER ? 0.25 : 0.666,
        transmission: 0.65,
        ior: 1.305,
        thickness: isFront ? 10.0 : 15.0,
        transparent: true,
        opacity: isFront ? 0.756 : 0.98,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
    });

    /* The noise "thaw" shader is a capability decision, not a width decision. */
    if (!LOW_POWER) {
        mat.onBeforeCompile = (shader) => {
            shader.vertexShader = `
                attribute float aThaw;
                varying float vThaw;
                varying vec3 vLocalPos;
                ${shader.vertexShader}
            `.replace(`#include <begin_vertex>`, `#include <begin_vertex>\nvLocalPos = position;\nvThaw = aThaw;`);

            shader.fragmentShader = `
                varying float vThaw;
                varying vec3 vLocalPos;
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g; vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z); vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
                    vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw); vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0)); vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                    vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
                    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                }
                ${shader.fragmentShader}
            `.replace(`void main() {`, `void main() {\nfloat noiseVal = snoise(vLocalPos * 0.006) * 0.5 + 0.5;\nfloat thawMask = smoothstep(noiseVal - 0.25, noiseVal + 0.25, vThaw);`)
             .replace(`#include <roughnessmap_fragment>`, `#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.15, thawMask * 0.9);`)
             .replace(`#include <color_fragment>`, `#include <color_fragment>\ndiffuseColor.a = mix(diffuseColor.a, 0.25, thawMask * 0.85);`);
        };
    }
    return mat;
}

function layoutScene1() {
    orbCam.aspect = V.aspect;
    orbCam.updateProjectionMatrix();
    carouselCam.aspect = V.aspect;
    carouselCam.updateProjectionMatrix();

    renderer.setPixelRatio(renderPixelRatio());
    renderer.setSize(V.width, V.height, false);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';

    clusterMaterial.uniforms.uAspect.value = V.aspect;

    /* Orb: one continuous function.
       t = 0 (tall portrait) → the orb is width-constrained and fills ~70%
       t = 1 (landscape)     → the orb is height-constrained and fills ~31%
       Between them it interpolates, so the 2.6× jump that used to happen at
       760/768px no longer exists at any width. */
    const orbView = visibleSizeAt(ORB_CAM_Z, ORB_FOV);
    const constraining = Math.min(orbView.w, orbView.h);
    const fillFraction = mix(0.70, 0.31, V.t);
    Scene1Layout.orbRadius = (fillFraction * constraining) / 2;
    Scene1Layout.particleSize = mix(20.0, 28.98, V.t);
    Scene1Layout.breath = mix(0.037476, 0.0347, V.t);
    Scene1Layout.orbOffsetY = orbView.h * 0.04 * (1 - V.t);

    clusterMaterial.uniforms.uShellRadius.value = Scene1Layout.orbRadius;
    clusterMaterial.uniforms.uParticleSize.value = Scene1Layout.particleSize;
    clusterMaterial.uniforms.uBreathIntensity.value = Scene1Layout.breath;
    orbScene.position.y = Scene1Layout.orbOffsetY;

    /* Folders: same continuous treatment. The folder artwork is ~3000 units
       across in design space; scale it to a fraction of the constraining
       viewport dimension that blends between portrait and landscape. */
    const folderView = visibleSizeAt(FOLDER_CAM_Z, FOLDER_FOV);
    const folderMin = Math.min(folderView.w, folderView.h);
    const folderFill = mix(0.9775, 0.81, V.t);
    const s = (folderMin * folderFill) / 3000;
    carouselGroup.scale.set(s, s, s);

    /* The entrance travel is now proportional to the viewport, not the
       world constant -110. */
    Scene1Layout.entranceY = -folderView.h * 1.66;
    entranceState.targetY = mix(Scene1Layout.entranceY, 0, lastCarouselEntrance);
}

function applyVirtualScroll(deltaY) {
    if (transitionState !== 'IDLE') return;
    const prev = VirtualScroll.raw;
    VirtualScroll.raw = clamp(VirtualScroll.raw + deltaY, 0, VirtualScroll.max);
    let p = VirtualScroll.raw / VirtualScroll.max;

    if (deltaY > 0 && p > 0.40 && (prev / VirtualScroll.max) <= 0.40) {
        VirtualScroll.raw = VirtualScroll.max;
        p = 1.0;
    }
    targetScrollProgress = p;

    if (p > 0.02) {
        scrollText.style.opacity = 0;
        welcomeTitle.style.opacity = 0;
        wasScrolled = true;
        clearTimeout(typeTimeout);
    } else {
        scrollText.style.opacity = 1;
