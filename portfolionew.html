<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Joel Meshak</title>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* ==========================================================================
           VIEWPORT UNITS
           --------------------------------------------------------------------------
           --vh is written by the Viewport module from the SAME height value the
           renderers are sized to. CSS and WebGL therefore agree by construction.

           PHASE 3: --vh/--vw are now updated on EVERY viewport read (including the
           small height changes caused by the mobile URL bar), but the expensive
           WebGL relayout is only notified for MEANINGFUL changes. See Viewport.
           ========================================================================== */
        :root {
            --vh: 1vh;
            --vw: 1vw;
            --app-h: calc(var(--vh) * 100);
            --app-w: calc(var(--vw) * 100);
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #CCCCCC;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: var(--app-w);
            height: var(--app-h);
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================================================
           SCENE WRAPPERS
           ========================================================================== */
        #scene-one, #scene-two, #scene-three {
            position: fixed;
            top: 0; left: 0;
            width: var(--app-w);
            height: var(--app-h);
            transition: opacity 0.8s ease;
        }

        #scene-two, #scene-three {
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* Context-loss fallback. Shown only if a lost context fails to restore
           within RECOVERY_GRACE_MS, so the user never sits in front of a silent
           black canvas with no way forward. */
        #gl-recovery {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            background: #CCCCCC;
            color: #777777;
            font-size: 15px;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        html.gl-unrecoverable #gl-recovery { display: flex; }
        #gl-recovery button {
            font: inherit;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            padding: 10px 26px;
            cursor: pointer;
        }

        /* ==========================================================================
           SCENE 1 (WEBGL LANDING)
           ========================================================================== */
        #webgl-module {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        .nav-btn {
            position: fixed;
            top: 32px; left: 32px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-weight: 500; font-size: 14px; color: #777777;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 13px rgba(0, 0, 0, 0.0214);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            z-index: 200; user-select: none; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
            --x: 50%; --y: 50%;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.35); transform: translateY(-1px); color: #ffffff;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 6px 16px rgba(0, 0, 0, 0.03);
        }
        .nav-btn:active { transform: translateY(0px); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 2px 8px rgba(0, 0, 0, 0.02); }
        .nav-btn:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }

        @media (hover: hover) and (pointer: fine) {
            .nav-btn::after {
                content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
                background: radial-gradient(28px circle at var(--x) var(--y), rgba(255, 255, 255, 0.95), transparent 100%);
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
                opacity: 0; transition: opacity 0.3s ease, border-radius 0.5s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
            }
            .nav-btn:hover::after { opacity: 1; }
        }

        #home-btn { opacity: 0; pointer-events: none; }

        #contact-btn {
            left: auto;
            right: 32px;
            width: 104px;
            height: 42px;
            padding: 0;
            display: block;
            overflow: hidden;
            box-sizing: border-box;
            opacity: 0; pointer-events: none;
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        border-radius 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.5s ease,
                        box-shadow 0.5s ease,
                        backdrop-filter 0.5s ease,
                        -webkit-backdrop-filter 0.5s ease,
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.8s ease;
        }

        #contact-btn.is-open {
            width: 180px;
            height: 204px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.25) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4),
                        inset 0 0 20px rgba(255, 255, 255, 0.08),
                        0 8px 24px rgba(0, 0, 0, 0.03),
                        0 1px 3px rgba(0, 0, 0, 0.01);
            transform: translateY(0) !important;
            cursor: default;
        }

        .contact-label {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 42px;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }
        #contact-btn.is-open .contact-label { opacity: 0; pointer-events: none; }

        .contact-list {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 16px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
        }
        #contact-btn.is-open .contact-list { opacity: 1; pointer-events: auto; }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: background 0.2s ease, transform 0.3s ease, opacity 0.2s ease;
        }
        #contact-btn.is-open .contact-item {
            opacity: 1;
            transform: translateY(0);
            transition: background 0.2s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }
        #contact-btn.is-open .contact-item:nth-child(1) { transition-delay: 0.10s; }
        #contact-btn.is-open .contact-item:nth-child(2) { transition-delay: 0.15s; }
        #contact-btn.is-open .contact-item:nth-child(3) { transition-delay: 0.20s; }
        #contact-btn.is-open .contact-item:nth-child(4) { transition-delay: 0.25s; }
        .contact-item:hover { background: rgba(255, 255, 255, 0.2); }

        .contact-item svg {
            width: 18px; height: 18px;
            stroke: currentColor; fill: none;
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }

        .be-logo {
            font-family: inherit; font-weight: 700; font-size: 16px; letter-spacing: -0.5px;
            display: flex; align-items: center; justify-content: center;
            width: 18px; height: 18px;
        }

        .item-text-wrapper { position: relative; display: flex; align-items: center; flex: 1; }
        .item-text-wrapper span { transition: opacity 0.3s ease, transform 0.3s ease; }
        .item-text-wrapper .copied {
            position: absolute; left: 0; color: #34C759;
            opacity: 0; transform: translateY(4px); font-weight: 500;
        }
        .contact-item.is-copied .original { opacity: 0; transform: translateY(-4px); }
        .contact-item.is-copied .copied { opacity: 1; transform: translateY(0); }

        #scene-two-back-btn, #scene-three-back-btn { opacity: 0; pointer-events: none; }
        #scene-two-back-btn.active, #scene-three-back-btn.active { opacity: 1; pointer-events: auto; }
        #scene-two-back-btn svg, #scene-three-back-btn svg { width: 16px; height: 16px; transition: stroke 0.3s ease; }

        .welcome-text {
            position: fixed;
            top: calc(var(--vh) * 10);
            width: 100%;
            text-align: center;
            color: #FFFFFF;
            z-index: 10;
            font-weight: 400;
            font-size: 1.125rem;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .welcome-text::after {
            content: '|';
            animation: blink 1s step-start infinite;
            margin-left: 4px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .welcome-text.done::after { opacity: 0; }
        @keyframes blink { 50% { opacity: 0; } }

        #mindmap-interact-text {
            top: calc(var(--vh) * 90);
            opacity: 0;
            pointer-events: none;
        }
        #mindmap-interact-text::after { content: none; }
        #mindmap-interact-text.fade-in {
            animation: interactFadeIn 0.8s ease forwards, interactPulse 4s infinite ease-in-out 0.8s;
        }
        #mindmap-interact-text.hidden {
            opacity: 0 !important;
            animation: none !important;
            transition: opacity 0.3s ease;
        }
        @keyframes interactFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes interactPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .scroll-instruction {
            position: fixed; top: calc(var(--vh) * 85); width: 100%; text-align: center; color: #FFFFFF;
            z-index: 10; font-weight: 400; font-size: 1.125rem;
            opacity: 0; transition: opacity 1s ease; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        @keyframes pulseText {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        .scroll-instruction span { animation: pulseText 4s infinite ease-in-out; }

        #labels-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .folder-label {
            position: absolute; top: 0; left: 0;
            font-family: inherit;
            font-size: 16px; font-weight: 400; color: #777777;
            opacity: 0; transition: opacity 0.4s ease, color 0.4s ease;
            text-align: center; white-space: nowrap;
            will-change: transform, opacity;
        }
        .folder-label.focus { opacity: 1; }
        .folder-label.hover { color: #ffffff; }

        /* ==========================================================================
           SCENE 2 (COLLECTIONS) — pure DOM, no canvas
           ========================================================================== */
        #dom-layer {
            display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        #native-scroll-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            z-index: 5;
            display: none;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #native-scroll-container::-webkit-scrollbar { display: none; }
        /* The grid lives INSIDE this element, so the compositor scrolls the
           cards natively. No JS runs during a grid scroll, and (Phase 3) no
           non-passive listener sits between the touch and the scroller. */
        #native-scroll-content { width: 100%; position: relative; }

        #click-blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: none;
            touch-action: none;
        }
        #click-blocker.active { display: block; }

        #collection-info {
            position: absolute; color: #FFFFFF; opacity: 0; pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            top: calc(var(--vh) * 12);
            left: calc(var(--vw) * 6);
            max-width: 340px;
            will-change: transform, opacity;
        }
        #collection-info.active { opacity: 1; }
        #collection-info h2 { font-size: 1.5rem; font-weight: 500; margin: 0 0 12px 0; letter-spacing: 0.01em; }
        #collection-info p { font-size: 0.95rem; line-height: 1.5; margin: 0; opacity: 0.85; }

        #close-btn {
            position: absolute;
            top: calc(var(--vh) * 6);
            right: calc(var(--vw) * 5);
            color: #666666; font-size: 1rem;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease, color 0.3s ease;
            z-index: 200; padding: 15px; margin: -15px; display: flex; align-items: center; justify-content: center;
        }
        #close-btn.active { opacity: 1; pointer-events: auto; }
        #close-btn:hover { color: #FFFFFF; }

        .desktop-text { display: flex; align-items: center; gap: 6px; }
        .desktop-icon { width: 16px; height: 16px; }
        .mobile-icon { display: none; }

        /* Cards are NOT permanently promoted. A permanent `will-change:
           transform` makes the browser rasterize the layer once at its layout
           size and then GPU-magnify it for any later scale().

           PHASE 3: `.animating` is now applied ONLY to the cards of the cluster
           actually being opened — not to every card in every cluster. The other
           clusters are faded as a single composited group via #native-scroll-content,
           which is one layer instead of ~30. */
        .dom-card {
            position: absolute; top: 0; left: 0; transform-origin: center center;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            backface-visibility: hidden;
        }
        .dom-card.animating {
            will-change: transform, opacity;
        }

        .dom-card img, .dom-card video {
            width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none;
            transition: box-shadow 0.4s ease;
        }

        #native-scroll-content.fading { will-change: opacity; }

        .cluster-title {
            position: absolute; top: 0; left: 0; transform-origin: center center;
            color: #FFFFFF; font-size: 0.98rem; text-align: center;
            white-space: nowrap; letter-spacing: 0.01em;
        }

        /* Compact layout: driven by a class the Viewport module sets on <html>,
           not by a hardcoded media query. One breakpoint source, not three. */
        html.compact .welcome-text { top: calc(var(--vh) * 15); }
        html.compact #mindmap-interact-text { top: calc(var(--vh) * 88); }
        html.compact .cluster-title { font-size: 1.15rem; }
        html.compact #collection-info {
            top: calc(var(--vh) * 10);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: calc(var(--vw) * 85);
            max-width: none;
        }
        html.compact .desktop-text { display: none; }
        html.compact .mobile-icon { display: block; width: 28px; height: 28px; color: #FFFFFF; }
        html.compact #close-btn {
            top: calc(var(--vh) * 3);
            right: calc(var(--vw) * 3);
            color: #FFFFFF;
        }
        html.compact #contact-btn.is-open { width: 150px; height: 176px; border-radius: 20px; }
        html.compact .contact-list { padding: 12px 8px; gap: 2px; }
        html.compact .contact-item { padding: 8px 12px; font-size: 14px; border-radius: 12px; }
        html.compact .contact-item svg, html.compact .be-logo { width: 16px; height: 16px; }
        html.compact .be-logo { font-size: 15px; }
        html.compact .scroll-instruction { top: calc(var(--vh) * 89); }

        /* ==========================================================================
           SCENE 3 (MIND MAP)
           ========================================================================== */
        #mindmap-canvas-container { width: 100%; height: 100%; display: block; }

        #mindmap-loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .morph-dots {
            width: 28px; height: 28px;
            animation: colorChange 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            --text-main: #FFFFFF;
            --text-muted: #777777;
        }
        .dots-group { transform-origin: 12px 12px; animation: rotateGroup 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-1 { animation: dot1 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-2 { animation: dot2 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-3 { animation: dot3 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-4 { animation: dot4 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-5 { animation: dot5 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes colorChange {
            0%, 9% { fill: var(--text-muted); }
            10%, 40% { fill: var(--text-main); }
            41%, 100% { fill: var(--text-muted); }
        }
        @keyframes rotateGroup {
            0%, 10% { transform: rotate(0deg); }
            40%, 100% { transform: rotate(180deg); }
        }
        @keyframes dot1 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(0px, -9.5px); } }
        @keyframes dot2 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(9.03px, -2.94px); } }
        @keyframes dot3 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(5.58px, 7.68px); } }
        @keyframes dot4 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(-5.58px, 7.68px); } }
        @keyframes dot5 { 0%, 50%, 100% { transform: translate(0, 0); } 10%, 40% { transform: translate(-9.03px, -2.94px); } }

        .loading-text {
            color: #FFFFFF; font-weight: 400; font-size: 1.125rem;
            margin-top: 16px;
            animation: pulseText 4s infinite ease-in-out;
        }

        @media (prefers-reduced-motion: reduce) {
            .scroll-instruction span,
            .loading-text,
            #mindmap-interact-text.fade-in { animation: none !important; }
            .welcome-text::after { animation: none; }
        }
    </style>
</head>
<body>

    <!-- ======================================================================
         SCENE 1: WEBGL LANDING
         ====================================================================== -->
    <div id="scene-one">
        <div id="webgl-module">
            <button id="home-btn" class="nav-btn" type="button">Joel Meshak</button>

            <div id="contact-btn" class="nav-btn" role="button" tabindex="0" aria-label="Contact details">
                <div class="contact-label">Contact</div>
                <div class="contact-list">
                    <div class="contact-item" data-copy="byjoelmeshak@gmail.com">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Email</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="https://www.instagram.com/byjoelmeshak/">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Instagram</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="https://www.behance.net/JoelMeshak">
                        <span class="be-logo">Bē</span>
                        <div class="item-text-wrapper">
                            <span class="original">Behance</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                    <div class="contact-item" data-copy="+254795330183">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <div class="item-text-wrapper">
                            <span class="original">Phone</span>
                            <span class="copied">Copied</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="welcome-title" class="welcome-text"></div>
            <div class="scroll-instruction" id="scroll-text"><span>Scroll Down</span></div>
            <div class="scroll-instruction" id="swipe-text"><span>Swipe to Navigate</span></div>
            <div id="labels-container"></div>
            <div id="canvas-container"></div>
        </div>
    </div>

    <!-- ======================================================================
         SCENE 2: COLLECTIONS (DOM only)
         ====================================================================== -->
    <div id="scene-two">
        <button id="scene-two-back-btn" class="nav-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </button>

        <div id="native-scroll-container">
            <div id="native-scroll-content"></div>
        </div>

        <div id="click-blocker"></div>

        <div id="collection-info">
            <h2 id="info-title">Title</h2>
            <p id="info-desc">Description goes here.</p>
        </div>

        <div id="close-btn" role="button" tabindex="0" aria-label="Close collection">
            <span class="desktop-text">
                Close
                <svg class="desktop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';

/* ==========================================================================
   0. SMALL MATH HELPERS
   ========================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a * (1 - t) + b * t;
const smoothstep = (min, max, value) => {
    const x = clamp((value - min) / (max - min), 0, 1);
    return x * x * (3 - 2 * x);
};

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Capability flag. This is a *device* decision, not a *layout* decision, so it
   is deliberately separate from viewport width. It never changes at runtime. */
const LOW_POWER = (() => {
    const mem = navigator.deviceMemory;
    const cores = navigator.hardwareConcurrency;
    if (typeof mem === 'number' && mem <= 4) return true;
    if (typeof cores === 'number' && cores <= 4) return true;
    return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
})();

/* ==========================================================================
   0b. IDLE SCHEDULER  (FIX 8)
   --------------------------------------------------------------------------
   The old code was:

       const requestIdle = window.requestIdleCallback || (cb => setTimeout(cb, 1));

   On Safari — i.e. most of the mobile traffic — requestIdleCallback did not
   exist, so every "idle" job actually ran on a 1ms timeout: the opposite of
   idle. Background image decoding therefore competed directly with rendering,
   which is a large part of the "stutters after load with no interaction"
   report.

   This replacement genuinely yields. It piggybacks on the render loop's own
   frame timing: work only runs when the previous frame came in under budget,
   and each idle callback gets a hard deadline it can check.
   ========================================================================== */
const Idle = (() => {
    const queue = [];
    let lastFrameMs = 16;
    let scheduled = false;
    const BUDGET_MS = 6;

    function pump() {
        scheduled = false;
        if (!queue.length) return;

        /* If the app is struggling, do nothing this frame. */
        if (lastFrameMs > 20) { schedule(); return; }

        const start = performance.now();
        const deadline = {
            timeRemaining: () => Math.max(0, BUDGET_MS - (performance.now() - start)),
            didTimeout: false
        };
        while (queue.length && deadline.timeRemaining() > 0.5) {
            const job = queue.shift();
            try { job(deadline); } catch (e) { console.error('[idle]', e); }
        }
        if (queue.length) schedule();
    }

    function schedule() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => setTimeout(pump, 0));
    }

    return {
        run(fn) { queue.push(fn); schedule(); },
        note(frameMs) { lastFrameMs = frameMs; },
        get pending() { return queue.length; }
    };
})();

/* Back-compat shim for the few call sites that just want "later, politely". */
const requestIdle = (cb) => Idle.run(cb);

/* ==========================================================================
   1. VIEWPORT — THE SINGLE SOURCE OF TRUTH
   --------------------------------------------------------------------------
   This is the ONLY place in the application that reads window.innerWidth,
   window.innerHeight or window.visualViewport.

   FIX 13: the mobile URL bar collapsing changes visualViewport.height by
   50-120px mid-scroll. Previously EVERY such change triggered layoutScene1()
   -> renderer.setSize() -> framebuffer + transmission-target reallocation,
   producing a guaranteed stutter on the first swipe of every session.

   Now there are two tiers:
     - CSS custom properties (--vh/--vw) update on every read, so layout that
       depends on them stays exact and cheap.
     - Heavy subscribers (renderer resize, camera fits, grid relayout) are
       only notified when the change is MEANINGFUL: any width change, a dpr
       change, an orientation flip, or a height change larger than
       URL_BAR_TOLERANCE.
   ========================================================================== */
const URL_BAR_TOLERANCE = 130;   // px — larger than any mobile browser chrome

const Viewport = (() => {
    const subscribers = new Set();
    let pending = false;

    /* The height the heavy subscribers were last sized to. Distinct from
       state.height, which tracks the live value for CSS. */
    let committedHeight = 0;
    let committedWidth = 0;
    let committedDpr = 0;

    const state = {
        width: 0,
        height: 0,
        dpr: 1,
        aspect: 1,
        t: 0,
        columns: 3,
        compact: false,
        orientation: 'landscape'
    };

    function read() {
        const vv = window.visualViewport;
        const w = Math.round(vv ? vv.width : window.innerWidth);
        const h = Math.round(vv ? vv.height : window.innerHeight);
        return { w, h };
    }

    const MIN_CARD_PX = 260;
    const GAP_FACTOR = 1.30;

    /* Returns true when the change is big enough to warrant a full relayout. */
    function recompute() {
        const { w, h } = read();
        const dpr = window.devicePixelRatio || 1;

        const anyChange = (w !== state.width || h !== state.height || dpr !== state.dpr);
        if (!anyChange) return false;

        state.width = w;
        state.height = h;
        state.dpr = dpr;
        state.aspect = w / h;
        state.orientation = w >= h ? 'landscape' : 'portrait';
        state.t = clamp((state.aspect - 0.50) / (1.40 - 0.50), 0, 1);
        state.columns = clamp(Math.floor(w / (MIN_CARD_PX * GAP_FACTOR)), 1, 3);
        state.compact = state.columns === 1;

        /* CSS always tracks the live viewport. This is cheap. */
        const root = document.documentElement;
        root.style.setProperty('--vh', (h / 100) + 'px');
        root.style.setProperty('--vw', (w / 100) + 'px');
        root.classList.toggle('compact', state.compact);

        const widthChanged = w !== committedWidth;
        const dprChanged = dpr !== committedDpr;
        const heightDelta = Math.abs(h - committedHeight);
        const meaningful = widthChanged || dprChanged || heightDelta > URL_BAR_TOLERANCE;

        if (!meaningful) return false;

        committedWidth = w;
        committedHeight = h;
        committedDpr = dpr;
        return true;
    }

    function schedule() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => {
            pending = false;
            if (recompute()) {
                subscribers.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });
            }
        });
    }

    window.addEventListener('resize', schedule, { passive: true });
    window.addEventListener('orientationchange', schedule, { passive: true });
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', schedule, { passive: true });
    }

    recompute();

    return {
        state,
        get width() { return state.width; },
        get height() { return state.height; },
        get aspect() { return state.aspect; },
        get t() { return state.t; },
        get columns() { return state.columns; },
        get compact() { return state.compact; },
        get dpr() { return state.dpr; },
        onChange(fn) { subscribers.add(fn); return () => subscribers.delete(fn); },
        refresh: schedule,
        /* Escape hatch: forces the next recompute to be treated as meaningful.
           Used when a scene mounts and must be sized exactly. */
        invalidate() { committedHeight = -99999; }
    };
})();

const V = Viewport;

/* ==========================================================================
   1b. PIXEL RATIO  (FIX 2 + the flat 1.5 cap)
   --------------------------------------------------------------------------
   ONE ceiling for the whole app. Previously scene 3 was allowed 2.0 on the
   grounds that its fill cost is trivial — but with antialias:true a DPR of 2
   means a 4x-MSAA buffer at 4x the pixels of DPR 1, i.e. roughly 8x the
   framebuffer bytes, in the scene that is already the memory hotspot. 1.5 is
   still 2.25x the pixel count of DPR 1 and is visually indistinguishable for
   this content at phone viewing distance.

   THE GOVERNOR WAS THE STARTUP STUTTER. three.js's setPixelRatio() internally
   calls setSize(), which reallocates the drawing buffer, the MSAA buffers and
   the transmission render target. The old governor started judging at ~0.7s,
   evaluated every 1s, and could both drop AND raise quality — so during the
   naturally-slow boot window it fired repeatedly, each time causing exactly
   the stutter it was trying to prevent.

   Changes:
     - GRACE_S: no sampling at all for the first 4 seconds.
     - Requires 3 consecutive bad windows before dropping (not 1).
     - Never raises quality back up automatically. One decision, downward only.
     - Only applies to the renderer of the CURRENTLY VISIBLE scene. The hidden
       renderer is marked dirty and updated when its scene is entered.
   ========================================================================== */
const DPR_CAP = 1.5;
const GOVERNOR_GRACE_S = 4.0;

const Governor = (() => {
    const consumers = new Map();   // key -> { apply, scene, dirty }
    const samples = new Float32Array(60);
    let n = 0, filled = false;
    let quality = 1.0;             // 0.6 .. 1.0, monotonically non-increasing
    let lastChange = -Infinity;
    let badStreak = 0;

    function ratioFor() {
        return clamp(Math.min(V.dpr, DPR_CAP) * quality, 1.0, DPR_CAP);
    }

    function applyActive() {
        const r = ratioFor();
        consumers.forEach((c) => {
            if (c.scene === Router.scene) { c.dirty = false; c.apply(r); }
            else c.dirty = true;
        });
    }

    function p95() {
        const len = filled ? samples.length : n;
        if (len < 40) return 0;
        const copy = Array.prototype.slice.call(samples, 0, len).sort((a, b) => a - b);
        return copy[Math.floor(len * 0.95)];
    }

    return {
        register(key, scene, apply) {
            consumers.set(key, { apply, scene, dirty: false });
            apply(ratioFor());
        },
        unregister(key) { consumers.delete(key); },
        /* Called when a scene becomes visible, so a renderer that was skipped
           while hidden picks up the current quality without a mid-scene resize. */
        refresh(key) {
            const c = consumers.get(key);
            if (c && c.dirty) { c.dirty = false; c.apply(ratioFor()); }
        },
        ratioFor,
        sample(dt, time) {
            /* FIX 2: the boot window is slow by nature (PMREM, shader compile,
               first image decodes). Judging it produces false positives. */
            if (time < GOVERNOR_GRACE_S) return;

            samples[n++] = dt * 1000;
            if (n >= samples.length) { n = 0; filled = true; }
            if (time - lastChange < 2.0) return;

            const worst = p95();
            if (worst === 0) return;

            if (worst > 22) {
                badStreak += 1;
                if (badStreak >= 3 && quality > 0.6) {
                    quality = Math.max(0.6, quality - 0.15);
                    lastChange = time;
                    badStreak = 0;
                    console.info('[governor] quality ->', quality.toFixed(2), 'p95', worst.toFixed(1) + 'ms');
                    applyActive();
                }
            } else {
                badStreak = 0;
            }
        },
        get quality() { return quality; }
    };
})();

/* ==========================================================================
   1c. CONTEXT LOSS GUARD  (FIX: intentional disposal is not a crash)
   --------------------------------------------------------------------------
   preventDefault() on webglcontextlost is required or restore never fires, and
   a real unrecoverable loss must still surface the reload affordance.

   THE REGRESSION THIS FIXES: Scene3.unmount() deliberately calls
   loseContext() to make the driver reclaim the mind map's framebuffer
   immediately. That fired this handler, which had no idea the loss was
   intentional, started its 5s recovery timer, and — because the canvas was
   already detached and the renderer disposed — could never receive
   webglcontextrestored. Five seconds later the "Graphics stopped responding"
   overlay appeared over whatever scene the user had since navigated to,
   which is why it looked like opening a glass folder had crashed the page.

   Now:
     - markDisposing() is set before any intentional teardown; the handler
       returns immediately when it is set.
     - destroy() removes the listeners and clears any pending timer, so an
       unmounted renderer cannot raise an alarm at all.
     - Recovery state is tracked PER RENDERER and the overlay is only shown
       when the failing renderer belongs to the scene the user is actually
       looking at. A mind-map failure can no longer paint over scene 1.
   ========================================================================== */
const RECOVERY_GRACE_MS = 5000;
const lostContexts = new Set();     // labels currently in a lost state
const failedContexts = new Map();   // label -> scene, for unrecoverable losses

function syncRecoveryUI() {
    const root = document.documentElement;
    root.classList.toggle('gl-lost', lostContexts.size > 0);

    let showOverlay = false;
    failedContexts.forEach((scene) => { if (scene === Router.scene) showOverlay = true; });
    root.classList.toggle('gl-unrecoverable', showOverlay);
}

function guardContext(renderer, label, scene, onRestore) {
    const canvas = renderer.domElement;
    let timer = null;
    let disposing = false;

    const onLost = (e) => {
        /* Intentional teardown — not an error, not a user-visible event. */
        if (disposing) return;

        e.preventDefault();
        console.warn(`[${label}] WebGL context lost; awaiting restore.`);
        lostContexts.add(label);
        syncRecoveryUI();

        clearTimeout(timer);
        timer = setTimeout(() => {
            if (disposing) return;
            console.error(`[${label}] context did not restore within ${RECOVERY_GRACE_MS}ms.`);
            failedContexts.set(label, scene);
            syncRecoveryUI();
        }, RECOVERY_GRACE_MS);
    };

    const onRestored = () => {
        if (disposing) return;
        console.warn(`[${label}] WebGL context restored.`);
        clearTimeout(timer);
        lostContexts.delete(label);
        failedContexts.delete(label);
        syncRecoveryUI();
        renderer.setPixelRatio(Governor.ratioFor());
        renderer.setSize(V.width, V.height, false);
        if (onRestore) onRestore();
    };

    canvas.addEventListener('webglcontextlost', onLost, false);
    canvas.addEventListener('webglcontextrestored', onRestored, false);

    return {
        /* Call BEFORE any deliberate loseContext()/dispose(). */
        markDisposing() { disposing = true; },
        destroy() {
            disposing = true;
            clearTimeout(timer);
            canvas.removeEventListener('webglcontextlost', onLost, false);
            canvas.removeEventListener('webglcontextrestored', onRestored, false);
            lostContexts.delete(label);
            failedContexts.delete(label);
            syncRecoveryUI();
        }
    };
}

/* ==========================================================================
   2. FIT — ONE FUNCTION, USED BY EVERY SCENE
   ========================================================================== */
function fitDistance(designW, designH, fovDeg, padRatio) {
    const halfTan = Math.tan(fovDeg * Math.PI / 360);
    const byWidth = (designW * (1 + padRatio) / 2) / (halfTan * V.aspect);
    const byHeight = (designH * (1 + padRatio) / 2) / halfTan;
    return Math.max(byWidth, byHeight);
}

function visibleSizeAt(distance, fovDeg) {
    const halfTan = Math.tan(fovDeg * Math.PI / 360);
    const h = 2 * halfTan * distance;
    return { w: h * V.aspect, h };
}

/* ==========================================================================
   3. SCHEDULER — ONE rAF LOOP FOR THE WHOLE APP
   ========================================================================== */
const Router = {
    scene: 1,
    forceField: 0
};

const Loop = (() => {
    const clock = new THREE.Clock();
    let time = 0;
    const handlers = { 1: null, 2: null, 3: null };

    function tick() {
        /* rAF is scheduled FIRST so a throwing handler cannot kill the loop. */
        requestAnimationFrame(tick);
        const dt = Math.min(clock.getDelta(), 0.1);
        time += dt;
        Idle.note(dt * 1000);
        const h = handlers[Router.scene];
        if (h) {
            try { h(dt, time); }
            catch (e) { console.error('[loop] scene', Router.scene, e); }
        }
        Governor.sample(dt, time);
    }

    return {
        register(scene, fn) { handlers[scene] = fn; },
        start() { tick(); },
        get time() { return time; }
    };
})();
